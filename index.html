<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Предложения · Фракции · Работы и прочее</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0e14;
  --bg2:#111620;
  --card:#161d29;
  --card-even:#1e2738;
  --line:#252f42;
  --line-even:#344560;
  --txt:#ecf0f8;
  --mut:#8b96ab;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
}
html{color-scheme:dark}
body{
  background:
    radial-gradient(1200px 600px at 12% -10%,rgba(45,100,180,.18),transparent 60%),
    radial-gradient(1000px 550px at 105% 110%,rgba(120,80,220,.12),transparent 55%),
    #0b0e14;
  color:var(--txt);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:14px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#283244;border-radius:8px;border:2px solid #0e131b}
::-webkit-scrollbar-thumb:hover{background:#38465e}

#top{
  position:sticky;
  top:0;
  z-index:200;
  height:56px;
  background:rgba(13,17,24,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:#dbe7ff}
.logo{
  width:32px;
  height:32px;
  border-radius:10px;
  background:linear-gradient(135deg,#4da3ff,#6d5dfc);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  box-shadow:0 4px 14px rgba(77,163,255,.35);
}
#topRight{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#141a24;
  color:var(--mut);
  font-size:12px;
  font-weight:700;
}
.pill .gdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.btn{
  background:linear-gradient(145deg,#3684e6,#2563eb);
  border:1px solid #3d75c4;
  color:#fff;
  padding:8px 15px;
  border-radius:10px;
  font-weight:700;
  font-size:12.5px;
  cursor:pointer;
  font-family:inherit;
  transition:all .18s;
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.ghost{background:#151c27;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:#3a4a63}
.btn.warn{background:linear-gradient(145deg,#b93838,#8c2626);border-color:#c24646}
.btn.slim{padding:6px 12px;font-size:11.5px}

#wrap{
  max-width:1460px;
  width:100%;
  margin:0 auto;
  display:grid;
  grid-template-columns:250px 1fr;
  gap:24px;
  padding:22px;
  flex:1;
}
#side{
  position:sticky;
  top:76px;
  align-self:start;
  background:rgba(18,23,32,.75);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 10px;
}
.s-grp{
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.4px;
  color:#647187;
  padding:8px 12px 6px;
}
.s-grp:not(:first-child){margin-top:10px;border-top:1px solid rgba(255,255,255,.05);padding-top:14px}
.s-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:11px;
  border:1px solid transparent;
  background:transparent;
  color:var(--mut);
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
  text-align:left;
  transition:all .16s;
  margin-bottom:3px;
}
.s-btn:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.s-btn.on{
  color:#fff;
  background:linear-gradient(90deg,rgba(77,163,255,.22),rgba(77,163,255,.05));
  border-color:rgba(77,163,255,.4);
}
.s-cnt{
  margin-left:auto;
  background:#1f293a;
  border:1px solid #2e3d56;
  color:#a8c1e8;
  font-size:11px;
  font-weight:800;
  padding:1px 8px;
  border-radius:10px;
}

.ph{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.ph h1{font-size:22px;font-weight:800}
.ph-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.inp,.sel{
  background:#131923;
  border:1px solid var(--line);
  color:var(--txt);
  padding:10px 14px;
  border-radius:11px;
  font-size:13.5px;
  font-family:inherit;
  outline:none;
  transition:border-color .18s;
}
.inp:focus,.sel:focus{border-color:var(--acc)}

#items{display:flex;flex-direction:column;gap:14px}

/* ЧЕРЕДОВАНИЕ ЦВЕТОВ ЯЧЕЕК ПРЕДЛОЖЕНИЙ (ЗЕБРА) */
.icard{
  border-radius:16px;
  padding:18px 20px;
  transition:all .2s;
  position:relative;
}
#items > .icard:nth-child(odd){
  background:linear-gradient(145deg,#151c27,#111720);
  border:1px solid #243044;
  border-left:4px solid #385d8a;
}
#items > .icard:nth-child(even){
  background:linear-gradient(145deg,#1f293b,#182130);
  border:1px solid #354764;
  border-left:4px solid #4da3ff;
  box-shadow:inset 0 1px 0 rgba(77,163,255,.1),0 8px 24px rgba(0,0,0,.32);
}
#items > .icard:hover{
  border-color:#58aaff;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}

.ic-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ic-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:rgba(77,163,255,.14);
  border:1px solid rgba(77,163,255,.35);
  color:#93c5fd;
}
/* Выпадающий список быстрой смены категории прямо на карточке (для владельца) */
.ic-cat-sel{
  background:rgba(77,163,255,.14);
  border:1px solid rgba(77,163,255,.45);
  color:#93c5fd;
  padding:3px 9px;
  border-radius:8px;
  font-size:11.5px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  outline:none;
}
.ic-cat-sel option{background:#131923;color:#fff}

.ic-app-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:rgba(47,217,122,.14);
  border:1px solid rgba(47,217,122,.35);
  color:#6ee7b7;
}
.ic-media-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:rgba(247,201,72,.12);
  border:1px solid rgba(247,201,72,.35);
  color:#fcd34d;
}
.ic-title{font-size:17px;font-weight:800;color:#fff;margin-bottom:10px;line-height:1.35}

/* Панель кнопок сразу под заголовком предложения (кнопка Открыть / Скрыть не прыгает!) */
.ic-actions-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  padding-top:10px;
  border-top:1px dashed rgba(255,255,255,.08);
}

/* Скрытое/раскрываемое описание под кнопкой */
.ic-desc-box{
  display:none;
  margin-top:12px;
  padding:14px 16px;
  border-radius:12px;
  background:rgba(11,14,20,.65);
  border:1px solid rgba(255,255,255,.07);
  font-size:13.5px;
  color:#dbe4f3;
  line-height:1.65;
}
.ic-desc-box.open{display:block;animation:fadeIn .18s}
.ic-desc-text{white-space:pre-line}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}}

/* Таблицы внутри описания */
.rank-table-wrap{overflow-x:auto;margin-top:12px;white-space:normal}
.rank-table{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid #2b384e;border-radius:10px;overflow:hidden}
.rank-table th{background:#1d2738;color:#93c5fd;font-weight:800;text-align:left;padding:10px 12px;border-bottom:1px solid #2e3d56;text-transform:uppercase;font-size:11px;letter-spacing:.6px}
.rank-table td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.06);color:#e2e8f0;vertical-align:top}
.rank-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.rank-table tr:hover td{background:rgba(77,163,255,.08)}

/* ГАЛЕРЕЯ ДО 10 ФОТО/ВИДЕО ПОД ОПИСАНИЕМ */
.media-sec{
  margin-top:16px;
  padding-top:14px;
  border-top:1px dashed rgba(255,255,255,.1);
}
.media-sec-hdr{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.media-sec-title{
  font-size:11.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:#93c5fd;
}
.media-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px;
}
.media-item{
  position:relative;
  aspect-ratio:16/10;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #2b384e;
  background:#0d121a;
  cursor:zoom-in;
  transition:transform .18s,border-color .18s;
}
.media-item:hover{
  transform:translateY(-2px);
  border-color:#4da3ff;
}
.media-item img,.media-item video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.media-play-badge{
  position:absolute;
  left:8px;
  bottom:8px;
  background:rgba(10,14,20,.85);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  padding:3px 8px;
  border-radius:7px;
  font-size:10.5px;
  font-weight:800;
  pointer-events:none;
}
.media-del-btn{
  position:absolute;
  top:7px;
  right:7px;
  z-index:5;
  background:rgba(185,28,28,.92);
  border:1px solid #f87171;
  color:#fff;
  padding:4px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.6);
  transition:.15s;
}
.media-del-btn:hover{
  background:#dc2626;
  transform:scale(1.06);
}
.media-add-slot{
  aspect-ratio:16/10;
  border-radius:12px;
  border:1.5px dashed #364966;
  background:rgba(20,28,42,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#8b96ab;
  cursor:pointer;
  transition:.18s;
  text-align:center;
  padding:10px;
}
.media-add-slot:hover{
  border-color:#4da3ff;
  color:#fff;
  background:rgba(77,163,255,.08);
}

/* ПОЛНОЭКРАННЫЙ ПРОСМОТР ФОТО И ВИДЕО */
#mediaLb{
  position:fixed;
  inset:0;
  z-index:950;
  background:rgba(4,7,12,.92);
  backdrop-filter:blur(10px);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}
#mediaLb.show{display:flex;animation:fadeIn .2s}
.mlb-top{
  position:fixed;
  top:18px;
  left:24px;
  right:24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:960;
  pointer-events:none;
}
.mlb-cap{
  pointer-events:auto;
  background:rgba(15,20,29,.88);
  border:1px solid #2e3d56;
  color:#fff;
  padding:8px 14px;
  border-radius:10px;
  font-weight:800;
  font-size:13px;
}
.mlb-close{
  pointer-events:auto;
  background:linear-gradient(145deg,#dc2626,#991b1b);
  border:1px solid #fca5a5;
  color:#fff;
  padding:9px 18px;
  border-radius:11px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.6);
}
.mlb-content{
  max-width:95vw;
  max-height:86vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.mlb-content img,.mlb-content video{
  max-width:95vw;
  max-height:85vh;
  border-radius:14px;
  border:1px solid #33445e;
  box-shadow:0 30px 90px rgba(0,0,0,.85);
  background:#000;
}

.ic-tools{display:flex;gap:6px}

.back{
  position:fixed;
  inset:0;
  background:rgba(4,7,12,.82);
  backdrop-filter:blur(8px);
  z-index:500;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow-y:auto;
  padding:24px 16px;
}
.modal{
  width:100%;
  max-width:1180px;
  background:#141a24;
  border:1px solid #2b3648;
  border-radius:18px;
  box-shadow:0 30px 90px rgba(0,0,0,.75);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.modal.app-modal{max-width:1420px;height:calc(100vh - 48px)}
.m-head{
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(180deg,rgba(77,163,255,.08),transparent);
}
.mh-title{font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px}
.m-close{
  background:#231b24;
  border:1px solid #6e2c35;
  color:#fda4af;
  width:32px;
  height:32px;
  border-radius:9px;
  cursor:pointer;
  font-size:14px;
  font-weight:800;
}
.m-close:hover{background:#9f1239;color:#fff}
.m-body{padding:20px;overflow-y:auto;flex:1}
.m-body.iframe-wrap{padding:0;display:flex;flex-direction:column;overflow:hidden}
.app-iframe{width:100%;height:100%;border:0;flex:1;background:#0e1116}
.m-foot{padding:14px 20px;border-top:1px solid var(--line);background:#10151e;display:flex;justify-content:flex-end;gap:10px}
.flab{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:12px 0 6px}
.flab:first-child{margin-top:0}

#troot{position:fixed;right:18px;bottom:18px;z-index:800;display:flex;flex-direction:column;gap:8px}
.toast{background:#1b2432;border:1px solid #32445e;border-left:3px solid var(--acc);padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.warn{border-left-color:var(--red)}
.empty{padding:36px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}

@media(max-width:860px){
  #wrap{grid-template-columns:1fr;padding:14px}
  #side{position:static}
}
</style>
<script src="js/config.js"></script>
</head>
<body>

<header id="top">
  <div class="brand">
    <div class="logo">💡</div>
    <div>ПРЕДЛОЖЕНИЯ · ФРАКЦИИ · РАБОТЫ И ПРОЧЕЕ</div>
  </div>
  <div id="topRight"></div>
</header>

<div id="wrap">
  <aside id="side"></aside>
  <main id="content">
    <div class="ph">
      <h1 id="pageTitle">Все предложения</h1>
      <div id="pageActions"></div>
    </div>
    <div class="ph-ctl">
      <input class="inp" id="searchInp" style="flex:1;min-width:240px" placeholder="🔍 Поиск по заголовку или описанию предложения…">
    </div>
    <div id="items"></div>
  </main>
</div>

<input type="file" id="ideaMediaInp" accept="image/*,video/*" multiple style="display:none">

<div id="mediaLb" onclick="if(event.target===this)closeMediaLb()">
  <div class="mlb-top">
    <div class="mlb-cap" id="mlbCap">Просмотр медиафайла</div>
    <button class="mlb-close" onclick="closeMediaLb()">✕ Закрыть (ESC)</button>
  </div>
  <div class="mlb-content" id="mlbBox"></div>
</div>

<div id="mroot"></div>
<div id="troot"></div>

<script>
/* ===================== АВТООПРЕДЕЛЕНИЕ РЕПОЗИТОРИЯ ===================== */
var REPO = (function() {
  var h = location.hostname, p = location.pathname;
  if (!/\.github\.io$/.test(h)) return 'noxyholmes/mta-province-ideas';
  var owner = h.replace(/\.github\.io$/, '');
  var seg = p.split('/').filter(Boolean);
  return owner + '/' + (seg.length ? seg[0] : (owner + '.github.io'));
})();
var BRANCH = 'main';
var IDEAS_DATA_FILE = 'ideas_data.json';

/* ===================== ФРАКЦИИ И РАЗДЕЛЫ ЛЕВОГО МЕНЮ ===================== */
var SECTIONS = [
  { k: 'all',     grp: 'main', ic: '📋', n: 'Все предложения' },
  { k: 'general', grp: 'main', ic: '💡', n: 'Общие' },
  { k: 'mvd',     grp: 'main', ic: '🚓', n: 'МВД' },
  { k: 'mo',      grp: 'main', ic: '🎖️', n: 'Минобороны' },
  { k: 'mz',      grp: 'main', ic: '🚑', n: 'Минздрав' },
  { k: 'mt',      grp: 'main', ic: '🚆', n: 'Минтранс' },
  { k: 'opg',     grp: 'main', ic: '🔫', n: 'ОПГ' },
  { k: 'other',   grp: 'main', ic: '📦', n: 'Прочее' },
  { k: 'jobs',    grp: 'sub',  ic: '💼', n: 'Работы и прочее' }
];

function secInfo(k) {
  for (var i = 0; i < SECTIONS.length; i++) {
    if (SECTIONS[i].k === k) return SECTIONS[i];
  }
  return SECTIONS[1];
}

/* ===================== ПРЕДЗАГРУЗКА ЧИСТОГО GARAGE.HTML (ЧТОБЫ НИКОГДА НЕ ПОКАЗЫВАЛОСЬ РАДИАЛЬНОЕ МЕНЮ ПРИ ОТКРЫТИИ АВТОПАРКА) ===================== */
var CLEAN_GARAGE_HTML_CACHE = null;
var GARAGE_FILE_IS_CORRUPTED = false;

function preloadCleanGarageHtml() {
  if (!REPO) return;
  fetch('apps/garage.html?check=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.ok ? r.text() : ''; })
    .then(function(txt) {
      /* Если в apps/garage.html случайно сохранён код радиального меню (radialWrap) вместо автопарка (vgrid) */
      if (txt && txt.indexOf('radialWrap') >= 0 && txt.indexOf('vgrid') < 0) {
        GARAGE_FILE_IS_CORRUPTED = true;
        return fetch('https://api.github.com/repos/' + REPO + '/commits?path=apps/garage.html&per_page=20&_t=' + Date.now())
          .then(function(r) { return r.ok ? r.json() : []; })
          .then(function(commits) {
            var idx = 0;
            function findCleanCommit() {
              if (idx >= commits.length) return;
              var sha = commits[idx++].sha;
              fetch('https://raw.githubusercontent.com/' + REPO + '/' + sha + '/apps/garage.html')
                .then(function(r) { return r.ok ? r.text() : ''; })
                .then(function(oldHtml) {
                  if (oldHtml && oldHtml.indexOf('vgrid') >= 0 && oldHtml.indexOf('radialWrap') < 0) {
                    CLEAN_GARAGE_HTML_CACHE = oldHtml;
                  } else {
                    findCleanCommit();
                  }
                }).catch(findCleanCommit);
            }
            findCleanCommit();
          });
      }
    }).catch(function() {});
}
preloadCleanGarageHtml();

var REPO_ALL_FILES = [];
var EXTERNAL_SEED_FN = (typeof window.seed === 'function') ? window.seed : null;

var RANKS_REFORM_TABLE_HTML =
  '<div class="rank-table-wrap">' +
    '<table class="rank-table">' +
      '<thead>' +
        '<tr>' +
          '<th>Ранг</th>' +
          '<th>МВД (УМВД / ГИБДД)</th>' +
          '<th>Минобороны (ВС РФ)</th>' +

/* ===================== ТОЧНАЯ ПРИВЯЗКА КАЖДОГО ПРЕДЛОЖЕНИЯ К СВОЕМУ МОДУЛЮ БЕЗ ПУТАНИЦЫ ===================== */
function autoBindAppUrl(it) {
  if (!it || typeof it !== 'object') return;
  var t = String(it.title || '').toLowerCase();
  var id = String(it.id || '').toLowerCase();
  var cur = String(it.appUrl || it.app || it.iframe || '').trim();

  /* 1. АВТОПАРК И ФОРМА — строго apps/garage.html */
  if (id === 's2' || t.indexOf('автопарк') >= 0 || t.indexOf('форма фракц') >= 0) {
    it.appUrl = 'apps/garage.html';
    return;
  }

  /* 2. РЕФОРМА РАНГОВ И ПОГОНЫ — строго apps/epaulettes.html */
  if (t.indexOf('погон') >= 0 || t.indexOf('реформа системы рангов') >= 0 || t.indexOf('иерарх') >= 0) {
    it.appUrl = 'apps/epaulettes.html';
    if (!it.tableHtml && t.indexOf('ранг') >= 0) {
      it.tableHtml = RANKS_REFORM_TABLE_HTML;
    }
    return;
  }

  /* 3. РАДИАЛЬНОЕ МЕНЮ / НАРУЧНИКИ / ВЗЛОМ НАРУЧНИКОВ — единый apps/mvd-radial.html для общей синхронизации! */
  if (t.indexOf('радиальн') >= 0 || t.indexOf('наручник') >= 0 || id === 's_radial' || id === 's_cuffs_rework' || id === 's_lockpick_cuffs') {
    it.appUrl = 'apps/mvd-radial.html';
    return;
  }

  /* 4. ФУНКЦИОНАЛЬНОЕ ФРАКЦИОННОЕ ПРИЛОЖЕНИЕ — строго фракционное приложение (НЕ банк!) */
  if (t.indexOf('фракционное приложение') >= 0 || id === 's_faction_app') {
    var facFile = REPO_ALL_FILES.find(function(f) { return /^apps\/(faction|mvd-app|fraction)/i.test(f); });
    it.appUrl = facFile || 'builtin:faction-app';
    return;
  }

  /* 5. БАНКОВСКАЯ СИСТЕМА И БАНКОВСКОЕ ПРИЛОЖЕНИЕ */
  if (t.indexOf('банк') >= 0 || id === 's_bank_system' || /bank/i.test(cur)) {
    var bankFile = REPO_ALL_FILES.find(function(f) { return /^apps\/.*bank.*\.html$/i.test(f); });
    it.appUrl = bankFile || 'builtin:bank';
    return;
  }

  /* 6. РАСШИРЕННАЯ СТАТИСТИКА ПЕРСОНАЖА: СЧЁТЧИК ЧИСТОГО ОНЛАЙНА И УЧЁТ ДОХОДОВ/РАСХОДОВ */
  if (t.indexOf('статистик') >= 0 || t.indexOf('чистого онлайна') >= 0 || t.indexOf('доходов/расходов') >= 0 || id === 's_char_stats' || /stat/i.test(cur)) {
    var statFile = REPO_ALL_FILES.find(function(f) { return /^apps\/.*stat.*\.html$/i.test(f); });
    it.appUrl = statFile || 'builtin:stats';
    return;
  }

  /* 7. УЛУЧШЕНИЕ ТЕЛЕФОНА */
  if (t.indexOf('телефон') >= 0 || id === 's_phone_upgrade' || /phone/i.test(cur)) {
    var phoneFile = REPO_ALL_FILES.find(function(f) { return /^apps\/.*phone.*\.html$/i.test(f); });
    it.appUrl = phoneFile || 'builtin:phone';
    return;
  }

  /* Если указан другой .html файл — проверяем, существует ли он реально в списке REPO_ALL_FILES */
  if (cur && cur.indexOf('builtin:') !== 0) {
    var clean = cur.replace(/^apps\//i, '').replace(/\.html.*$/i, '').toLowerCase();
    var exactMatch = REPO_ALL_FILES.find(function(f) {
      var base = f.replace(/^.*\//, '').replace(/\.html$/i, '').toLowerCase();
      return base === clean;
    });
    if (exactMatch) {
      it.appUrl = exactMatch;
    } else if (cur !== 'apps/garage.html' && cur !== 'apps/mvd-radial.html' && cur !== 'apps/epaulettes.html') {
      /* Если файла не существует в репозитории — убираем битую ссылку, чтобы не было ошибки 404 */
      delete it.appUrl;
    }
  }
}

function scanRepoTree() {
  if (!REPO) return Promise.resolve();
  return fetch('https://api.github.com/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1&_t=' + Date.now())
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(j) {
      if (!j || !Array.isArray(j.tree)) return;
      REPO_ALL_FILES = [];
      j.tree.forEach(function(node) {
        if (node && node.path && /\.html$/i.test(node.path) && node.path !== 'index.html') {
          REPO_ALL_FILES.push(node.path);
        }
      });
      window.ITEMS.forEach(autoBindAppUrl);
      render();
    }).catch(function() {});
}

/* ===================== INDEXEDDB ДЛЯ ХРАНЕНИЯ ИДЕЙ И ДО 10 ФОТО/ВИДЕО ===================== */
var IDEAS_IDB_NAME = 'mta_ideas_media_db_v1';
var IDEAS_IDB_STORE = 'ideas_store';

function openIdeasIdb() {
  return new Promise(function(resolve, reject) {
    if (!window.indexedDB) { reject(new Error('no idb')); return; }
    var req = window.indexedDB.open(IDEAS_IDB_NAME, 1);
    req.onupgradeneeded = function(ev) {
      var db = ev.target.result;
      if (!db.objectStoreNames.contains(IDEAS_IDB_STORE)) {
        db.createObjectStore(IDEAS_IDB_STORE);
      }
    };
    req.onsuccess = function(ev) { resolve(ev.target.result); };
    req.onerror = function() { reject(req.error); };
  });
}

function saveIdeasToIdb() {
  return openIdeasIdb().then(function(db) {
    return new Promise(function(resolve) {
      try {
        var tx = db.transaction(IDEAS_IDB_STORE, 'readwrite');
        var st = tx.objectStore(IDEAS_IDB_STORE);
        st.put({ items: window.ITEMS, savedAt: Date.now() }, 'current_ideas');
        tx.oncomplete = function() { resolve(true); };
        tx.onerror = function() { resolve(false); };
      } catch (e) { resolve(false); }
    });
  }).catch(function() { return false; });
}

function loadIdeasFromIdb() {
  return openIdeasIdb().then(function(db) {
    return new Promise(function(resolve) {
      try {
        var tx = db.transaction(IDEAS_IDB_STORE, 'readonly');
        var st = tx.objectStore(IDEAS_IDB_STORE);
        var r = st.get('current_ideas');
        r.onsuccess = function() { resolve(r.result || null); };
        r.onerror = function() { resolve(null); };
      } catch (e) { resolve(null); }
    });
  }).catch(function() { return null; });
}

function toArr(x) {
  if (!x) return null;
  if (Array.isArray(x)) return x;
  if (typeof x === 'object') {
    var ks = Object.keys(x).sort(function(a, b) { return a - b; });
    var res = [];
    for (var i = 0; i < ks.length; i++) res.push(x[ks[i]]);
    return res;
  }
  return null;
}

function isRealIdeaItem(it) {
  if (!it || typeof it !== 'object') return false;
  if (it.kind === 'cars' || it.kind === 'form' || it.dep || typeof it.speed !== 'undefined') return false;
  if (it.id && DELETED_IDEA_IDS[it.id]) return false;
  var title = String(it.title || it.name || '').replace(/\s+/g, ' ').trim();
  var text  = String(it.text || it.desc || it.body || '').replace(/\s+/g, ' ').trim();
  if (!title || title === 'Без названия' || title === '—' || title === 'null' || title === 'undefined') return false;
  var hasMedia = (Array.isArray(it.images) && it.images.length > 0) ||
                 (Array.isArray(it.videos) && it.videos.length > 0) ||
                 !!it.appUrl || !!it.app || !!it.iframe || !!it.tableHtml;
  if (!text && !hasMedia) return false;
  return true;
}

function ensureMediaList(it) {
  if (!it) return [];
  if (!Array.isArray(it.images)) it.images = [];
  if (!Array.isArray(it.videos)) it.videos = [];
  if (it.photo && typeof it.photo === 'string' && it.images.indexOf(it.photo) < 0) {
    it.images.push(it.photo);
    delete it.photo;
  }
  var combined = [];
  it.images.forEach(function(src) {
    if (src && typeof src === 'string') combined.push({ type: 'image', src: src });
  });
  it.videos.forEach(function(src) {
    if (src && typeof src === 'string') combined.push({ type: 'video', src: src });
  });
  return combined.slice(0, 10);
}

function syncMediaListBack(it, mediaArr) {
  it.images = [];

function mergeAndCleanIdeas(lists) {
  var byKey = {};
  var out = [];

  /* Пользовательские списки идут ПЕРВЫМИ, чтобы изменённая владельцем категория (fac) сохранялась! */
  var allSources = (lists || []).concat([baseSeedIdeas()]);
  allSources.forEach(function(arr) {
    var a = toArr(arr);
    if (!a || !a.length) return;
    a.forEach(function(rawIt) {
      if (!isRealIdeaItem(rawIt)) return;
      var it = normalizeIdeaItem(rawIt);
      var normTitleKey = it.title.toLowerCase().replace(/\s+/g, ' ');
      var key = (it.id === 's_radial' || it.id === 's2' || it.id === 's_ranks_reform' || it.id === 's_lockpick_cuffs')
        ? it.id
        : normTitleKey;

      if (!byKey[key]) {
        byKey[key] = it;
        out.push(it);
      } else {
        var ex = byKey[key];
        if ((it.text || '').length > (ex.text || '').length && it.id !== 's2') {
          ex.text = it.text;
        }
        if (it.tableHtml && !ex.tableHtml) ex.tableHtml = it.tableHtml;
        if (!ex._mediaModifiedByOwner) {
          if (it.images && it.images.length && (!ex.images || !ex.images.length)) ex.images = it.images.slice();
          if (it.videos && it.videos.length && (!ex.videos || !ex.videos.length)) ex.videos = it.videos.slice();
        }
        autoBindAppUrl(ex);
      }
    });
  });

  return out;
}

function loadLocalIdeasFromAllBrowserKeys() {

    var primary = JSON.parse(localStorage.getItem(LOCAL_IDEAS_K) || 'null');

}

function b64e(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64d(s) { return decodeURIComponent(escape(atob(s))); }

function extractIdeasFromJson(j) {
  if (!j) return [];
  var arr = toArr(j.items || j);
  if (!arr || !arr.length) return [];
  return arr.filter(isRealIdeaItem);
}

function recoverIdeasFromGitHubHistory() {
  if (!REPO) return Promise.resolve([]);
  var headers = { Accept: 'application/vnd.github+json' };
  var tok = ADMIN_KEY || localStorage.getItem(MAIN_KEY_K) || '';
  if (tok) headers.Authorization = 'token ' + tok;

  var directUrls = [
    'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + IDEAS_DATA_FILE + '?v=' + Date.now(),
    'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/data.json?v=' + Date.now()
  ];

  return Promise.all(directUrls.map(function(u) {
    return fetch(u, { cache: 'no-store' }).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
  })).then(function(directRes) {
    var lists = [];
    directRes.forEach(function(j) {
      var found = extractIdeasFromJson(j);
      if (found.length) lists.push(found);
    });
    if (lists.length && lists[0].length >= 5) return lists;

    return fetch('https://api.github.com/repos/' + REPO + '/commits?path=data.json&per_page=30&_t=' + Date.now(), { headers: headers })
      .then(function(r) { return r.ok ? r.json() : []; })
      .then(function(commits) {
        if (!Array.isArray(commits) || !commits.length) return lists;
        var candidateShas = [];
        commits.forEach(function(c) {
          if (!c || !c.sha) return;
          var msg = (c.commit && c.commit.message) || '';
          if (msg.indexOf('garage sync') < 0) candidateShas.push(c.sha);
        });
        var idx = 0;
        function checkNextCommit() {
          if (idx >= candidateShas.length) return Promise.resolve(lists);
          var sha = candidateShas[idx++];
          var rawCommitUrl = 'https://raw.githubusercontent.com/' + REPO + '/' + sha + '/data.json';
          return fetch(rawCommitUrl).then(function(r) { return r.ok ? r.json() : null; }).then(function(j) {
            var extracted = extractIdeasFromJson(j);
            if (extracted.length > 0) {
              lists.push(extracted);
              if (extracted.length >= 8) return lists;
            }
            return checkNextCommit();
          }).catch(function() {
            return checkNextCommit();
          });
        }
        return checkNextCommit();
      }).catch(function() { return lists; });
  });
}

function pushIdeasToGitHub() {
  var tok = ADMIN_KEY || localStorage.getItem(MAIN_KEY_K) || '';
  if (!REPO || !tok) return;
  var cleanList = window.ITEMS.filter(isRealIdeaItem);
  var snap = JSON.stringify({ rev: Date.now(), items: cleanList });
  var headers = {
    Authorization: 'token ' + tok,
    Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };

  var dataSha = null;
  fetch('https://api.github.com/repos/' + REPO + '/git/blobs', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({ content: b64e(snap), encoding: 'base64' })
  }).then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(blobObj) {
      dataSha = blobObj.sha;
      return fetch('https://api.github.com/repos/' + REPO + '/git/refs/heads/' + BRANCH + '?_t=' + Date.now(), { headers: headers, cache: 'no-store' });
    })
    .then(function(r) { return r.json(); })
    .then(function(refObj) {
      var headSha = refObj.object.sha;
      return fetch('https://api.github.com/repos/' + REPO + '/git/commits/' + headSha + '?_t=' + Date.now(), { headers: headers, cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(cm) { return { headSha: headSha, treeSha: cm.tree.sha }; });
    })
    .then(function(base) {
      return fetch('https://api.github.com/repos/' + REPO + '/git/trees', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          base_tree: base.treeSha,
          tree: [
            { path: IDEAS_DATA_FILE, mode: '100644', type: 'blob', sha: dataSha },
            { path: 'data.json',     mode: '100644', type: 'blob', sha: dataSha }
          ]
        })
      }).then(function(r) { return r.json(); })
        .then(function(nt) {
          return fetch('https://api.github.com/repos/' + REPO + '/git/commits', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ message: 'update ideas & categories', tree: nt.sha, parents: [base.headSha] })
          });
        });
    })
    .then(function(r) { return r.json(); })
    .then(function(nc) {
      return fetch('https://api.github.com/repos/' + REPO + '/git/refs/heads/' + BRANCH, {
        method: 'PATCH',
        headers: headers,
        body: JSON.stringify({ sha: nc.sha, force: true })
      });
    }).catch(function() {});
}

function compressPhotoFile(file) {
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        var MAX = 1280;
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var k = Math.min(1, MAX / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * k));
        cv.height = Math.max(1, Math.round(h * k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        try {
          resolve({ type: 'image', src: cv.toDataURL('image/jpeg', 0.84) });
        } catch (e) {
          resolve({ type: 'image', src: ev.target.result });
        }
      };
      img.onerror = function() { resolve(null); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function readVideoFile(file) {
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      resolve({ type: 'video', src: ev.target.result });
    };
    reader.onerror = function() { resolve(null); };
    reader.readAsDataURL(file);
  });
}

document.getElementById('ideaMediaInp').addEventListener('change', function() {
  var files = Array.prototype.slice.call(this.files || []);
  this.value = '';
  if (!files.length || !mediaUploadIdeaId) return;
  var it = findIdeaById(mediaUploadIdeaId);
  mediaUploadIdeaId = null;
  if (!it) return;

  var curMedia = ensureMediaList(it);
  var slotsLeft = 10 - curMedia.length;
  if (slotsLeft <= 0) {
    toast('Достигнут лимит 10 фото/видео', true);
    return;
  }
  var toProcess = files.slice(0, slotsLeft);
  Promise.all(toProcess.map(function(f) {
    if (f.type && f.type.indexOf('video/') === 0) return readVideoFile(f);
    return compressPhotoFile(f);
  })).then(function(added) {
    added.forEach(function(m) {
      if (m && m.src && curMedia.length < 10) curMedia.push(m);
    });
    it._mediaModifiedByOwner = true;
    syncMediaListBack(it, curMedia);
    OPEN_DESC_MAP[it.id] = true;
    saveLocalIdeas();
    pushIdeasToGitHub();
    render();
    toast('✓ Загружено медиафайлов: ' + added.filter(Boolean).length);
  });
});

        : '') +

}

function renderItems() {
  var curSecObj = secInfo(CUR_SEC);
  document.getElementById('pageTitle').textContent = curSecObj.ic + ' ' + curSecObj.n;
  document.getElementById('pageActions').innerHTML = window.adminMode
    ? '<button class="btn" onclick="openIdeaForm(null)">＋ Добавить предложение</button>'
    : '';

  var q = (SEARCH_Q || '').toLowerCase();
  var list = window.ITEMS.filter(function(it) {
    if (!isRealIdeaItem(it)) return false;
    if (CUR_SEC !== 'all' && it.fac !== CUR_SEC) return false;
    if (q) {
      var hay = ((it.title || '') + ' ' + (it.text || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  var box = document.getElementById('items');
  if (!list.length) {
    box.innerHTML = '<div class="empty">В этом разделе пока нет предложений</div>';
    return;
  }

  box.innerHTML = list.map(function(it) {
    autoBindAppUrl(it);
    var sec = secInfo(it.fac);
    var isDescOpen = !!OPEN_DESC_MAP[it.id];
    var mediaCount = ensureMediaList(it).length;
    var appBadge = it.appUrl ? '<span class="ic-app-badge">⚡ Интерактивный модуль</span>' : '';
    var mediaBadge = mediaCount > 0 ? '<span class="ic-media-badge">📷 Медиа: ' + mediaCount + '/10</span>' : '';

    /* Для владельца: быстрый переключатель категории прямо на карточке предложения! */
    var catControlHtml = '';
    if (window.adminMode) {
      var catOptions = SECTIONS.filter(function(s) { return s.k !== 'all'; }).map(function(s) {
        return '<option value="' + s.k + '"' + (s.k === it.fac ? ' selected' : '') + '>' + s.ic + ' ' + s.n + '</option>';
      }).join('');
      catControlHtml = '<select class="ic-cat-sel" title="Быстро сменить раздел предложения" onclick="event.stopPropagation()" onchange="quickChangeIdeaCategory(event,\'' + it.id + '\',this.value)">' + catOptions + '</select>';
    } else {
      catControlHtml = '<span class="ic-badge">' + sec.ic + ' ' + sec.n + '</span>';
    }

    var admBtns = window.adminMode
      ? '<div class="ic-tools" onclick="event.stopPropagation()">' +
          '<button class="btn ghost slim" onclick="triggerIdeaMediaUpload(event,\'' + it.id + '\')" title="Загрузить фото или видео">📷 Фото/Видео (' + mediaCount + '/10)</button>' +
          '<button class="btn ghost slim" onclick="openIdeaForm(\'' + it.id + '\')">✏️</button>' +
          '<button class="btn warn slim" onclick="deleteIdea(\'' + it.id + '\')">🗑</button>' +
        '</div>'
      : '';

    var openModuleBtn = it.appUrl
      ? '<button class="btn slim" onclick="event.stopPropagation();openIdeaCard(\'' + it.id + '\')">⚡ ' + escapeHtml(it.title) + ' →</button>'
      : '';

    return '<div class="icard">' +
      '<div class="ic-top">' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
          catControlHtml +
          appBadge +
          mediaBadge +
        '</div>' +
        admBtns +
      '</div>' +
      '<div class="ic-title">' + escapeHtml(it.title) + '</div>' +
      /* Кнопка Открыть / Скрыть стоит сразу под заголовком предложения и тут же заменяет саму себя */
      '<div class="ic-actions-bar">' +
        '<button class="btn ghost slim" id="descBtn_' + it.id + '" onclick="toggleIdeaDesc(event,\'' + it.id + '\')">' +
          (isDescOpen ? '🔼 Скрыть' : '📖 Открыть') +
        '</button>' +
        openModuleBtn +
      '</div>' +
      '<div class="ic-desc-box' + (isDescOpen ? ' open' : '') + '" id="desc_' + it.id + '">' +
        '<div class="ic-desc-text">' + escapeHtml(it.text || '') + '</div>' +
        (it.tableHtml || '') +
        renderMediaGalleryForIdea(it) +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  renderTopBar();
  renderSidebar();
  renderItems();
}
window.render = render;

    m.innerHTML =
      '<div class="back" onclick="if(event.target===this)closeModal()">' +
        '<div class="modal app-modal">' +
          '<div class="m-head">' +
            '<div class="mh-title"><span>⚡</span><span>' + escapeHtml(it.title) + '</span></div>' +
            '<button class="m-close" onclick="closeModal()">✕</button>' +
          '</div>' +
          '<div class="m-body iframe-wrap">' +
            '<iframe class="app-iframe" id="activeAppIframe" src="' + targetUrl + '" allowfullscreen></iframe>' +
          '</div>' +
        '</div>' +
      '</div>';
    return;
  }

  toggleIdeaDesc(null, it.id);
};

/* ===================== ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ ПРЕДЛОЖЕНИЯ ===================== */
window.openIdeaForm = function(editId) {
  if (!window.adminMode) return;
  var it = editId ? findIdeaById(editId) : null;
  var curFac = it ? it.fac : (CUR_SEC !== 'all' ? CUR_SEC : 'general');
  var secOpts = SECTIONS.filter(function(s) { return s.k !== 'all'; }).map(function(s) {
    return '<option value="' + s.k + '"' + (s.k === curFac ? ' selected' : '') + '>' + s.ic + ' ' + s.n + '</option>';
  }).join('');

  var appList = [
    { v: '',                  n: '— Без интерактивного модуля —' },
    { v: 'apps/garage.html',     n: '🚔 Автопарк и форма (apps/garage.html)' },
    { v: 'apps/mvd-radial.html', n: '🛡️ Фракционное радиальное меню (apps/mvd-radial.html)' },
    { v: 'apps/epaulettes.html', n: '🎖️ Стенд погон (apps/epaulettes.html)' },
    { v: 'builtin:faction-app',  n: '🛡️ Функциональное фракционное приложение' },
    { v: 'builtin:phone',        n: '📱 Интерактивный смартфон' },
    { v: 'builtin:bank',         n: '💳 Банковская система и приложение' },
    { v: 'builtin:stats',        n: '📊 Статистика персонажа (чистый онлайн и доходы/расходы)' }
  ];
  REPO_ALL_FILES.forEach(function(p) {
    if (!appList.some(function(x) { return x.v === p; })) {
      appList.push({ v: p, n: '⚡ ' + p });
    }
  });

  var appOpts = appList.map(function(a) {
    var sel = (it && (it.appUrl || '') === a.v) ? ' selected' : '';
    return '<option value="' + escapeHtml(a.v) + '"' + sel + '>' + escapeHtml(a.n) + '</option>';
  }).join('');

  var m = document.getElementById('mroot');
  m.innerHTML =
    '<div class="back" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" style="max-width:680px">' +
        '<div class="m-head">' +
          '<div class="mh-title">' + (it ? '✏️ Редактировать предложение' : '＋ Новое предложение') + '</div>' +
          '<button class="m-close" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="m-body">' +
          '<label class="flab">Раздел / Категория предложения</label>' +
          '<select class="sel" id="fIdeaFac" style="width:100%">' + secOpts + '</select>' +
          '<label class="flab">Заголовок предложения</label>' +
          '<input class="inp" id="fIdeaTitle" style="width:100%" value="' + escapeHtml(it ? it.title : '') + '" placeholder="Введите заголовок предложения…">' +
          '<label class="flab">Описание предложения</label>' +
          '<textarea class="inp" id="fIdeaText" rows="7" style="width:100%" placeholder="Подробное описание идеи…">' + escapeHtml(it ? it.text : '') + '</textarea>' +
          '<label class="flab">Интерактивный модуль</label>' +
          '<select class="sel" id="fIdeaApp" style="width:100%">' + appOpts + '</select>' +
        '</div>' +
        '<div class="m-foot">' +
          '<button class="btn ghost" onclick="closeModal()">Отмена</button>' +
          '<button class="btn" onclick="saveIdeaForm(\'' + (it ? it.id : '') + '\')">Сохранить</button>' +
        '</div>' +
      '</div>' +
    '</div>';
};

window.saveIdeaForm = function(editId) {
  var fac   = document.getElementById('fIdeaFac').value || 'general';
  var title = (document.getElementById('fIdeaTitle').value || '').trim();
  var text  = (document.getElementById('fIdeaText').value || '').trim();
  var app   = (document.getElementById('fIdeaApp').value || '').trim();
  if (!title) { toast('Введите заголовок предложения', true); return; }

  var it = editId ? findIdeaById(editId) : null;
  if (!it) {
    it = {
      id: 'idea_' + Date.now().toString(36),
      date: new Date().toISOString().slice(0, 10),
      images: [],
      videos: []
    };
    window.ITEMS.unshift(it);
  }
  it.fac = fac;
  it.title = title;
  it.text = text;
  if (app) it.appUrl = app; else delete it.appUrl;
  delete it.author;

  closeModal();
  saveLocalIdeas();
  pushIdeasToGitHub();
  render();
  toast('Предложение сохранено');
};

window.deleteIdea = function(id) {
  if (!window.adminMode) return;
  if (!confirm('Удалить это предложение?')) return;
  DELETED_IDEA_IDS[id] = 1;
  try { localStorage.setItem(DELETED_IDEAS_K, JSON.stringify(DELETED_IDEA_IDS)); } catch (e) {}
  window.ITEMS = window.ITEMS.filter(function(x) { return x.id !== id; });
  saveLocalIdeas();
  pushIdeasToGitHub();
  render();
  toast('Предложение удалено');
};

window.closeModal = function() {
  document.getElementById('mroot').innerHTML = '';
};

document.getElementById('searchInp').addEventListener('input', function() {
  SEARCH_Q = this.value;
  renderItems();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('mediaLb').classList.contains('show')) {
      closeMediaLb();
      return;
    }
    closeModal();
  }
});

/* ===================== ЗАПУСК ===================== */
window.ITEMS = loadLocalIdeasFromAllBrowserKeys();
render();
scanRepoTree();

loadIdeasFromIdb().then(function(idbData) {
  if (idbData && Array.isArray(idbData.items) && idbData.items.length) {
    window.ITEMS = mergeAndCleanIdeas([idbData.items, window.ITEMS]);
    render();
  }
  return recoverIdeasFromGitHubHistory();
}).then(function(recoveredLists) {
  if (recoveredLists && recoveredLists.length) {
    window.ITEMS = mergeAndCleanIdeas([window.ITEMS].concat(recoveredLists));
    window.ITEMS.forEach(autoBindAppUrl);
    saveLocalIdeas();
    render();
  }
});
</script>
</body>
</html>
