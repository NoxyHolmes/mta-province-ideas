<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Предложения · Фракции · Работы и прочее</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0e14;
  --bg2:#111620;
  --card:#161d29;
  --card-even:#1e2738;
  --line:#252f42;
  --line-even:#344560;
  --txt:#ecf0f8;
  --mut:#8b96ab;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
}
html{color-scheme:dark}
body{
  background:
    radial-gradient(1200px 600px at 12% -10%,rgba(45,100,180,.18),transparent 60%),
    radial-gradient(1000px 550px at 105% 110%,rgba(120,80,220,.12),transparent 55%),
    #0b0e14;
  color:var(--txt);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:14px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#283244;border-radius:8px;border:2px solid #0e131b}
::-webkit-scrollbar-thumb:hover{background:#38465e}

#top{
  position:sticky;
  top:0;
  z-index:200;
  height:56px;
  background:rgba(13,17,24,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:#dbe7ff}
.logo{
  width:32px;
  height:32px;
  border-radius:10px;
  background:linear-gradient(135deg,#4da3ff,#6d5dfc);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  box-shadow:0 4px 14px rgba(77,163,255,.35);
}
#topRight{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#141a24;
  color:var(--mut);
  font-size:12px;
  font-weight:700;
}
.pill .gdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.btn{
  background:linear-gradient(145deg,#3684e6,#2563eb);
  border:1px solid #3d75c4;
  color:#fff;
  padding:8px 15px;
  border-radius:10px;
  font-weight:700;
  font-size:12.5px;
  cursor:pointer;
  font-family:inherit;
  transition:all .18s;
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.ghost{background:#151c27;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:#3a4a63}
.btn.warn{background:linear-gradient(145deg,#b93838,#8c2626);border-color:#c24646}
.btn.slim{padding:6px 12px;font-size:11.5px}

#wrap{
  max-width:1460px;
  width:100%;
  margin:0 auto;
  display:grid;
  grid-template-columns:250px 1fr;
  gap:24px;
  padding:22px;
  flex:1;
}
#side{
  position:sticky;
  top:76px;
  align-self:start;
  background:rgba(18,23,32,.75);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 10px;
}
.s-grp{
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.4px;
  color:#647187;
  padding:8px 12px 6px;
}
.s-grp:not(:first-child){margin-top:10px;border-top:1px solid rgba(255,255,255,.05);padding-top:14px}
.s-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:11px;
  border:1px solid transparent;
  background:transparent;
  color:var(--mut);
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
  text-align:left;
  transition:all .16s;
  margin-bottom:3px;
}
.s-btn:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.s-btn.on{
  color:#fff;
  background:linear-gradient(90deg,rgba(77,163,255,.22),rgba(77,163,255,.05));
  border-color:rgba(77,163,255,.4);
}
.s-cnt{
  margin-left:auto;
  background:#1f293a;
  border:1px solid #2e3d56;
  color:#a8c1e8;
  font-size:11px;
  font-weight:800;
  padding:1px 8px;
  border-radius:10px;
}

.ph{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.ph h1{font-size:22px;font-weight:800}
.ph-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.inp,.sel{
  background:#131923;
  border:1px solid var(--line);
  color:var(--txt);
  padding:10px 14px;
  border-radius:11px;
  font-size:13.5px;
  font-family:inherit;
  outline:none;
  transition:border-color .18s;
}
.inp:focus,.sel:focus{border-color:var(--acc)}

#items{display:flex;flex-direction:column;gap:14px}

/* ЧЕРЕДОВАНИЕ ЦВЕТОВ ЯЧЕЕК ПРЕДЛОЖЕНИЙ (ЗЕБРА) */
.icard{
  border-radius:16px;
  padding:18px 20px;
  transition:all .2s;
  position:relative;
}
#items > .icard:nth-child(odd){
  background:linear-gradient(145deg,#151c27,#111720);
  border:1px solid #243044;
  border-left:4px solid #385d8a;
}
#items > .icard:nth-child(even){
  background:linear-gradient(145deg,#1f293b,#182130);
  border:1px solid #354764;
  border-left:4px solid #4da3ff;
  box-shadow:inset 0 1px 0 rgba(77,163,255,.1),0 8px 24px rgba(0,0,0,.32);
}
#items > .icard:hover{
  border-color:#58aaff;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}

.ic-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ic-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:rgba(77,163,255,.14);
  border:1px solid rgba(77,163,255,.35);
  color:#93c5fd;
}
.ic-app-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:rgba(47,217,122,.14);
  border:1px solid rgba(47,217,122,.35);
  color:#6ee7b7;
}
.ic-title{font-size:17px;font-weight:800;color:#fff;margin-bottom:4px;line-height:1.35}

/* Скрытое/раскрываемое описание по кнопке "Открыть / Скрыть" */
.ic-desc-box{
  display:none;
  margin-top:12px;
  padding:14px 16px;
  border-radius:12px;
  background:rgba(11,14,20,.65);
  border:1px solid rgba(255,255,255,.07);
  font-size:13.5px;
  color:#dbe4f3;
  line-height:1.65;
  white-space:pre-line;
}
.ic-desc-box.open{display:block;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}}

/* Таблицы внутри описания (для Глобальной реформы рангов и иерархии) */
.rank-table-wrap{overflow-x:auto;margin-top:12px;white-space:normal}
.rank-table{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid #2b384e;border-radius:10px;overflow:hidden}
.rank-table th{background:#1d2738;color:#93c5fd;font-weight:800;text-align:left;padding:10px 12px;border-bottom:1px solid #2e3d56;text-transform:uppercase;font-size:11px;letter-spacing:.6px}
.rank-table td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.06);color:#e2e8f0;vertical-align:top}
.rank-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.rank-table tr:hover td{background:rgba(77,163,255,.08)}

.ic-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
  padding-top:11px;
  border-top:1px dashed rgba(255,255,255,.08);
}
.ic-tools{display:flex;gap:6px}

.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px;white-space:normal}
.media-grid img,.media-grid video{width:100%;border-radius:12px;border:1px solid var(--line);max-height:260px;object-fit:cover;background:#0e131b}

.back{
  position:fixed;
  inset:0;
  background:rgba(4,7,12,.82);
  backdrop-filter:blur(8px);
  z-index:500;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow-y:auto;
  padding:24px 16px;
}
.modal{
  width:100%;
  max-width:1180px;
  background:#141a24;
  border:1px solid #2b3648;
  border-radius:18px;
  box-shadow:0 30px 90px rgba(0,0,0,.75);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.modal.app-modal{max-width:1420px;height:calc(100vh - 48px)}
.m-head{
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(180deg,rgba(77,163,255,.08),transparent);
}
.mh-title{font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px}
.m-close{
  background:#231b24;
  border:1px solid #6e2c35;
  color:#fda4af;
  width:32px;
  height:32px;
  border-radius:9px;
  cursor:pointer;
  font-size:14px;
  font-weight:800;
}
.m-close:hover{background:#9f1239;color:#fff}
.m-body{padding:20px;overflow-y:auto;flex:1}
.m-body.iframe-wrap{padding:0;display:flex;flex-direction:column;overflow:hidden}
.app-iframe{width:100%;height:100%;border:0;flex:1;background:#0e1116}
.m-foot{padding:14px 20px;border-top:1px solid var(--line);background:#10151e;display:flex;justify-content:flex-end;gap:10px}
.flab{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:12px 0 6px}
.flab:first-child{margin-top:0}

#troot{position:fixed;right:18px;bottom:18px;z-index:800;display:flex;flex-direction:column;gap:8px}
.toast{background:#1b2432;border:1px solid #32445e;border-left:3px solid var(--acc);padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.warn{border-left-color:var(--red)}
.empty{padding:36px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}

@media(max-width:860px){
  #wrap{grid-template-columns:1fr;padding:14px}
  #side{position:static}
}
</style>
<script src="js/config.js"></script>
</head>
<body>

<header id="top">
  <div class="brand">
    <div class="logo">💡</div>
    <div>ПРЕДЛОЖЕНИЯ · ФРАКЦИИ · РАБОТЫ И ПРОЧЕЕ</div>
  </div>
  <div id="topRight"></div>
</header>

<div id="wrap">
  <aside id="side"></aside>
  <main id="content">
    <div class="ph">
      <h1 id="pageTitle">Все предложения</h1>
      <div id="pageActions"></div>
    </div>
    <div class="ph-ctl">
      <input class="inp" id="searchInp" style="flex:1;min-width:240px" placeholder="🔍 Поиск по заголовку или описанию предложения…">
    </div>
    <div id="items"></div>
  </main>
</div>

<div id="mroot"></div>
<div id="troot"></div>

<script>
/* ===================== АВТООПРЕДЕЛЕНИЕ РЕПОЗИТОРИЯ ===================== */
var REPO = (function() {
  var h = location.hostname, p = location.pathname;
  if (!/\.github\.io$/.test(h)) return 'noxyholmes/mta-province-ideas';
  var owner = h.replace(/\.github\.io$/, '');
  var seg = p.split('/').filter(Boolean);
  return owner + '/' + (seg.length ? seg[0] : (owner + '.github.io'));
})();
var BRANCH = 'main';
var IDEAS_DATA_FILE = 'ideas_data.json';

/* ===================== ФРАКЦИИ И РАЗДЕЛЫ ЛЕВОГО МЕНЮ ===================== */
var SECTIONS = [
  { k: 'all',     grp: 'main', ic: '📋', n: 'Все предложения' },
  { k: 'general', grp: 'main', ic: '💡', n: 'Общие' },
  { k: 'mvd',     grp: 'main', ic: '🚓', n: 'МВД' },
  { k: 'mo',      grp: 'main', ic: '🎖️', n: 'Минобороны' },
  { k: 'mz',      grp: 'main', ic: '🚑', n: 'Минздрав' },
  { k: 'mt',      grp: 'main', ic: '🚆', n: 'Минтранс' },
  { k: 'opg',     grp: 'main', ic: '🔫', n: 'ОПГ' },
  { k: 'other',   grp: 'main', ic: '📦', n: 'Прочее' },
  { k: 'jobs',    grp: 'sub',  ic: '💼', n: 'Работы и прочее' }
];

function secInfo(k) {
  for (var i = 0; i < SECTIONS.length; i++) {
    if (SECTIONS[i].k === k) return SECTIONS[i];
  }
  return SECTIONS[1];
}

/* ===================== КАРТА ИНТЕРАКТИВНЫХ МОДУЛЕЙ ===================== */
var REPO_ALL_FILES = [];
var APPS_MAP = {
  'garage':         'apps/garage.html',
  'epaulettes':     'apps/epaulettes.html',
  'mvd-radial':     'apps/mvd-radial.html',
  'radial':         'apps/mvd-radial.html',
  'phone':          'apps/phone.html',
  'faction-app':    'apps/faction-app.html',
  'tablet':         'apps/tablet.html'
};

var EXTERNAL_SEED_FN = (typeof window.seed === 'function') ? window.seed : null;

/* Таблица для предложения «Глобальная реформа системы рангов и должностной иерархии фракций» */
var RANKS_REFORM_TABLE_HTML =
  '<div class="rank-table-wrap">' +
    '<table class="rank-table">' +
      '<thead>' +
        '<tr>' +
          '<th>Ранг</th>' +
          '<th>МВД (УМВД / ГИБДД)</th>' +
          '<th>Минобороны (ВС РФ)</th>' +
          '<th>Минздрав (ЦГБ / ОКБ)</th>' +
          '<th>Минтранс (РЖД)</th>' +
          '<th>Типовая должность</th>' +
        '</tr>' +
      '</thead>' +
      '<tbody>' +
        '<tr><td><b>1</b></td><td>Рядовой полиции</td><td>Рядовой</td><td>Интерн</td><td>Помощник машиниста (стажёр)</td><td>Курсант / Стажёр учебной роты</td></tr>' +
        '<tr><td><b>2</b></td><td>Младший сержант</td><td>Ефрейтор</td><td>Фельдшер</td><td>Помощник машиниста</td><td>Младший специалист / Патрульный</td></tr>' +
        '<tr><td><b>3</b></td><td>Сержант</td><td>Младший сержант</td><td>Участковый врач</td><td>Машинист 3 класса</td><td>Инспектор ППС / ДПС / Специалист</td></tr>' +
        '<tr><td><b>4</b></td><td>Старший сержант</td><td>Сержант</td><td>Врач-терапевт</td><td>Машинист 2 класса</td><td>Старший инспектор / Командир отделения</td></tr>' +
        '<tr><td><b>5</b></td><td>Старшина / Прапорщик</td><td>Старший сержант / Старшина</td><td>Врач-хирург</td><td>Машинист 1 класса</td><td>Старшина подразделения / Инструктор</td></tr>' +
        '<tr><td><b>6</b></td><td>Младший лейтенант</td><td>Прапорщик / Мл. лейтенант</td><td>Врач-реаниматолог</td><td>Машинист-инструктор</td><td>Оперуполномоченный / Дознаватель</td></tr>' +
        '<tr><td><b>7</b></td><td>Лейтенант</td><td>Лейтенант</td><td>Старший специалист</td><td>Дежурный по станции (ДСП)</td><td>Инспектор ОУР / Следователь / Командир взвода</td></tr>' +
        '<tr><td><b>8</b></td><td>Старший лейтенант</td><td>Старший лейтенант</td><td>Заведующий отделением</td><td>Поездной диспетчер (ДНЦ)</td><td>Старший оперуполномоченный / Зам. ком. роты</td></tr>' +
        '<tr><td><b>9</b></td><td>Капитан</td><td>Капитан</td><td>Зам. главного врача по МЧ</td><td>Ревизор по безопасности движения</td><td>Командир роты / Начальник смены</td></tr>' +
        '<tr><td><b>10</b></td><td>Майор</td><td>Майор</td><td>Зам. главного врача по КЭР</td><td>Начальник депо / Станции</td><td>Начальник отдела (ОУР / ОБ ДПС / УЦ)</td></tr>' +
        '<tr><td><b>11</b></td><td>Подполковник</td><td>Подполковник</td><td>Первый зам. главврача</td><td>Зам. начальника железной дороги</td><td>Заместитель начальника УМВД / ГИБДД / Части</td></tr>' +
        '<tr><td><b>12</b></td><td>Полковник / Генерал-майор</td><td>Полковник / Генерал-майор</td><td>Главный врач ЦГБ / ОКБ</td><td>Начальник железной дороги</td><td>Начальник управления (Лидер фракции)</td></tr>' +
      '</tbody>' +
    '</table>' +
  '</div>';

/* Базовые предложения (включая объединённое «Фракционное радиальное меню», таблицу рангов, взлом наручников с отвёрткой 50% и все модули) */
function baseSeedIdeas() {
  var list = [];
  if (EXTERNAL_SEED_FN) {
    try {
      var ext = EXTERNAL_SEED_FN();
      if (Array.isArray(ext)) list = list.concat(ext);
    } catch (e) {}
  }

  var core = [
    {
      id: 's2',
      fac: 'general',
      title: 'Обновлённый автопарк и форма фракций',
      text: 'В данном интерактивном каталоге представлен широкий список транспортных средств и форменной одежды для государственных фракций (УМВД, ОГИБДД, ЦГБ/ОКБ, ВС РФ, РЖД), однако это не означает, что необходимо добавлять абсолютно все модели сразу — из предложенного перечня можно выбрать наиболее подходящие автомобили и комплекты формы для каждого подразделения.\n\nТранспорт и скины для мероприятий (МП-панель):\nЗачастую для проведения различных глобальных и локальных мероприятий не хватает специализированных машин госструктур (ФСБ, СК, Прокуратура, МЧС, ФСО) и соответствующих скинов, чтобы РП-ситуация выглядела атмосферной и интересной. Чтобы разнообразить их, из предложенных в каталоге вариантов можно выбрать подходящие машины и виды формы каждой структуры и добавить их в МП-панель.',
      appUrl: 'apps/garage.html'
    },
    {
      id: 's_ranks_reform',
      fac: 'general',
      title: 'Глобальная реформа системы рангов и должностной иерархии фракций',
      text: 'Разделение понятий «Специальное / Воинское звание» (Ранг) и «Штатная должность» внутри государственных фракций (МВД, Минобороны, Минздрав, Минтранс), а также введение интерактивного стенда динамических погон для всех подразделений Полиции и Вооружённых Сил РФ.\n\nСводная таблица рангов, званий и должностной иерархии по фракциям:',
      tableHtml: RANKS_REFORM_TABLE_HTML,
      appUrl: 'apps/epaulettes.html'
    },
    {
      id: 's_radial',

/* Строгое и безошибочное сопоставление предложения с его интерактивным модулем */
function autoBindAppUrl(it) {
  if (!it || typeof it !== 'object') return;
  var t = String(it.title || '').toLowerCase();
  var id = String(it.id || '').toLowerCase();
  var cur = String(it.appUrl || it.app || it.iframe || '').trim();

  /* 1. АВТОПАРК И ФОРМА — всегда строго apps/garage.html! */
  if (id === 's2' || t.indexOf('автопарк') >= 0 || (t.indexOf('форма фракц') >= 0)) {
    it.appUrl = 'apps/garage.html';
    return;
  }

  /* 2. РЕФОРМА РАНГОВ / ПОГОНЫ — apps/epaulettes.html (+ сохранение таблицы рангов!) */
  if (t.indexOf('погон') >= 0 || (t.indexOf('реформа системы рангов') >= 0) || (t.indexOf('иерарх') >= 0)) {
    it.appUrl = 'apps/epaulettes.html';
    if (!it.tableHtml && t.indexOf('ранг') >= 0) {
      it.tableHtml = RANKS_REFORM_TABLE_HTML;
    }
    return;
  }

  /* 3. РАДИАЛЬНОЕ МЕНЮ / НАРУЧНИКИ / ВЗЛОМ НАРУЧНИКОВ ОТВЁРТКОЙ — apps/mvd-radial.html */
  if (t.indexOf('радиальн') >= 0 || t.indexOf('наручник') >= 0 || id === 's_radial' || id === 's_cuffs_rework' || id === 's_lockpick_cuffs') {
    it.appUrl = 'apps/mvd-radial.html';
    return;
  }

  /* 4. ФУНКЦИОНАЛЬНОЕ ФРАКЦИОННОЕ ПРИЛОЖЕНИЕ */
  if (t.indexOf('фракционное приложение') >= 0 || t.indexOf('планшет') >= 0) {
    /* Если в репозитории есть отдельный файл — используем его, иначе встроенный интерактивный модуль */
    for (var i = 0; i < REPO_ALL_FILES.length; i++) {
      if (/faction|tablet|app/i.test(REPO_ALL_FILES[i]) && !/garage|radial|epaulettes/i.test(REPO_ALL_FILES[i])) {
        it.appUrl = REPO_ALL_FILES[i];
        return;
      }
    }
    it.appUrl = 'builtin:faction-app';
    return;
  }

  /* 5. УЛУЧШЕНИЕ ТЕЛЕФОНА */
  if (t.indexOf('телефон') >= 0 || cur === 'phone' || cur === 'apps/phone.html') {
    for (var j = 0; j < REPO_ALL_FILES.length; j++) {
      if (/phone|smartphone|mobile/i.test(REPO_ALL_FILES[j])) {
        it.appUrl = REPO_ALL_FILES[j];
        return;
      }
    }
    it.appUrl = 'builtin:phone';
    return;
  }

  if (!cur) return;
  if (cur.indexOf('builtin:') === 0) return;

  var clean = cur.replace(/^apps\//i, '').replace(/\.html.*$/i, '').toLowerCase();
  if (APPS_MAP[clean]) {
    it.appUrl = APPS_MAP[clean];
    return;
  }
  for (var k = 0; k < REPO_ALL_FILES.length; k++) {
    var path = REPO_ALL_FILES[k];
    var fileBase = path.replace(/^.*\//, '').replace(/\.html$/i, '').toLowerCase();
    if (fileBase === clean) {
      it.appUrl = path;
      return;
    }
  }
}

/* Сканирование реального дерева файлов репозитория */
function scanRepoTree() {
  if (!REPO) return Promise.resolve();
  return fetch('https://api.github.com/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1&_t=' + Date.now())
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(j) {
      if (!j || !Array.isArray(j.tree)) return;
      REPO_ALL_FILES = [];
      j.tree.forEach(function(node) {
        if (node && node.path && /\.html$/i.test(node.path) && node.path !== 'index.html') {
          REPO_ALL_FILES.push(node.path);
          var base = node.path.replace(/^.*\//, '').replace(/\.html$/i, '').toLowerCase();
          APPS_MAP[base] = node.path;
        }
      });
      window.ITEMS.forEach(autoBindAppUrl);
      render();
    }).catch(function() {});
}

function toast(msg, warn) {
  var t = document.createElement('div');
  t.className = 'toast' + (warn ? ' warn' : '');
  t.textContent = msg;
  var r = document.getElementById('troot');
  if (r) r.appendChild(t);
  setTimeout(function() { t.remove(); }, 3600);
}

function toArr(x) {
  if (!x) return null;
  if (Array.isArray(x)) return x;
  if (typeof x === 'object') {
    var ks = Object.keys(x).sort(function(a, b) { return a - b; });
    var res = [];
    for (var i = 0; i < ks.length; i++) res.push(x[ks[i]]);
    return res;
  }
  return null;
}

function isRealIdeaItem(it) {
  if (!it || typeof it !== 'object') return false;
  if (it.kind === 'cars' || it.kind === 'form' || it.dep || typeof it.speed !== 'undefined') return false;
  if (it.id && DELETED_IDEA_IDS[it.id]) return false;
  var title = String(it.title || it.name || '').replace(/\s+/g, ' ').trim();
  var text  = String(it.text || it.desc || it.body || '').replace(/\s+/g, ' ').trim();
  if (!title || title === 'Без названия' || title === '—' || title === 'null' || title === 'undefined') return false;
  var hasMedia = (Array.isArray(it.images) && it.images.length > 0) ||
                 (Array.isArray(it.videos) && it.videos.length > 0) ||
                 !!it.appUrl || !!it.app || !!it.iframe || !!it.tableHtml;
  if (!text && !hasMedia) return false;
  return true;
}

function normalizeIdeaItem(it) {
  var copy = Object.assign({}, it);
  copy.title = String(copy.title || copy.name || '').trim();
  copy.text  = String(copy.text || copy.desc || copy.body || '').trim();
  copy.fac   = copy.fac || copy.cat || copy.section || 'general';
  if (copy.app && !copy.appUrl) copy.appUrl = copy.app;

  /* Объединяем "Фракционное радиальное меню сотрудников МВД (УМВД / ГИБДД)" и "Фракционное радиальное меню" в ОДНО предложение! */
  if (/^фракционное радиальное меню/i.test(copy.title)) {
    copy.id    = 's_radial';
    copy.fac   = 'mvd';
    copy.title = 'Фракционное радиальное меню';
    copy.appUrl = 'apps/mvd-radial.html';
  }

  /* Обновляем описание для "Взлом наручников с помощью отвёртки или отмычки" */
  if (/взлом наручников/i.test(copy.title)) {
    copy.id = 's_lockpick_cuffs';
    if (copy.text.indexOf('50%') < 0) {
      copy.text = (copy.text ? copy.text + '\n\n' : '') +
        'Механика взлома через радиальное меню:\nЧерез радиальное меню, если нажать на взаимодействие с человеком, на котором надеты наручники, появится кнопка «Освободить задержанного». Если в инвентаре есть отвёртка, последует анимация взлома, и с шансом 50% игрок будет освобождён или нет, но отвёртка сломается в любом из исходов.';
    }
    copy.appUrl = 'apps/mvd-radial.html';
  }

  /* Восстанавливаем таблицу в "Глобальная реформа системы рангов и должностной иерархии фракций" */
  if (/реформа системы рангов/i.test(copy.title) || /должностной иерархии/i.test(copy.title)) {
    copy.id = 's_ranks_reform';
    copy.tableHtml = RANKS_REFORM_TABLE_HTML;
    copy.appUrl = 'apps/epaulettes.html';
  }

  if (!copy.id) copy.id = 'idea_' + copy.title.toLowerCase().replace(/[^a-zа-яё0-9]+/gi, '_');
  delete copy.author;
  autoBindAppUrl(copy);
  return copy;
}

function mergeAndCleanIdeas(lists) {
  var byKey = {};
  var out = [];

  /* Сначала загружаем эталонные карточки из baseSeedIdeas() */
  baseSeedIdeas().concat.apply(baseSeedIdeas(), lists || []).forEach(function(rawIt) {
    if (!isRealIdeaItem(rawIt)) return;
    var it = normalizeIdeaItem(rawIt);
    var normTitleKey = it.title.toLowerCase().replace(/\s+/g, ' ');
    /* Для радиального меню и реформы рангов склеиваем по единому ключу */
    var key = (it.id === 's_radial' || it.id === 's2' || it.id === 's_ranks_reform' || it.id === 's_lockpick_cuffs')
      ? it.id
      : normTitleKey;

    if (!byKey[key]) {
      byKey[key] = it;
      out.push(it);
    } else {
      var ex = byKey[key];
      if ((it.text || '').length > (ex.text || '').length && it.id !== 's2') {
        ex.text = it.text;
      }
      if (it.tableHtml && !ex.tableHtml) ex.tableHtml = it.tableHtml;
      if (it.appUrl && !ex.appUrl) ex.appUrl = it.appUrl;
      if (it.images && it.images.length && (!ex.images || !ex.images.length)) ex.images = it.images;
      if (it.videos && it.videos.length && (!ex.videos || !ex.videos.length)) ex.videos = it.videos;
      autoBindAppUrl(ex);
    }
  });

  return out;
}

function loadLocalIdeasFromAllBrowserKeys() {
  var collected = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf('garage') >= 0 || k.indexOf('megaphone') >= 0) continue;
      try {
        var raw = JSON.parse(localStorage.getItem(k) || 'null');
        if (!raw) continue;
        var arr = toArr(raw.items || raw);
        if (arr && arr.length) collected.push(arr);
      } catch (e) {}
    }
  } catch (e) {}
  return mergeAndCleanIdeas(collected);
}

function b64e(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64d(s) { return decodeURIComponent(escape(atob(s))); }

function extractIdeasFromJson(j) {
  if (!j) return [];
  var arr = toArr(j.items || j);
  if (!arr || !arr.length) return [];
  return arr.filter(isRealIdeaItem);
}

function recoverIdeasFromGitHubHistory() {
  if (!REPO) return Promise.resolve([]);
  var headers = { Accept: 'application/vnd.github+json' };
  var tok = ADMIN_KEY || localStorage.getItem(MAIN_KEY_K) || '';
  if (tok) headers.Authorization = 'token ' + tok;

  var directUrls = [
    'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + IDEAS_DATA_FILE + '?v=' + Date.now(),
    'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/data.json?v=' + Date.now()
  ];

  return Promise.all(directUrls.map(function(u) {
    return fetch(u, { cache: 'no-store' }).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
  })).then(function(directRes) {
    var lists = [];
    directRes.forEach(function(j) {
      var found = extractIdeasFromJson(j);
      if (found.length) lists.push(found);
    });

    return fetch('https://api.github.com/repos/' + REPO + '/commits?path=data.json&per_page=30&_t=' + Date.now(), { headers: headers })
      .then(function(r) { return r.ok ? r.json() : []; })
      .then(function(commits) {
        if (!Array.isArray(commits) || !commits.length) return lists;
        var candidateShas = [];
        commits.forEach(function(c) {
          if (!c || !c.sha) return;
          var msg = (c.commit && c.commit.message) || '';
          if (msg.indexOf('garage sync') < 0) candidateShas.push(c.sha);
        });
        commits.slice(0, 15).forEach(function(c) {
          if (c && c.sha && candidateShas.indexOf(c.sha) < 0) candidateShas.push(c.sha);
        });

        var idx = 0;
        function checkNextCommit() {
          if (idx >= candidateShas.length) return Promise.resolve(lists);
          var sha = candidateShas[idx++];
          var rawCommitUrl = 'https://raw.githubusercontent.com/' + REPO + '/' + sha + '/data.json';
          return fetch(rawCommitUrl).then(function(r) { return r.ok ? r.json() : null; }).then(function(j) {
            var extracted = extractIdeasFromJson(j);
            if (extracted.length > 0) {
              lists.push(extracted);
              if (extracted.length >= 8) return lists;
            }
            return checkNextCommit();
          }).catch(function() {
            return checkNextCommit();
          });
        }
        return checkNextCommit();
      }).catch(function() { return lists; });
  });
}

function pushIdeasToGitHub() {
  var tok = ADMIN_KEY || localStorage.getItem(MAIN_KEY_K) || '';
  if (!REPO || !tok) return;
  var cleanList = window.ITEMS.filter(isRealIdeaItem);
  var snap = JSON.stringify({ rev: Date.now(), items: cleanList });
  var headers = {
    Authorization: 'token ' + tok,
    Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };

  [IDEAS_DATA_FILE, 'data.json'].forEach(function(fileName) {
    fetch('https://api.github.com/repos/' + REPO + '/contents/' + fileName + '?_t=' + Date.now(), { headers: headers })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(existing) {
        var body = {
          message: 'update ideas (' + cleanList.length + ')',
          content: b64e(snap),
          branch: BRANCH
        };
        if (existing && existing.sha) body.sha = existing.sha;
        return fetch('https://api.github.com/repos/' + REPO + '/contents/' + fileName, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify(body)
        });
      }).catch(function() {});
  });
}

  SECTIONS.forEach(function(s) {

      h += '<div class="s-grp">Прочие предложения</div>';
    }
    h += '<button class="s-btn' + (CUR_SEC === s.k ? ' on' : '') + '" onclick="selectSection(\'' + s.k + '\')">' +
      '<span>' + s.ic + '</span>' +
      '<span>' + s.n + '</span>' +
      '<span class="s-cnt">' + countBySec(s.k) + '</span>' +
    '</button>';
  });
  side.innerHTML = h;
}

window.selectSection = function(k) {
  CUR_SEC = k;
  render();
};

/* Переключение кнопки "Открыть / Скрыть" описание на карточке */
window.toggleIdeaDesc = function(ev, id) {
  if (ev) ev.stopPropagation();
  OPEN_DESC_MAP[id] = !OPEN_DESC_MAP[id];
  var box = document.getElementById('desc_' + id);
  var btn = document.getElementById('descBtn_' + id);
  if (box) {
    box.classList.toggle('open', !!OPEN_DESC_MAP[id]);
  }
  if (btn) {
    btn.innerHTML = OPEN_DESC_MAP[id] ? '🔼 Скрыть' : '📖 Открыть';
  }
};

function renderItems() {
  var curSecObj = secInfo(CUR_SEC);
  document.getElementById('pageTitle').textContent = curSecObj.ic + ' ' + curSecObj.n;
  document.getElementById('pageActions').innerHTML = window.adminMode
    ? '<button class="btn" onclick="openIdeaForm(null)">＋ Добавить предложение</button>'
    : '';

  var q = (SEARCH_Q || '').toLowerCase();
  var list = window.ITEMS.filter(function(it) {
    if (!isRealIdeaItem(it)) return false;
    if (CUR_SEC !== 'all' && it.fac !== CUR_SEC) return false;
    if (q) {
      var hay = ((it.title || '') + ' ' + (it.text || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  var box = document.getElementById('items');
  if (!list.length) {
    box.innerHTML = '<div class="empty">В этом разделе пока нет предложений</div>';
    return;
  }

  box.innerHTML = list.map(function(it) {
    autoBindAppUrl(it);
    var sec = secInfo(it.fac);
    var isDescOpen = !!OPEN_DESC_MAP[it.id];
    var appBadge = it.appUrl ? '<span class="ic-app-badge">⚡ Интерактивный модуль</span>' : '';
    var admBtns = window.adminMode
      ? '<div class="ic-tools" onclick="event.stopPropagation()">' +
          '<button class="btn ghost slim" onclick="openIdeaForm(\'' + it.id + '\')">✏️</button>' +
          '<button class="btn warn slim" onclick="deleteIdea(\'' + it.id + '\')">🗑</button>' +
        '</div>'
      : '';

    var mediaHtml = '';
    if ((it.images && it.images.length) || (it.videos && it.videos.length)) {
      mediaHtml = '<div class="media-grid">';
      (it.images || []).forEach(function(src) {
        mediaHtml += '<img src="' + escapeHtml(src) + '" alt="">';
      });
      (it.videos || []).forEach(function(src) {
        mediaHtml += '<video src="' + escapeHtml(src) + '" controls></video>';
      });
      mediaHtml += '</div>';
    }

    /* Кнопка открытия интерактивного модуля называется так же, как само предложение! */
    var openModuleBtn = it.appUrl
      ? '<button class="btn slim" onclick="event.stopPropagation();openIdeaCard(\'' + it.id + '\')">⚡ ' + escapeHtml(it.title) + ' →</button>'
      : '';

    return '<div class="icard">' +
      '<div class="ic-top">' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
          '<span class="ic-badge">' + sec.ic + ' ' + sec.n + '</span>' +
          appBadge +
        '</div>' +
        admBtns +
      '</div>' +
      '<div class="ic-title">' + escapeHtml(it.title) + '</div>' +
      '<div class="ic-desc-box' + (isDescOpen ? ' open' : '') + '" id="desc_' + it.id + '">' +
        escapeHtml(it.text || '') +
        (it.tableHtml || '') +
        mediaHtml +
      '</div>' +
      '<div class="ic-foot">' +
        '<button class="btn ghost slim" id="descBtn_' + it.id + '" onclick="toggleIdeaDesc(event,\'' + it.id + '\')">' +
          (isDescOpen ? '🔼 Скрыть' : '📖 Открыть') +
        '</button>' +
        openModuleBtn +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  renderTopBar();
  renderSidebar();
  renderItems();
}
window.render = render;

/* ===================== ОТКРЫТИЕ ИНТЕРАКТИВНОГО ПРИЛОЖЕНИЯ ===================== */
window.openIdeaCard = function(id) {
  var it = null;
  for (var i = 0; i < window.ITEMS.length; i++) {
    if (window.ITEMS[i].id === id) { it = window.ITEMS[i]; break; }
  }
  if (!it) return;
  autoBindAppUrl(it);

  var m = document.getElementById('mroot');
  if (it.appUrl) {
    if (it.appUrl.indexOf('builtin:') === 0) {
      m.innerHTML =
        '<div class="back" onclick="if(event.target===this)closeModal()">' +
          '<div class="modal app-modal">' +
            '<div class="m-head">' +
              '<div class="mh-title"><span>⚡</span><span>' + escapeHtml(it.title) + '</span></div>' +
              '<button class="m-close" onclick="closeModal()">✕</button>' +
            '</div>' +
            '<div class="m-body" style="padding:0">' + getBuiltinAppHtml(it.appUrl) + '</div>' +
          '</div>' +
        '</div>';
      return;
    }

    var targetUrl = it.appUrl;
    var iframeSrc = targetUrl + (targetUrl.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
    m.innerHTML =
      '<div class="back" onclick="if(event.target===this)closeModal()">' +
        '<div class="modal app-modal">' +
          '<div class="m-head">' +
            '<div class="mh-title"><span>⚡</span><span>' + escapeHtml(it.title) + '</span></div>' +
            '<button class="m-close" onclick="closeModal()">✕</button>' +
          '</div>' +
          '<div class="m-body iframe-wrap">' +
            '<iframe class="app-iframe" src="' + iframeSrc + '" allowfullscreen></iframe>' +
          '</div>' +
        '</div>' +
      '</div>';
    return;
  }

  /* Если модуля нет — просто разворачиваем описание карточки */
  toggleIdeaDesc(null, it.id);
};

/* ===================== ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ ПРЕДЛОЖЕНИЯ ===================== */
window.openIdeaForm = function(editId) {
  if (!window.adminMode) return;
  var it = null;
  if (editId) {
    for (var i = 0; i < window.ITEMS.length; i++) {
      if (window.ITEMS[i].id === editId) { it = window.ITEMS[i]; break; }
    }
  }
  var curFac = it ? it.fac : (CUR_SEC !== 'all' ? CUR_SEC : 'general');
  var secOpts = SECTIONS.filter(function(s) { return s.k !== 'all'; }).map(function(s) {
    return '<option value="' + s.k + '"' + (s.k === curFac ? ' selected' : '') + '>' + s.ic + ' ' + s.n + '</option>';
  }).join('');

  var appList = [
    { v: '',                  n: '— Без интерактивного модуля —' },
    { v: 'apps/garage.html',     n: '🚔 Автопарк и форма (apps/garage.html)' },
    { v: 'apps/mvd-radial.html', n: '🛡️ Фракционное радиальное меню (apps/mvd-radial.html)' },
    { v: 'apps/epaulettes.html', n: '🎖️ Стенд погон (apps/epaulettes.html)' },
    { v: 'builtin:phone',        n: '📱 Интерактивный смартфон' },
    { v: 'builtin:faction-app',  n: '🛡️ Функциональное фракционное приложение' }
  ];
  REPO_ALL_FILES.forEach(function(p) {
    if (!appList.some(function(x) { return x.v === p; })) {
      appList.push({ v: p, n: '⚡ ' + p });
    }
  });

  var appOpts = appList.map(function(a) {
    var sel = (it && (it.appUrl || '') === a.v) ? ' selected' : '';
    return '<option value="' + escapeHtml(a.v) + '"' + sel + '>' + escapeHtml(a.n) + '</option>';
  }).join('');

  var m = document.getElementById('mroot');
  m.innerHTML =
    '<div class="back" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" style="max-width:680px">' +
        '<div class="m-head">' +
          '<div class="mh-title">' + (it ? '✏️ Редактировать предложение' : '＋ Новое предложение') + '</div>' +
          '<button class="m-close" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="m-body">' +
          '<label class="flab">Раздел / Фракция</label>' +
          '<select class="sel" id="fIdeaFac" style="width:100%">' + secOpts + '</select>' +
          '<label class="flab">Заголовок предложения</label>' +
          '<input class="inp" id="fIdeaTitle" style="width:100%" value="' + escapeHtml(it ? it.title : '') + '" placeholder="Введите заголовок предложения…">' +
          '<label class="flab">Описание предложения</label>' +
          '<textarea class="inp" id="fIdeaText" rows="7" style="width:100%" placeholder="Подробное описание идеи…">' + escapeHtml(it ? it.text : '') + '</textarea>' +
          '<label class="flab">Интерактивный модуль</label>' +
          '<select class="sel" id="fIdeaApp" style="width:100%">' + appOpts + '</select>' +
        '</div>' +
        '<div class="m-foot">' +
          '<button class="btn ghost" onclick="closeModal()">Отмена</button>' +
          '<button class="btn" onclick="saveIdeaForm(\'' + (it ? it.id : '') + '\')">Сохранить</button>' +
        '</div>' +
      '</div>' +
    '</div>';
};

window.saveIdeaForm = function(editId) {
  var fac   = document.getElementById('fIdeaFac').value || 'general';
  var title = (document.getElementById('fIdeaTitle').value || '').trim();
  var text  = (document.getElementById('fIdeaText').value || '').trim();
  var app   = (document.getElementById('fIdeaApp').value || '').trim();
  if (!title) { toast('Введите заголовок предложения', true); return; }

  var it = null;
  if (editId) {
    for (var i = 0; i < window.ITEMS.length; i++) {
      if (window.ITEMS[i].id === editId) { it = window.ITEMS[i]; break; }
    }
  }
  if (!it) {
    it = {
      id: 'idea_' + Date.now().toString(36),
      date: new Date().toISOString().slice(0, 10)
    };
    window.ITEMS.unshift(it);
  }
  it.fac = fac;
  it.title = title;
  it.text = text;
  if (app) it.appUrl = app; else delete it.appUrl;
  delete it.author;

  closeModal();
  saveLocalIdeas();
  pushIdeasToGitHub();
  render();
  toast('Предложение сохранено');
};

window.deleteIdea = function(id) {
  if (!window.adminMode) return;
  if (!confirm('Удалить это предложение?')) return;
  DELETED_IDEA_IDS[id] = 1;
  try { localStorage.setItem(DELETED_IDEAS_K, JSON.stringify(DELETED_IDEA_IDS)); } catch (e) {}
  window.ITEMS = window.ITEMS.filter(function(x) { return x.id !== id; });
  saveLocalIdeas();
  pushIdeasToGitHub();
  render();
  toast('Предложение удалено');
};

window.closeModal = function() {
  document.getElementById('mroot').innerHTML = '';
};

document.getElementById('searchInp').addEventListener('input', function() {
  SEARCH_Q = this.value;
  renderItems();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

/* ===================== ЗАПУСК ===================== */
window.ITEMS = loadLocalIdeasFromAllBrowserKeys();
render();
scanRepoTree();

recoverIdeasFromGitHubHistory().then(function(recoveredLists) {
  if (recoveredLists && recoveredLists.length) {
    window.ITEMS = mergeAndCleanIdeas(recoveredLists.concat([window.ITEMS]));
    window.ITEMS.forEach(autoBindAppUrl);
    saveLocalIdeas();
    render();
    pushIdeasToGitHub();
  }
});
</script>
