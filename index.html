<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Предложения · Фракции · Работы и прочее</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* Чередование цветов карточек предложений (зебра), чтобы ячейки не сливались */
#items > .card:nth-child(odd),
#list > .card:nth-child(odd),
.cards > .card:nth-child(odd),
.card:nth-of-type(odd),
.icard:nth-of-type(odd) {
  background: linear-gradient(145deg, #161d28, #121721) !important;
  border: 1px solid #242f40 !important;
  border-left: 3px solid #365985 !important;
}

#items > .card:nth-child(even),
#list > .card:nth-child(even),
.cards > .card:nth-child(even),
.card:nth-of-type(even),
.icard:nth-of-type(even) {
  background: linear-gradient(145deg, #1f293a, #182130) !important;
  border: 1px solid #33445e !important;
  border-left: 3px solid #4da3ff !important;
  box-shadow: inset 0 1px 0 rgba(77, 163, 255, 0.09), 0 8px 24px rgba(0, 0, 0, 0.35) !important;
}

#items > .card:hover,
.card:hover,
.icard:hover {
  border-color: #56a8ff !important;
  transform: translateY(-2px);
}
</style>
</head>
<body>
<div id="errbox"></div>
<script>
window.addEventListener('error',function(ev){
 if(!(ev instanceof ErrorEvent)){return}
 if(!ev.message){return}
 var b=document.getElementById('errbox');
 if(b){
  b.style.display='block';
  b.textContent='Ошибка: '+ev.message+(ev.filename?'\n'+ev.filename+':'+(ev.lineno||0):'');
 }
},true);
</script>

<header id="top">
  <div class="brand">
    <div class="logo">💡</div>
    <div>
      <div class="b-title">ПРЕДЛОЖЕНИЯ · ФРАКЦИИ · РАБОТЫ И ПРОЧЕЕ</div>
    </div>
  </div>
  <div id="topRight"></div>
</header>

<div id="wrap">
  <aside id="side"></aside>
  <main id="content">
    <div id="main"></div>
  </main>
</div>

<input type="file" id="imgInp" accept="image/*" multiple style="display:none">
<input type="file" id="vidInp" accept="video/*" multiple style="display:none">
<div id="lb"><img id="lbImg" alt=""></div>
<div id="mroot"></div>
<div id="croot"></div>
<div id="troot"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/github.js"></script>
<script src="js/render.js"></script>
<script src="js/modals.js"></script>
<script src="js/main.js"></script>

<!-- АВТООЧИСТКА ПУСТЫХ ПРЕДЛОЖЕНИЙ БЕЗ ЗАГОЛОВКА И ВОССТАНОВЛЕНИЕ СПИСКА ИДЕЙ -->
<script>
(function() {
  function isRealIdeaItem(it) {
    if (!it || typeof it !== 'object') return false;
    /* Отсекаем случайно попавшие записи из автопарка/формы */
    if (it.kind === 'cars' || it.kind === 'form' || it.dep || typeof it.speed !== 'undefined') return false;
    var title = String(it.title || '').replace(/\s+/g, ' ').trim();
    var text  = String(it.text || it.desc || '').replace(/\s+/g, ' ').trim();
    if (!title || title === 'Без названия' || title === '—' || title === 'null' || title === 'undefined') return false;
    var hasMedia = (Array.isArray(it.images) && it.images.length > 0) ||
                   (Array.isArray(it.videos) && it.videos.length > 0) ||
                   !!it.appUrl || !!it.iframe;
    if (!text && !hasMedia) return false;
    return true;
  }

  function cleanAndRestoreIdeas() {
    if (!window.ITEMS || !Array.isArray(window.ITEMS)) return;

    var prevLen = window.ITEMS.length;
    var valid = window.ITEMS.filter(isRealIdeaItem);

    /* Если из-за прошлой перезаписи data.json список идей оказался пуст или повреждён —
       восстанавливаем стандартные идеи из seed() и дополняем вашими настоящими идеями */
    if (typeof window.seed === 'function') {
      var baseSeeds = window.seed() || [];
      var existingIds = {};
      valid.forEach(function(x) { if (x && x.id) existingIds[x.id] = true; });
      baseSeeds.forEach(function(s) {
        if (s && s.id && !existingIds[s.id] && isRealIdeaItem(s)) {
          valid.push(s);
          existingIds[s.id] = true;
        }
      });
    }

    if (valid.length !== prevLen) {
      window.ITEMS = valid;
      try {
        if (typeof window.cacheItems === 'function') window.cacheItems();
        if (typeof window.saveLocal === 'function') window.saveLocal(window.ITEMS);
        if (typeof window.render === 'function') window.render();
        if (window.adminMode && typeof window.commit === 'function') window.commit();
      } catch (e) {}
    }
  }

  window.addEventListener('DOMContentLoaded', cleanAndRestoreIdeas);
  window.addEventListener('load', cleanAndRestoreIdeas);
  setInterval(cleanAndRestoreIdeas, 500);
})();
</script>
</body>
</html>
