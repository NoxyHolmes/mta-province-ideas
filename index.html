<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Предложения · Фракции · Работы и прочее</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0e14;
  --bg2:#111620;
  --card:#161d29;
  --card-even:#1e2738;
  --line:#252f42;
  --line-even:#344560;
  --txt:#ecf0f8;
  --mut:#8b96ab;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
}
html{color-scheme:dark}
body{
  background:
    radial-gradient(1200px 600px at 12% -10%,rgba(45,100,180,.18),transparent 60%),
    radial-gradient(1000px 550px at 105% 110%,rgba(120,80,220,.12),transparent 55%),
    #0b0e14;
  color:var(--txt);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:14px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#283244;border-radius:8px;border:2px solid #0e131b}
::-webkit-scrollbar-thumb:hover{background:#38465e}

#top{
  position:sticky;
  top:0;
  z-index:200;
  height:56px;
  background:rgba(13,17,24,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:#dbe7ff}
.logo{
  width:32px;
  height:32px;
  border-radius:10px;
  background:linear-gradient(135deg,#4da3ff,#6d5dfc);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  box-shadow:0 4px 14px rgba(77,163,255,.35);
}
#topRight{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#141a24;
  color:var(--mut);
  font-size:12px;
  font-weight:700;
}
.pill .gdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.btn{
  background:linear-gradient(145deg,#3684e6,#2563eb);
  border:1px solid #3d75c4;
  color:#fff;
  padding:8px 15px;
  border-radius:10px;
  font-weight:700;
  font-size:12.5px;
  cursor:pointer;
  font-family:inherit;
  transition:all .18s;
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.ghost{background:#151c27;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:#3a4a63}
.btn.warn{background:linear-gradient(145deg,#b93838,#8c2626);border-color:#c24646}
.btn.slim{padding:6px 12px;font-size:11.5px}

#wrap{
  max-width:1460px;
  width:100%;
  margin:0 auto;
  display:grid;
  grid-template-columns:250px 1fr;
  gap:24px;
  padding:22px;
  flex:1;
}
#side{
  position:sticky;
  top:76px;
  align-self:start;
  background:rgba(18,23,32,.75);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 10px;
}
.s-grp{
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.4px;
  color:#647187;
  padding:8px 12px 6px;
}
.s-grp:not(:first-child){margin-top:10px;border-top:1px solid rgba(255,255,255,.05);padding-top:14px}
.s-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:11px;
  border:1px solid transparent;
  background:transparent;
  color:var(--mut);
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
  text-align:left;
  transition:all .16s;

}
.s-btn:hover{color:var(--txt);background:rgba(255,255,255,.03)}

  color:#fff;
  background:linear-gradient(90deg,rgba(77,163,255,.22),rgba(77,163,255,.05));

}
.s-cnt{
  margin-left:auto;
  background:#1f293a;
  border:1px solid #2e3d56;
  color:#a8c1e8;

.ph h1{font-size:22px;font-weight:800}
.ph-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.inp,.sel{
  background:#131923;

  border-radius:11px;
  font-size:13.5px;
  font-family:inherit;
  outline:none;
  transition:border-color .18s;
}
.inp:focus,.sel:focus{border-color:var(--acc)}

#items{display:flex;flex-direction:column;gap:14px}

/* ЧЕРЕДОВАНИЕ ЦВЕТОВ ЯЧЕЕК ПРЕДЛОЖЕНИЙ (ЗЕБРА) */
.icard{

}
#items > .icard:nth-child(odd){

  background:linear-gradient(145deg,#1f293b,#182130);
  border:1px solid #354764;
  border-left:4px solid #4da3ff;
  box-shadow:inset 0 1px 0 rgba(77,163,255,.1),0 8px 24px rgba(0,0,0,.32);
}
#items > .icard:hover{
  border-color:#58aaff;
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}

.ic-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ic-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:rgba(77,163,255,.14);
  border:1px solid rgba(77,163,255,.35);
  color:#93c5fd;
}
.ic-app-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:rgba(47,217,122,.14);
  border:1px solid rgba(47,217,122,.35);
  color:#6ee7b7;
}
.ic-title{font-size:17px;font-weight:800;color:#fff;margin-bottom:6px;line-height:1.35}
.ic-text{font-size:13px;color:var(--mut);line-height:1.58;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ic-foot{display:flex;align-items:center;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.07);font-size:12px}
.ic-tools{display:flex;gap:6px}

.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.media-grid img,.media-grid video{width:100%;border-radius:12px;border:1px solid var(--line);max-height:260px;object-fit:cover;background:#0e131b}

.back{
  position:fixed;
  inset:0;
  background:rgba(4,7,12,.82);
  backdrop-filter:blur(8px);
  z-index:500;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow-y:auto;
  padding:24px 16px;
}
.modal{
  width:100%;
  max-width:1180px;
  background:#141a24;
  border:1px solid #2b3648;
  border-radius:18px;
  box-shadow:0 30px 90px rgba(0,0,0,.75);

  display:flex;
  flex-direction:column;
}
.modal.app-modal{max-width:1420px;height:calc(100vh - 48px)}
.m-head{
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;

}
.mh-title{font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px}
.m-close{

  color:#fda4af;

  height:32px;

  font-size:14px;

.m-close:hover{background:#9f1239;color:#fff}
.m-body{padding:20px;overflow-y:auto;flex:1}
.m-body.iframe-wrap{padding:0;display:flex;flex-direction:column;overflow:hidden}
.app-iframe{width:100%;height:100%;border:0;flex:1;background:#0e1116}
.m-foot{padding:14px 20px;border-top:1px solid var(--line);background:#10151e;display:flex;justify-content:flex-end;gap:10px}
.flab{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:12px 0 6px}
.flab:first-child{margin-top:0}

#troot{position:fixed;right:18px;bottom:18px;z-index:800;display:flex;flex-direction:column;gap:8px}
.toast{background:#1b2432;border:1px solid #32445e;border-left:3px solid var(--acc);padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.warn{border-left-color:var(--red)}
.empty{padding:36px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}

@media(max-width:860px){
  #wrap{grid-template-columns:1fr;padding:14px}
  #side{position:static}

</style>

<script>
/* ===================== АВТООПРЕДЕЛЕНИЕ РЕПОЗИТОРИЯ ===================== */
var REPO = (function() {
  var h = location.hostname, p = location.pathname;
  if (!/\.github\.io$/.test(h)) return 'noxyholmes/mta-province-ideas';
  var owner = h.replace(/\.github\.io$/, '');
  var seg = p.split('/').filter(Boolean);
  return owner + '/' + (seg.length ? seg[0] : (owner + '.github.io'));
})();
var BRANCH = 'main';
var IDEAS_DATA_FILE = 'ideas_data.json';

/* ===================== ФРАКЦИИ И РАЗДЕЛЫ ЛЕВОГО МЕНЮ ===================== */
var SECTIONS = [
  { k: 'all',     grp: 'main', ic: '📋', n: 'Все предложения' },
  { k: 'general', grp: 'main', ic: '💡', n: 'Общие' },
  { k: 'mvd',     grp: 'main', ic: '🚓', n: 'МВД' },
  { k: 'mo',      grp: 'main', ic: '🎖️', n: 'Минобороны' },
  { k: 'mz',      grp: 'main', ic: '🚑', n: 'Минздрав' },
  { k: 'mt',      grp: 'main', ic: '🚆', n: 'Минтранс' },
  { k: 'opg',     grp: 'main', ic: '🔫', n: 'ОПГ' },
  { k: 'other',   grp: 'main', ic: '📦', n: 'Прочее' },
  { k: 'jobs',    grp: 'sub',  ic: '💼', n: 'Работы и прочее' }
];

function secInfo(k) {
  for (var i = 0; i < SECTIONS.length; i++) {
    if (SECTIONS[i].k === k) return SECTIONS[i];
  }
  return SECTIONS[1];
}

/* ===================== АВТОМАТИЧЕСКАЯ КАРТА ВСЕХ HTML-ПРИЛОЖЕНИЙ РЕПОЗИТОРИЯ =====================
   Сканирует реальный список файлов в репозитории, чтобы при открытии любого приложения
   (телефон, автопарк, погоны, радиальное меню и др.) никогда не возникала ошибка 404! */
var REPO_HTML_FILES = [];
var APPS_MAP = {
  'garage':     'apps/garage.html',
  'epaulettes': 'apps/epaulettes.html',
  'mvd-radial': 'apps/mvd-radial.html'
};

function scanRepoHtmlFiles() {
  if (!REPO) return;
  fetch('https://api.github.com/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(j) {
      if (!j || !Array.isArray(j.tree)) return;
      REPO_HTML_FILES = [];
      j.tree.forEach(function(node) {
        if (node && node.path && /\.html$/i.test(node.path) && node.path !== 'index.html') {
          REPO_HTML_FILES.push(node.path);
          var base = node.path.replace(/^.*\//, '').replace(/\.html$/i, '').toLowerCase();
          APPS_MAP[base] = node.path;
        }
      });
    }).catch(function() {});
}
scanRepoHtmlFiles();

/* Поиск реального существующего URL приложения (с проверкой через fetch HEAD перед открытием iframe) */
function findWorkingAppUrl(it) {
  var raw = String((it && (it.appUrl || it.app || it.iframe)) || '').trim();
  if (!raw) return Promise.resolve(null);
  if (/^https?:\/\//i.test(raw)) return Promise.resolve(raw);

  var cleanKey = raw.replace(/^apps\//i, '').replace(/\.html.*$/i, '').toLowerCase();
  var candidates = [];

  if (APPS_MAP[cleanKey]) candidates.push(APPS_MAP[cleanKey]);
  if (/\.html/i.test(raw)) {
    candidates.push(raw);
    if (raw.indexOf('apps/') !== 0) candidates.push('apps/' + raw);
  } else {
    candidates.push('apps/' + cleanKey + '.html');
    candidates.push(cleanKey + '.html');
    candidates.push('apps/' + cleanKey + '/index.html');
  }

  /* Также ищем по частичному совпадению среди всех найденных .html файлов в репозитории */
  REPO_HTML_FILES.forEach(function(p) {
    if (p.toLowerCase().indexOf(cleanKey) >= 0 && candidates.indexOf(p) < 0) {
      candidates.push(p);
    }
  });

  var idx = 0;
  function tryCandidate() {
    if (idx >= candidates.length) return Promise.resolve(null);
    var url = candidates[idx++];
    return fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + '_check=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function(r) {
        if (r.ok) return url;
        return tryCandidate();
      }).catch(function() {
        return tryCandidate();
      });
  }
  return tryCandidate();
}

/* ===================== БАЗОВЫЕ ПРЕДЛОЖЕНИЯ ===================== */
function seed() {
  return [
    {
      id: 's2',
      fac: 'general',
      title: 'Обновлённый автопарк и форма фракций',
      text: 'В данном интерактивном каталоге представлен широкий список транспортных средств и форменной одежды для государственных фракций (УМВД, ОГИБДД, ЦГБ/ОКБ, ВС РФ, РЖД), однако это не означает, что необходимо добавлять абсолютно все модели сразу — из предложенного перечня можно выбрать наиболее подходящие автомобили и комплекты формы для каждого подразделения.\n\nТранспорт и скины для мероприятий (МП-панель):\nЗачастую для проведения различных глобальных и локальных мероприятий не хватает специализированных машин госструктур (ФСБ, СК, Прокуратура, МЧС, ФСО) и соответствующих скинов, чтобы РП-ситуация выглядела атмосферной и интересной. Чтобы разнообразить их, из предложенных в каталоге вариантов можно выбрать подходящие машины и виды формы каждой структуры и добавить их в МП-панель.',
      appUrl: 'garage',
      date: '2026-10-18'
    },
    {
      id: 's_epaulettes',
      fac: 'general',
      title: 'Интерактивный стенд динамических погон (Полиция и Армия)',
      text: 'Наглядная система погон для подразделений Полиции (УМВД, ОГИБДД, ОМОН / Спецназ / СОБР, Юстиция) в повседневном и парадном исполнении, а также для Вооружённых Сил РФ (Сухопутные войска, ВКС и ВДВ, ВМФ, Росгвардия) от рядового до генерала и Маршала РФ.',
      appUrl: 'epaulettes',
      date: '2026-10-18'
    },
    {
      id: 's_radial',
      fac: 'mvd',
      title: 'Фракционное радиальное меню сотрудников МВД (УМВД / ГИБДД)',
      text: 'Комплексная система быстрого взаимодействия для сотрудников МВД через радиальное меню:\n1. Предъявление служебного удостоверения МВД РФ в развёрнутом виде.\n2. Наручники и пристёгивание задержанного к окружению.\n3. Обыск гражданина и досмотр багажника автомобиля (при открытом багажнике) с изъятием нелегальных предметов и сдачей вещдоков дежурному.\n4. Посадка и высадка до 2 задержанных в патрульный автомобиль отдельными кнопками.\n5. Прибор замера светопропускаемости стёкол («Тоник») и снятие тонировки с лобового и передних боковых стёкол.\n6. Служебный мегафон с быстрыми командами в чат и система преследования игроков в радиусе 100 метров.\n7. Эвакуация авто на штрафстоянку: при начале эвакуации возле машины даётся 5 минут на погрузку. После установки авто на эвакуатор таймер 5 минут пропадает, и даже если владелец выйдет из игры — его авто останется и не пропадёт. После доставки ТС на метку штрафстоянки владельцу приходит уведомление о необходимости оплатить 10 000 ₽ за услуги эвакуатора и штрафстоянку перед тем, как забрать ТС.',
      appUrl: 'mvd-radial',
      date: '2026-10-18'
    }
  ];
}

/* ===================== СОСТОЯНИЕ И ВОССТАНОВЛЕНИЕ ИДЕЙ ===================== */
var LOCAL_IDEAS_K = 'mvd_ideas_clean_v4';
var MAIN_KEY_K    = 'idea_admin_key';
var DELETED_IDEAS_K = 'mvd_deleted_ideas_v1';
var DELETED_IDEA_IDS = {};
try {
  DELETED_IDEA_IDS = JSON.parse(localStorage.getItem(DELETED_IDEAS_K) || '{}') || {};
} catch (e) { DELETED_IDEA_IDS = {}; }

window.adminMode  = false;
var ADMIN_KEY     = '';
var CUR_SEC       = 'all';
var SEARCH_Q      = '';
window.ITEMS      = [];

function toast(msg, warn) {
  var t = document.createElement('div');
  t.className = 'toast' + (warn ? ' warn' : '');
  t.textContent = msg;
  document.getElementById('troot').appendChild(t);
  setTimeout(function() { t.remove(); }, 3600);
}

function toArr(x) {
  if (!x) return null;
  if (Array.isArray(x)) return x;
  if (typeof x === 'object') {
    var ks = Object.keys(x).sort(function(a, b) { return a - b; });
    var res = [];
    for (var i = 0; i < ks.length; i++) res.push(x[ks[i]]);
    return res;
  }
  return null;
}

function isRealIdeaItem(it) {
  if (!it || typeof it !== 'object') return false;
  if (it.kind === 'cars' || it.kind === 'form' || it.dep || typeof it.speed !== 'undefined') return false;
  if (it.id && DELETED_IDEA_IDS[it.id]) return false;
  var title = String(it.title || it.name || '').replace(/\s+/g, ' ').trim();
  var text  = String(it.text || it.desc || it.body || '').replace(/\s+/g, ' ').trim();
  if (!title || title === 'Без названия' || title === '—' || title === 'null' || title === 'undefined') return false;
  var hasMedia = (Array.isArray(it.images) && it.images.length > 0) ||
                 (Array.isArray(it.videos) && it.videos.length > 0) ||
                 !!it.appUrl || !!it.app || !!it.iframe;
  if (!text && !hasMedia) return false;
  return true;
}

function normalizeIdeaItem(it) {
  var copy = Object.assign({}, it);
  copy.title = String(copy.title || copy.name || '').trim();
  copy.text  = String(copy.text || copy.desc || copy.body || '').trim();
  copy.fac   = copy.fac || copy.cat || copy.section || 'general';
  if (copy.app && !copy.appUrl) copy.appUrl = copy.app;
  if (!copy.id) copy.id = 'idea_' + copy.title.toLowerCase().replace(/[^a-zа-яё0-9]+/gi, '_');
  delete copy.author;
  return copy;
}

function mergeAndCleanIdeas(lists) {
  var map = {};
  var out = [];

  (lists || []).forEach(function(arr) {
    var a = toArr(arr);
    if (!a || !a.length) return;
    a.forEach(function(rawIt) {
      if (!isRealIdeaItem(rawIt)) return;
      var it = normalizeIdeaItem(rawIt);
      var key = it.id || it.title;
      if (!map[key]) {
        map[key] = it;
        out.push(it);
      } else {
        var existing = map[key];
        if ((it.text || '').length > (existing.text || '').length) existing.text = it.text;
        if (it.appUrl && !existing.appUrl) existing.appUrl = it.appUrl;
        if (it.images && it.images.length && (!existing.images || !existing.images.length)) existing.images = it.images;
        if (it.videos && it.videos.length && (!existing.videos || !existing.videos.length)) existing.videos = it.videos;
      }
    });
  });

  seed().forEach(function(s) {
    if (DELETED_IDEA_IDS[s.id]) return;
    var found = null;
    for (var i = 0; i < out.length; i++) {
      if (out[i].id === s.id || out[i].appUrl === s.appUrl || out[i].title === s.title) {
        found = out[i];
        break;
      }
    }
    if (found) {
      if (s.id === 's2' || s.id === 's_radial') {
        found.text = s.text;
        found.title = s.title;
        found.appUrl = s.appUrl;
      }
    } else {
      out.push(s);
    }
  });

  return out;
}

function loadLocalIdeasFromAllBrowserKeys() {
  var collected = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf('garage') >= 0) continue;
      try {
        var raw = JSON.parse(localStorage.getItem(k) || 'null');
        if (!raw) continue;
        var arr = toArr(raw.items || raw);
        if (arr && arr.length) collected.push(arr);
      } catch (e) {}
    }
  } catch (e) {}
  return mergeAndCleanIdeas(collected);
}

function saveLocalIdeas() {
  window.ITEMS = window.ITEMS.filter(isRealIdeaItem);
  try {
    localStorage.setItem(LOCAL_IDEAS_K, JSON.stringify({ items: window.ITEMS, savedAt: Date.now() }));
  } catch (e) {}
}

function b64e(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64d(s) { return decodeURIComponent(escape(atob(s))); }

function extractIdeasFromJson(j) {
  if (!j) return [];
  var arr = toArr(j.items || j);
  if (!arr || !arr.length) return [];
  return arr.filter(isRealIdeaItem);
}

function recoverIdeasFromGitHubHistory() {
  if (!REPO) return Promise.resolve([]);
  var headers = { Accept: 'application/vnd.github+json' };
  var tok = ADMIN_KEY || localStorage.getItem(MAIN_KEY_K) || '';
  if (tok) headers.Authorization = 'token ' + tok;

  var directUrls = [
    'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + IDEAS_DATA_FILE + '?v=' + Date.now(),
    'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/data.json?v=' + Date.now()
  ];

  return Promise.all(directUrls.map(function(u) {
    return fetch(u, { cache: 'no-store' }).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
  })).then(function(directRes) {
    var lists = [];
    directRes.forEach(function(j) {
      var found = extractIdeasFromJson(j);
      if (found.length) lists.push(found);
    });

    return fetch('https://api.github.com/repos/' + REPO + '/commits?path=data.json&per_page=25&_t=' + Date.now(), { headers: headers })
      .then(function(r) { return r.ok ? r.json() : []; })
      .then(function(commits) {
        if (!Array.isArray(commits) || !commits.length) return lists;
        var candidateShas = [];
        commits.forEach(function(c) {
          if (!c || !c.sha) return;
          var msg = (c.commit && c.commit.message) || '';
          if (msg.indexOf('garage sync') < 0) candidateShas.push(c.sha);
        });
        commits.slice(0, 12).forEach(function(c) {
          if (c && c.sha && candidateShas.indexOf(c.sha) < 0) candidateShas.push(c.sha);
        });

        var idx = 0;
        function checkNextCommit() {
          if (idx >= candidateShas.length) return Promise.resolve(lists);
          var sha = candidateShas[idx++];
          var rawCommitUrl = 'https://raw.githubusercontent.com/' + REPO + '/' + sha + '/data.json';
          return fetch(rawCommitUrl).then(function(r) { return r.ok ? r.json() : null; }).then(function(j) {
            var extracted = extractIdeasFromJson(j);
            if (extracted.length > 0) {
              lists.push(extracted);
              if (extracted.length >= 5) return lists;
            }
            return checkNextCommit();
          }).catch(function() {
            return checkNextCommit();
          });
        }
        return checkNextCommit();
      }).catch(function() { return lists; });
  });
}

function pushIdeasToGitHub() {
  var tok = ADMIN_KEY || localStorage.getItem(MAIN_KEY_K) || '';
  if (!REPO || !tok) return;
  var cleanList = window.ITEMS.filter(isRealIdeaItem);
  var snap = JSON.stringify({ rev: Date.now(), items: cleanList });
  var headers = {
    Authorization: 'token ' + tok,
    Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };

  [IDEAS_DATA_FILE, 'data.json'].forEach(function(fileName) {
    fetch('https://api.github.com/repos/' + REPO + '/contents/' + fileName + '?_t=' + Date.now(), { headers: headers })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(existing) {
        var body = {
          message: 'update ideas (' + cleanList.length + ')',
          content: b64e(snap),
          branch: BRANCH
        };
        if (existing && existing.sha) body.sha = existing.sha;
        return fetch('https://api.github.com/repos/' + REPO + '/contents/' + fileName, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify(body)
        });
      }).catch(function() {});
  });
}

/* ===================== ВХОД / ВЫХОД ВЛАДЕЛЬЦА ===================== */
window.openAdminLogin = function() {
  var savedTok = '';
  try { savedTok = localStorage.getItem(MAIN_KEY_K) || ''; } catch (e) {}
  var m = document.getElementById('mroot');
  m.innerHTML =
    '<div class="back" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" style="max-width:460px">' +
        '<div class="m-head"><div class="mh-title">🔑 Вход владельца</div><button class="m-close" onclick="closeModal()">✕</button></div>' +
        '<div class="m-body">' +
          '<label class="flab">GitHub Personal Access Token (ghp_...)</label>' +
          '<input type="password" class="inp" id="admTokInp" style="width:100%" value="' + savedTok.replace(/"/g, '&quot;') + '" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">' +
          '<div style="font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5">После входа станут доступны кнопки добавления/редактирования предложений, управление автопарком, формой и мегафоном.</div>' +
        '</div>' +
        '<div class="m-foot">' +
          '<button class="btn ghost" onclick="closeModal()">Отмена</button>' +
          '<button class="btn" onclick="confirmAdminLogin()">Войти</button>' +
        '</div>' +
      '</div>' +
    '</div>';
};

window.confirmAdminLogin = function() {
  var v = (document.getElementById('admTokInp').value || '').trim();
  if (!v) { toast('Введите токен владельца', true); return; }
  ADMIN_KEY = v;
  window.adminMode = true;
  document.body.classList.add('adm');
  try { localStorage.setItem(MAIN_KEY_K, v); } catch (e) {}
  closeModal();
  render();
  toast('Режим владельца включён');
};

window.logoutAdmin = function() {
  window.adminMode = false;
  ADMIN_KEY = '';
  document.body.classList.remove('adm');
  render();
  toast('Вы вышли из режима владельца');
};

/* ===================== РЕНДЕР СТРАНИЦЫ ===================== */
function countBySec(secK) {
  var n = 0;
  for (var i = 0; i < window.ITEMS.length; i++) {
    var it = window.ITEMS[i];
    if (!isRealIdeaItem(it)) continue;
    if (secK === 'all' || it.fac === secK) n++;
  }
  return n;
}

function renderTopBar() {
  var tr = document.getElementById('topRight');
  var ghStatus = '<span class="pill"><span class="gdot"></span>GitHub</span>';
  var ownerControls = window.adminMode
    ? '<span class="pill" style="color:#fcd34d;border-color:rgba(247,201,72,.4)">✏️ Владелец</span>' +
      '<button class="btn ghost slim" onclick="logoutAdmin()">Выйти</button>'
    : '<button class="btn ghost slim" onclick="openAdminLogin()">🔒 Вход владельца</button>';
  tr.innerHTML = ghStatus + ownerControls;
}

function renderSidebar() {
  var side = document.getElementById('side');
  var h = '<div class="s-grp">Фракции</div>';
  SECTIONS.forEach(function(s) {
    if (s.grp === 'sub') {
      h += '<div class="s-grp">Прочие предложения</div>';
    }
    h += '<button class="s-btn' + (CUR_SEC === s.k ? ' on' : '') + '" onclick="selectSection(\'' + s.k + '\')">' +
      '<span>' + s.ic + '</span>' +
      '<span>' + s.n + '</span>' +
      '<span class="s-cnt">' + countBySec(s.k) + '</span>' +
    '</button>';
  });
  side.innerHTML = h;
}

window.selectSection = function(k) {
  CUR_SEC = k;
  render();
};

function renderItems() {
  var curSecObj = secInfo(CUR_SEC);
  document.getElementById('pageTitle').textContent = curSecObj.ic + ' ' + curSecObj.n;
  document.getElementById('pageActions').innerHTML = window.adminMode
    ? '<button class="btn" onclick="openIdeaForm(null)">＋ Добавить предложение</button>'
    : '';

  var q = (SEARCH_Q || '').toLowerCase();
  var list = window.ITEMS.filter(function(it) {
    if (!isRealIdeaItem(it)) return false;
    if (CUR_SEC !== 'all' && it.fac !== CUR_SEC) return false;
    if (q) {
      var hay = ((it.title || '') + ' ' + (it.text || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  var box = document.getElementById('items');
  if (!list.length) {
    box.innerHTML = '<div class="empty">В этом разделе пока нет предложений</div>';
    return;
  }

  box.innerHTML = list.map(function(it) {
    var sec = secInfo(it.fac);
    var appBadge = it.appUrl ? '<span class="ic-app-badge">⚡ Интерактивный модуль</span>' : '';
    var admBtns = window.adminMode
      ? '<div class="ic-tools" onclick="event.stopPropagation()">' +
          '<button class="btn ghost slim" onclick="openIdeaForm(\'' + it.id + '\')">✏️</button>' +
          '<button class="btn warn slim" onclick="deleteIdea(\'' + it.id + '\')">🗑</button>' +
        '</div>'
      : '';
    return '<div class="icard" onclick="openIdeaCard(\'' + it.id + '\')">' +
      '<div class="ic-top">' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
          '<span class="ic-badge">' + sec.ic + ' ' + sec.n + '</span>' +
          appBadge +
        '</div>' +
        admBtns +
      '</div>' +
      '<div class="ic-title">' + escapeHtml(it.title) + '</div>' +
      '<div class="ic-text">' + escapeHtml(it.text || '') + '</div>' +
      '<div class="ic-foot">' +
        '<span style="color:#60a5fa;font-weight:700">' + (it.appUrl ? 'Открыть интерактивное приложение →' : 'Подробнее →') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  renderTopBar();
  renderSidebar();
  renderItems();
}
window.render = render;

/* ===================== ОТКРЫТИЕ ПРЕДЛОЖЕНИЯ БЕЗ ОШИБКИ 404 ===================== */
function renderTextAndMediaModal(it) {
  var m = document.getElementById('mroot');
  var mediaHtml = '';
  if ((it.images && it.images.length) || (it.videos && it.videos.length)) {
    mediaHtml = '<div class="media-grid">';
    (it.images || []).forEach(function(src) {
      mediaHtml += '<img src="' + escapeHtml(src) + '" alt="">';
    });
    (it.videos || []).forEach(function(src) {
      mediaHtml += '<video src="' + escapeHtml(src) + '" controls></video>';
    });
    mediaHtml += '</div>';
  }

  var sec = secInfo(it.fac);
  m.innerHTML =
    '<div class="back" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" style="max-width:860px">' +
        '<div class="m-head">' +
          '<div class="mh-title"><span>' + sec.ic + '</span><span>' + escapeHtml(it.title) + '</span></div>' +
          '<button class="m-close" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="m-body">' +
          '<div style="font-size:14px;line-height:1.68;white-space:pre-line;color:#dbe4f3">' + escapeHtml(it.text || '') + '</div>' +
          mediaHtml +
        '</div>' +
        '<div class="m-foot"><button class="btn ghost" onclick="closeModal()">Закрыть</button></div>' +
      '</div>' +
    '</div>';
}

window.openIdeaCard = function(id) {
  var it = null;
  for (var i = 0; i < window.ITEMS.length; i++) {
    if (window.ITEMS[i].id === id) { it = window.ITEMS[i]; break; }
  }
  if (!it) return;

  if (it.appUrl) {
    findWorkingAppUrl(it).then(function(validUrl) {
      if (validUrl) {
        var m = document.getElementById('mroot');
        var iframeSrc = validUrl + (validUrl.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
        m.innerHTML =
          '<div class="back" onclick="if(event.target===this)closeModal()">' +
            '<div class="modal app-modal">' +
              '<div class="m-head">' +
                '<div class="mh-title"><span>⚡</span><span>' + escapeHtml(it.title) + '</span></div>' +
                '<button class="m-close" onclick="closeModal()">✕</button>' +
              '</div>' +
              '<div class="m-body iframe-wrap">' +
                '<iframe class="app-iframe" src="' + iframeSrc + '" allowfullscreen></iframe>' +
              '</div>' +
            '</div>' +
          '</div>';
      } else {
        /* Если отдельного .html файла для этого предложения нет — открываем подробное описание и медиа без ошибки 404 */
        renderTextAndMediaModal(it);
      }
    });
    return;
  }

  renderTextAndMediaModal(it);
};

/* ===================== ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ ПРЕДЛОЖЕНИЯ ===================== */
window.openIdeaForm = function(editId) {
  if (!window.adminMode) return;
  var it = null;
  if (editId) {
    for (var i = 0; i < window.ITEMS.length; i++) {
      if (window.ITEMS[i].id === editId) { it = window.ITEMS[i]; break; }
    }
  }
  var curFac = it ? it.fac : (CUR_SEC !== 'all' ? CUR_SEC : 'general');
  var secOpts = SECTIONS.filter(function(s) { return s.k !== 'all'; }).map(function(s) {
    return '<option value="' + s.k + '"' + (s.k === curFac ? ' selected' : '') + '>' + s.ic + ' ' + s.n + '</option>';
  }).join('');

  var m = document.getElementById('mroot');
  m.innerHTML =
    '<div class="back" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" style="max-width:680px">' +
        '<div class="m-head">' +
          '<div class="mh-title">' + (it ? '✏️ Редактировать предложение' : '＋ Новое предложение') + '</div>' +
          '<button class="m-close" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="m-body">' +
          '<label class="flab">Раздел / Фракция</label>' +
          '<select class="sel" id="fIdeaFac" style="width:100%">' + secOpts + '</select>' +
          '<label class="flab">Заголовок предложения</label>' +
          '<input class="inp" id="fIdeaTitle" style="width:100%" value="' + escapeHtml(it ? it.title : '') + '" placeholder="Введите заголовок предложения…">' +
          '<label class="flab">Описание предложения</label>' +
          '<textarea class="inp" id="fIdeaText" rows="7" style="width:100%" placeholder="Подробное описание идеи…">' + escapeHtml(it ? it.text : '') + '</textarea>' +
          '<label class="flab">Встроенный модуль (необязательно)</label>' +
          '<input class="inp" id="fIdeaApp" style="width:100%" value="' + escapeHtml(it && it.appUrl ? it.appUrl : '') + '" placeholder="Например: garage, epaulettes, mvd-radial или оставьте пустым">' +
        '</div>' +
        '<div class="m-foot">' +
          '<button class="btn ghost" onclick="closeModal()">Отмена</button>' +
          '<button class="btn" onclick="saveIdeaForm(\'' + (it ? it.id : '') + '\')">Сохранить</button>' +
        '</div>' +
      '</div>' +
    '</div>';
};

window.saveIdeaForm = function(editId) {
  var fac   = document.getElementById('fIdeaFac').value || 'general';
  var title = (document.getElementById('fIdeaTitle').value || '').trim();
  var text  = (document.getElementById('fIdeaText').value || '').trim();
  var app   = (document.getElementById('fIdeaApp').value || '').trim();
  if (!title) { toast('Введите заголовок предложения', true); return; }

  var it = null;
  if (editId) {
    for (var i = 0; i < window.ITEMS.length; i++) {
      if (window.ITEMS[i].id === editId) { it = window.ITEMS[i]; break; }
    }
  }
  if (!it) {
    it = {
      id: 'idea_' + Date.now().toString(36),
      date: new Date().toISOString().slice(0, 10)
    };
    window.ITEMS.unshift(it);
  }
  it.fac = fac;
  it.title = title;
  it.text = text;
  if (app) it.appUrl = app; else delete it.appUrl;
  delete it.author;

  closeModal();
  saveLocalIdeas();
  pushIdeasToGitHub();
  render();
  toast('Предложение сохранено');
};

window.deleteIdea = function(id) {
  if (!window.adminMode) return;
  if (!confirm('Удалить это предложение?')) return;
  DELETED_IDEA_IDS[id] = 1;
  try { localStorage.setItem(DELETED_IDEAS_K, JSON.stringify(DELETED_IDEA_IDS)); } catch (e) {}
  window.ITEMS = window.ITEMS.filter(function(x) { return x.id !== id; });
  saveLocalIdeas();
  pushIdeasToGitHub();
  render();
  toast('Предложение удалено');
};

window.closeModal = function() {
  document.getElementById('mroot').innerHTML = '';
};

document.getElementById('searchInp').addEventListener('input', function() {
  SEARCH_Q = this.value;
  renderItems();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

/* ===================== ЗАПУСК ===================== */
window.ITEMS = loadLocalIdeasFromAllBrowserKeys();
render();

recoverIdeasFromGitHubHistory().then(function(recoveredLists) {
  if (recoveredLists && recoveredLists.length) {
    var beforeCount = window.ITEMS.length;
    window.ITEMS = mergeAndCleanIdeas([window.ITEMS].concat(recoveredLists));
    saveLocalIdeas();
    render();
    if (window.ITEMS.length > beforeCount) {
      pushIdeasToGitHub();
    }
  }
});
</script>
