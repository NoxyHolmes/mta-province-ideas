<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Предложения · Фракции · Работы и прочее</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="errbox"></div>

  <header id="topbar">
    <div class="tb-left">
      <div class="logo-ic">💡</div>
      <div class="tb-title">ПРЕДЛОЖЕНИЯ · ФРАКЦИИ · РАБОТЫ И ПРОЧЕЕ</div>
    </div>
    <div class="tb-right">
      <div class="sync" id="sync"><i></i><span id="syncTxt">Локально</span></div>
      <div id="adminZone"></div>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <nav id="nav"></nav>
    </aside>

    <main id="content">
      <!-- Список предложений -->
      <div id="ideasView">
        <div class="ph">
          <div>
            <h1><span id="hTitle">Общие</span><span class="cnt" id="hCnt">0</span></h1>
            <div class="ph-sub" id="hSub"></div>
          </div>
          <div class="ph-actions">
            <input class="inp" id="qInp" placeholder="🔍 Поиск по предложениям…" style="width:100%;max-width:340px;margin:0 0 10px">
            <button class="btn big" id="addBtn" onclick="openAdd()" style="display:none">＋ Добавить предложение</button>
          </div>
        </div>
        <div id="items"></div>
      </div>

      <!-- Контейнер для телефона и функционала фракции (справа от меню, закрывается на ✕) -->
      <div id="appInlineView" class="app-inline" style="display:none">
        <div class="app-inline-bar">
          <div class="app-inline-title">
            <span id="appOvIcon">📱</span>
            <b id="appOvName">Функциональное фракционное приложение</b>
          </div>
          <button class="app-close-x" onclick="closeAppDemo()" title="Закрыть и вернуться к списку предложений">✕</button>
        </div>
        <iframe id="appFrame" src="about:blank"></iframe>
      </div>
    </main>
  </div>

  <nav id="mnav"></nav>

  <input type="file" id="fileInp" accept="image/*,video/*" multiple style="display:none">
  <div id="lb"><img id="lbImg" alt=""></div>
  <div id="mroot"></div>
  <div id="croot"></div>
  <div id="troot"></div>
  <div id="savebar">
    <span id="savebarTxt"></span>
    <button class="btn slim" onclick="retryPush()">Повторить</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/github.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
