<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автопарк и форма фракций</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1116;
  --bg2:#131820;
  --card:#191f28;
  --line:#27303d;
  --txt:#e9edf4;
  --mut:#8b95a7;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
}
html,body{color-scheme:dark;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
body{background:#0b0e14}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3342;border-radius:8px}
button{font-family:inherit;cursor:pointer}

.g-wrap{max-width:1640px;margin:0 auto;padding:28px 24px 60px}

/* Верхняя шапка в точности как на вашем скриншоте */
.g-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:16px;
  margin-bottom:20px;
}
.g-title-block h1{font-size:25px;font-weight:900;display:flex;align-items:center;gap:12px;color:#fff}
.g-title-block h1 .badge-cnt{background:#161f30;border:1px solid #27354f;padding:2px 12px;border-radius:20px;font-size:13px;color:#93c5fd;font-weight:700}
.g-title-block p{color:var(--mut);font-size:13px;margin-top:5px}

.g-top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Кнопки Автопарк / Форма справа вверху */
.t-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 18px;border-radius:12px;
  border:1px solid #27303d;background:#131820;
  color:var(--mut);font-weight:800;font-size:13px;cursor:pointer;transition:.18s;
}
.t-btn:hover{border-color:#3a4757;color:#fff}
.t-btn.on{background:#1c2432;border-color:#3b82f6;color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.25)}

/* Кнопка Добавить машину */
.add-btn{
  padding:10px 20px;border-radius:12px;
  border:1px solid rgba(59,130,246,.5);
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  color:#fff;font-weight:800;font-size:13px;cursor:pointer;transition:.18s;
  box-shadow:0 6px 20px rgba(37,99,235,.35);
}
.add-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* Переключатели разделов (Основной автопарк / Мероприятия) */
.section-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.s-tab{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border-radius:14px;
  border:1px solid #27303d;background:#131820;
  color:var(--mut);font-weight:800;font-size:13px;cursor:pointer;transition:.18s;
}
.s-tab:hover{border-color:#3a4757;color:#fff}
.s-tab.on{background:#192231;border-color:#3b82f6;color:#fff;box-shadow:0 6px 20px rgba(59,130,246,.22)}
.s-tab .st-cnt{background:#0e1116;padding:1px 8px;border-radius:10px;font-size:11px;color:#93c5fd}

/* Панель фильтров фракций (чипсы) */
.fac-bar{
  background:#131820;
  border:1px solid #27303d;
  border-radius:16px;
  padding:12px 16px;
  margin-bottom:16px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.f-chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:11px;
  border:1px solid #27303d;background:#191f28;
  color:var(--mut);font-size:12px;font-weight:800;cursor:pointer;transition:.15s;
}
.f-chip:hover{border-color:#3a4656;color:var(--txt)}
.f-chip.on{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.2)}
.f-chip .fc-cnt{background:#0e1116;border:1px solid #27303d;padding:1px 7px;border-radius:10px;font-size:10.5px;color:#93c5fd}

.search-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.inp,.sel,textarea.inp{
  background:#131820;border:1px solid #27303d;color:var(--txt);
  padding:10px 14px;border-radius:12px;font-size:13.5px;font-family:inherit;outline:none;width:100%;
}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,163,255,.14)}

/* Сетка ровно по 5 карточек в ряд */
.cards-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media(max-width:1550px){.cards-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1250px){.cards-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cards-grid{grid-template-columns:1fr}}

.vcard{
  background:linear-gradient(145deg,#191f28,#131820);
  border:1px solid #27303d;border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;
  position:relative;transition:transform .16s,border-color .16s,box-shadow .16s;
}
.vcard:hover{transform:translateY(-2px);border-color:#3a4757;box-shadow:0 12px 30px rgba(0,0,0,.38)}
.vimg{
  width:100%;aspect-ratio:16/10;background:#0e1116;
  position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-bottom:1px solid #27303d;
}
.vcard.skin .vimg{aspect-ratio:4/4}
.vimg img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .22s}
.vcard:hover .vimg img{transform:scale(1.03)}
.vph{display:flex;flex-direction:column;align-items:center;gap:5px;color:#5b6678;font-size:11.5px;font-weight:700;text-align:center;padding:10px}
.vph span{font-size:32px}

.vbadges{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.vtag{
  padding:3px 8px;border-radius:7px;font-size:10px;font-weight:800;
  background:rgba(14,17,22,.88);border:1px solid rgba(255,255,255,.12);color:#cfe0f5;
}
.vtag.speed{color:#ffd98a;border-color:rgba(247,201,72,.4)}

.vbody{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:5px}
.vtitle{font-weight:800;font-size:14.5px;color:#fff;line-height:1.3}
.vsub{font-size:11.5px;color:var(--mut);line-height:1.4}

.vtools{
  display:none;gap:6px;padding:8px 14px 12px;border-top:1px dashed #27303d;
}
body.adm .vtools{display:flex}
.vbtn{
  flex:1;padding:6px 8px;border-radius:8px;background:#141a23;border:1px solid #27303d;
  color:#c9d3e3;font-size:11px;font-weight:700;transition:.15s;
}
.vbtn:hover{border-color:var(--acc);color:#fff}
.vbtn.del:hover{border-color:var(--red);color:#ffb3b3}

.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--mut);border:1px dashed #27303d;border-radius:16px}

/* Модальное окно */
.back{position:fixed;inset:0;background:rgba(4,7,11,.78);backdrop-filter:blur(7px);z-index:400;display:none;justify-content:center;align-items:flex-start;overflow-y:auto;padding:34px 14px}
.modal{width:100%;max-width:540px;background:#131820;border:1px solid #27303d;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden;display:flex;flex-direction:column}
.m-head{padding:18px 22px 14px;border-bottom:1px solid #27303d;position:relative;background:linear-gradient(180deg,rgba(77,163,255,.08),transparent)}
.m-close{position:absolute;top:13px;right:14px;background:#191f28;border:1px solid #27303d;color:var(--mut);width:30px;height:30px;border-radius:8px}
.mh-nm{font-size:17px;font-weight:800}
.m-body{padding:16px 22px;display:flex;flex-direction:column;gap:10px;max-height:72vh;overflow-y:auto}
.m-foot{padding:12px 22px;border-top:1px solid #27303d;background:#0e1116;display:flex;justify-content:flex-end;gap:10px}
.flab{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800;margin-bottom:3px;display:block}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.up-zone{
  border:1.5px dashed #3a5072;background:rgba(77,163,255,.06);
  border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.15s;
}
.up-zone:hover{border-color:var(--acc);background:rgba(77,163,255,.12)}
.up-prev{width:100%;max-height:190px;object-fit:contain;border-radius:9px;margin-top:9px;display:none;border:1px solid #27303d;background:#0b0e14}

#lb{position:fixed;inset:0;z-index:600;background:rgba(4,7,11,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb img{max-width:92vw;max-height:88vh;border-radius:14px;border:1px solid #27303d}

#troot{position:fixed;right:18px;bottom:18px;z-index:700;display:flex;flex-direction:column;gap:8px}
.toast{background:#191f28;border:1px solid #32435c;border-left:3px solid var(--acc);padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.45)}
</style>
</head>
<body>

<div class="g-wrap">
  <!-- Шапка со счётчиком и кнопками -->
  <div class="g-top">
    <div class="g-title-block">
      <h1>Автопарк <span class="badge-cnt" id="totalCount">0</span></h1>
      <p id="subTitleText">Основной автопарк фракции</p>
    </div>
    <div class="g-top-right">
      <button class="t-btn on" id="btnModeCar" onclick="setCatalogType('car')">🚗 Автопарк</button>
      <button class="t-btn" id="btnModeSkin" onclick="setCatalogType('skin')">👔 Форма</button>
      <button class="add-btn" id="btnAddMain" style="display:none" onclick="openModal(null)">+ Добавить машину</button>
    </div>
  </div>

  <!-- Переключатели Основной / МП -->
  <div class="section-tabs">
    <button class="s-tab on" id="secGov" onclick="setSection('gov')">🏛️ Основной автопарк фракции <span class="st-cnt" id="cntGov">0</span></button>
    <button class="s-tab" id="secMp" onclick="setSection('mp')">🎪 Автопарк для мероприятий <span class="st-cnt" id="cntMp">0</span></button>
  </div>

  <!-- Панель чипсов фракций -->
  <div class="fac-bar" id="facBar"></div>

  <div class="search-row">
    <input class="inp" id="qInp" style="max-width:420px" placeholder="🔍 Поиск по названию..." oninput="renderGrid()">
  </div>

  <div class="cards-grid" id="cardsGrid"></div>
</div>

<!-- Модальное окно -->
<div class="back" id="mBack" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-head">
      <button class="m-close" onclick="closeModal()">✕</button>
      <div class="mh-nm" id="mTitle">Добавить машину</div>
    </div>
    <div class="m-body">
      <div class="form2">
        <div>
          <label class="flab">Категория *</label>
          <select class="sel" id="fKind" onchange="syncModalFields()">
            <option value="car">🚗 Автопарк</option>
            <option value="skin">👔 Форма</option>
          </select>
        </div>
        <div>
          <label class="flab">Раздел *</label>
          <select class="sel" id="fSection">
            <option value="gov">Основной автопарк фракции</option>
            <option value="mp">Автопарк для мероприятий</option>
          </select>
        </div>
      </div>

      <div>
        <label class="flab">Ведомство / Фракция *</label>
        <select class="sel" id="fFac"></select>
      </div>

      <div>
        <label class="flab">Название модели / формы *</label>
        <input class="inp" id="fTitle" placeholder="Например: Skoda Octavia ДПС">
      </div>

      <div id="speedFieldWrap">
        <label class="flab">Максимальная скорость</label>
        <input class="inp" id="fSpeed" placeholder="Например: 240 км/ч">
      </div>

      <div>
        <label class="flab">Описание / ранг доступа</label>
        <input class="inp" id="fDesc" placeholder="Например: Спецбатальон ДПС · С 6 ранга">
      </div>

      <div>
        <label class="flab">Фотография</label>
        <div class="up-zone" onclick="document.getElementById('fFileInp').click()">
          <div style="font-weight:800;color:#7cc4ff;font-size:12.5px">📷 Загрузить фото с компьютера</div>
          <input type="file" id="fFileInp" accept="image/*" style="display:none" onchange="onFilePicked(this)">
          <img id="fPrev" class="up-prev" alt="Превью">
        </div>
        <input class="inp" id="fImgUrl" style="margin-top:7px" placeholder="Или прямая ссылка на фото (https://...)" oninput="onUrlInput(this.value)">
      </div>
    </div>
    <div class="m-foot">
      <button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="saveCatalogItem()">Сохранить</button>
    </div>
  </div>
</div>

<div id="lb" onclick="this.style.display='none'"><img id="lbImg" src="" alt=""></div>
<div id="troot"></div>

<script>
var STORAGE_KEY = 'mta_garage_catalog_v9';
var CATALOG_TYPE = 'car';
var SECTION = 'gov';
var CUR_FAC = 'all';
var EDIT_ID = null;
var TEMP_IMG = '';
var isOwner = false;

function checkOwnerAuth() {
  try {
    var k = localStorage.getItem('idea_admin_key');
    isOwner = !!(k && String(k).trim().length > 5);
  } catch (e) { isOwner = false; }
  document.body.classList.toggle('adm', isOwner);
  var ab = document.getElementById('btnAddMain');
  if (ab) ab.style.display = isOwner ? 'inline-block' : 'none';
}
window.addEventListener('storage', checkOwnerAuth);

var FACS_GOV = [
  { k: 'all',   n: 'Все разделы', ic: '⚪' },
  { k: 'uvd',   n: 'УМВД',        ic: '🔵' },
  { k: 'gibdd', n: 'ОГИБДД',      ic: '🔵' },
  { k: 'mz',    n: 'ЦГБ/ОКБ',     ic: '🔴' },
  { k: 'mo',    n: 'ВС РФ',       ic: '🟢' },
  { k: 'rzd',   n: 'РЖД',         ic: '🟠' }
];

var FACS_MP = [
  { k: 'all',   n: 'Все разделы', ic: '⚪' },
  { k: 'fsb',   n: 'ФСБ',         ic: '🦅' },
  { k: 'sk',    n: 'СК РФ',       ic: '⚖️' },
  { k: 'mchs',  n: 'МЧС',         ic: '🚒' },
  { k: 'fso',   n: 'ФСО',         ic: '🕶️' }
];

function facNameByKey(k) {
  var all = FACS_GOV.concat(FACS_MP);
  for (var i = 0; i < all.length; i++) if (all[i].k === k) return all[i].n;
  return 'Фракция';
}

var DEFAULT_ITEMS = [
  { id: 'c1', kind: 'car', section: 'gov', fac: 'uvd', title: 'Lada Vesta ППС', desc: 'УМВД · Патрульный автомобиль', speed: '195 км/ч', img: '' },
  { id: 'c2', kind: 'car', section: 'gov', fac: 'uvd', title: 'УАЗ Патриот ППС', desc: 'УМВД · Внедорожник дежурной части', speed: '175 км/ч', img: '' },
  { id: 'c3', kind: 'car', section: 'gov', fac: 'gibdd', title: 'Lada Vesta Sport ДПС', desc: 'ОГИБДД · Базовый экипаж ДПС', speed: '215 км/ч', img: '' },
  { id: 'c4', kind: 'car', section: 'gov', fac: 'gibdd', title: 'BMW M5 F90 ДПС', desc: 'ОГИБДД г. Приволжск · Перехватчик', speed: '305 км/ч', img: '' },
  { id: 'c5', kind: 'car', section: 'gov', fac: 'mz', title: 'ГАЗель Next СМП', desc: 'ЦГБ / ОКБ · Скорая медицинская помощь', speed: '165 км/ч', img: '' },
  { id: 'c6', kind: 'car', section: 'mp',  fac: 'fsb', title: 'Mercedes-Benz V300d ЦСН ФСБ', desc: 'Автопарк для мероприятий · ФСБ', speed: '220 км/ч', img: '' },
  { id: 'c7', kind: 'car', section: 'mp',  fac: 'fso', title: 'Aurus Senat ФСО России', desc: 'Автопарк для мероприятий · ФСО', speed: '250 км/ч', img: '' },

  { id: 's1', kind: 'skin', section: 'gov', fac: 'uvd', title: 'Повседневная форма ППС', desc: 'УМВД · Тёмно-синий китель', speed: '', img: '' },
  { id: 's2', kind: 'skin', section: 'gov', fac: 'gibdd', title: 'Форма инспектора ДПС', desc: 'ОГИБДД · Экипировка ДПС', speed: '', img: '' },
  { id: 's3', kind: 'skin', section: 'mp',  fac: 'fsb', title: 'Штурмовой скин ЦСН ФСБ', desc: 'Мероприятия · Спецназ ФСБ', speed: '', img: '' }
];

var CATALOG = [];

function loadCatalog() {
  try {
    var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (Array.isArray(raw) && raw.length) { CATALOG = raw; return; }
  } catch (e) {}
  CATALOG = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
}

function saveCatalog() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CATALOG)); } catch (e) {}
}

function toast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('troot').appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

window.setCatalogType = function(type) {
  CATALOG_TYPE = type;
  document.getElementById('btnModeCar').classList.toggle('on', type === 'car');
  document.getElementById('btnModeSkin').classList.toggle('on', type === 'skin');
  var btnAdd = document.getElementById('btnAddMain');
  if (btnAdd) btnAdd.textContent = (type === 'car') ? '+ Добавить машину' : '+ Добавить форму';
  renderGrid();
};

window.setSection = function(sec) {
  SECTION = sec;
  CUR_FAC = 'all';
  document.getElementById('secGov').classList.toggle('on', sec === 'gov');
  document.getElementById('secMp').classList.toggle('on', sec === 'mp');
  document.getElementById('subTitleText').textContent = (sec === 'gov') ? 'Основной автопарк фракции' : 'Автопарк для мероприятий';
  renderFacBar();
  renderGrid();
};

window.setFac = function(k) {
  CUR_FAC = k;
  renderFacBar();
  renderGrid();
};

function renderFacBar() {
  var list = (SECTION === 'gov') ? FACS_GOV : FACS_MP;
  document.getElementById('facBar').innerHTML = list.map(function(f) {
    var cnt = CATALOG.filter(function(x) {
      if (x.section !== SECTION || x.kind !== CATALOG_TYPE) return false;
      if (f.k !== 'all' && x.fac !== f.k) return false;
      return true;
    }).length;
    return '<div class="f-chip' + (CUR_FAC === f.k ? ' on' : '') + '" onclick="setFac(\'' + f.k + '\')">' +
      '<span>' + f.ic + '</span><span>' + esc(f.n) + '</span>' +
      (f.k !== 'all' ? '<span class="fc-cnt">' + cnt + '</span>' : '') +
    '</div>';
  }).join('');
}

function renderGrid() {
  checkOwnerAuth();
  var totalAll = CATALOG.filter(function(x) {
    if (x.section !== SECTION || x.kind !== CATALOG_TYPE) return false;
    return true;
  }).length;

  var govCnt = CATALOG.filter(function(x) { return x.section === 'gov'; }).length;
  var mpCnt = CATALOG.filter(function(x) { return x.section === 'mp'; }).length;

  document.getElementById('totalCount').textContent = totalAll;
  document.getElementById('cntGov').textContent = govCnt;
  document.getElementById('cntMp').textContent = mpCnt;

  var q = (document.getElementById('qInp').value || '').trim().toLowerCase();
  var list = CATALOG.filter(function(x) {
    if (x.section !== SECTION || x.kind !== CATALOG_TYPE) return false;
    if (CUR_FAC !== 'all' && x.fac !== CUR_FAC) return false;
    if (q && ((x.title || '') + ' ' + (x.desc || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });

  if (!list.length) {
    document.getElementById('cardsGrid').innerHTML = '<div class="empty">В этом разделе пока нет элементов</div>';
    return;
  }

  document.getElementById('cardsGrid').innerHTML = list.map(function(it) {
    var isSkin = (CATALOG_TYPE === 'skin');
    var fName = facNameByKey(it.fac);
    var imgBlock = it.img
      ? '<img src="' + esc(it.img) + '" alt="' + esc(it.title) + '" onclick="openLb(\'' + esc(it.img) + '\')">'
      : '<div class="vph" onclick="if(isOwner)openModal(\'' + esc(it.id) + '\')"><span>' + (isSkin ? '👔' : '🚓') + '</span><div>' + (isOwner ? 'Нажмите для фото' : 'Нет фото') + '</div></div>';

    return '<div class="vcard' + (isSkin ? ' skin' : '') + '">' +
      '<div class="vimg">' +
        '<div class="vbadges">' +
          '<span class="vtag">' + esc(fName) + '</span>' +
          (!isSkin && it.speed ? '<span class="vtag speed">⚡ ' + esc(it.speed) + '</span>' : '') +
        '</div>' +
        imgBlock +
      '</div>' +
      '<div class="vbody">' +
        '<div class="vtitle">' + esc(it.title) + '</div>' +
        (it.desc ? '<div class="vsub">' + esc(it.desc) + '</div>' : '') +
      '</div>' +
      '<div class="vtools">' +
        '<button class="vbtn" onclick="openModal(\'' + esc(it.id) + '\')">✏️ Изменить</button>' +
        '<button class="vbtn del" onclick="delItem(\'' + esc(it.id) + '\')">✕</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

window.openLb = function(url) {
  if (!url) return;
  document.getElementById('lbImg').src = url;
  document.getElementById('lb').style.display = 'flex';
};

window.syncModalFields = function() {
  var k = document.getElementById('fKind').value;
  document.getElementById('speedFieldWrap').style.display = (k === 'car') ? 'block' : 'none';
};

window.openModal = function(id) {
  if (!isOwner) return;
  EDIT_ID = id || null;
  var facSel = document.getElementById('fFac');
  var allFacs = FACS_GOV.slice(1).concat(FACS_MP);
  facSel.innerHTML = allFacs.map(function(f) {
    return '<option value="' + f.k + '">' + f.ic + ' ' + esc(f.n) + '</option>';
  }).join('');

  var prev = document.getElementById('fPrev');
  document.getElementById('fFileInp').value = '';

  if (EDIT_ID) {
    var it = CATALOG.filter(function(x) { return x.id === EDIT_ID; })[0];
    if (!it) return;
    document.getElementById('mTitle').textContent = 'Редактировать карточку';
    document.getElementById('fKind').value = it.kind;
    document.getElementById('fSection').value = it.section || 'gov';
    document.getElementById('fFac').value = it.fac;
    document.getElementById('fTitle').value = it.title || '';
    document.getElementById('fSpeed').value = it.speed || '';
    document.getElementById('fDesc').value = it.desc || '';
    TEMP_IMG = it.img || '';
    document.getElementById('fImgUrl').value = (TEMP_IMG.indexOf('data:') === 0) ? '' : TEMP_IMG;
    if (TEMP_IMG) { prev.src = TEMP_IMG; prev.style.display = 'block'; }
    else { prev.style.display = 'none'; }
  } else {
    document.getElementById('mTitle').textContent = (CATALOG_TYPE === 'car') ? '+ Добавить машину' : 'Добавить форму';
    document.getElementById('fKind').value = CATALOG_TYPE;
    document.getElementById('fSection').value = SECTION;
    document.getElementById('fFac').value = (CUR_FAC !== 'all') ? CUR_FAC : 'uvd';
    document.getElementById('fTitle').value = '';
    document.getElementById('fSpeed').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fImgUrl').value = '';
    TEMP_IMG = '';
    prev.style.display = 'none';
  }
  syncModalFields();
  document.getElementById('mBack').style.display = 'flex';
};

window.closeModal = function() {
  document.getElementById('mBack').style.display = 'none';
};

window.onFilePicked = function(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var maxW = 900, maxH = 650, w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        var r = Math.min(maxW / w, maxH / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      TEMP_IMG = cv.toDataURL('image/jpeg', 0.85);
      var prev = document.getElementById('fPrev');
      prev.src = TEMP_IMG;
      prev.style.display = 'block';
      toast('✓ Фотография загружена');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.onUrlInput = function(val) {
  var u = (val || '').trim();
  if (!u) return;
  TEMP_IMG = u;
  var prev = document.getElementById('fPrev');
  prev.src = u;
  prev.style.display = 'block';
};

window.saveCatalogItem = function() {
  var kind = document.getElementById('fKind').value;
  var section = document.getElementById('fSection').value;
  var fac  = document.getElementById('fFac').value;
  var title = (document.getElementById('fTitle').value || '').trim();
  var speed = (kind === 'car') ? (document.getElementById('fSpeed').value || '').trim() : '';
  var desc = (document.getElementById('fDesc').value || '').trim();

  if (!title) { toast('Введите название'); return; }

  if (EDIT_ID) {
    CATALOG.forEach(function(x) {
      if (x.id === EDIT_ID) {
        x.kind = kind; x.section = section; x.fac = fac; x.title = title;
        x.speed = speed; x.desc = desc; x.img = TEMP_IMG;
      }
    });
    toast('✓ Изменения сохранены');
  } else {
    CATALOG.unshift({
      id: 'g_' + Date.now(),
      kind: kind, section: section, fac: fac, title: title,
      speed: speed, desc: desc, img: TEMP_IMG
    });
    SECTION = section;
    CATALOG_TYPE = kind;
    toast('✓ Карточка добавлена');
  }
  saveData();
  closeModal();
  setSection(SECTION);
  setCatalogType(CATALOG_TYPE);
};

window.delItem = function(id) {
  if (!isOwner) return;
  CATALOG = CATALOG.filter(function(x) { return x.id !== id; });
  saveData();
  renderFacBar();
  renderGrid();
};

loadCatalog();
renderFacBar();
renderGrid();
</script>
</body>
</html>
