<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>МВД · Автопарк и форма</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
:root{--bg:#0e1116;--bg2:#131820;--card:#191f28;--line:#27303d;--txt:#e9edf4;--mut:#8b95a7;--acc:#4da3ff;--green:#2fd97a;--yellow:#f7c948;--red:#ff5c5c}
html{color-scheme:dark}
body{background:radial-gradient(1100px 520px at 8% -10%,rgba(45,100,170,.17),transparent 60%),radial-gradient(900px 520px at 115% 115%,rgba(130,90,220,.11),transparent 55%),#0e1116;color:var(--txt);font-family:Inter,system-ui,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3342;border-radius:8px;border:2px solid #131820}
::-webkit-scrollbar-thumb:hover{background:#3a4656}
#errbox{display:none;position:fixed;left:12px;top:12px;z-index:990;background:#3a1414;border:1px solid #a34444;color:#ffb3b3;padding:12px 16px;border-radius:10px;font:12px/1.5 monospace;max-width:85%;white-space:pre-wrap}
button{touch-action:manipulation}
#content{padding:22px;max-width:1440px;width:100%;margin:0 auto;animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:2px}
h1{font-size:23px;font-weight:800;letter-spacing:-.3px}
.cnt{font-size:12px;background:#22304a;border:1px solid #32456a;color:#a9c7ef;padding:2px 10px;border-radius:12px;vertical-align:middle;margin-left:8px}
.ph-sub{color:var(--mut);font-size:12.5px;margin-top:5px}
.ph-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:2px}
.owner-only{display:none!important}
body.is-owner .owner-only{display:inline-flex!important}
.sync-pill{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#141a23;color:var(--mut);align-items:center;gap:6px}
.sync-pill.ok{color:#6ee7b7;border-color:rgba(47,217,122,.35);background:rgba(47,217,122,.08)}
.sync-pill.busy{color:#fcd34d;border-color:rgba(247,201,72,.4);background:rgba(247,201,72,.1)}
.sync-pill.err{color:#fca5a5;border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.1)}
.tabs{display:flex;gap:5px;background:#141a23;border:1px solid var(--line);border-radius:13px;padding:5px}
.tab{padding:9px 18px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.on{color:#fff;background:linear-gradient(90deg,rgba(77,163,255,.26),rgba(77,163,255,.07));border-color:rgba(77,163,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.btn{background:linear-gradient(145deg,#3684e6,#2868c9);border:1px solid #3a6cb4;color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .18s;box-shadow:0 4px 14px rgba(40,100,190,.25);align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.big{padding:12px 20px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:#3a4757;filter:none}
.btn.slim{padding:7px 13px;font-size:11.5px}
.btn.warn{background:linear-gradient(145deg,#a03c3c,#7c2a2a);border-color:#a34444;box-shadow:0 4px 14px rgba(160,60,60,.25)}
.cats{display:flex;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:13px;border:1px solid var(--line);background:linear-gradient(145deg,#1c2432,#181e28);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--mut);font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.cat:hover{border-color:#3a4757;color:var(--txt);transform:translateY(-1px)}
.cat:active{transform:scale(.98)}
.cat.on{border-color:rgba(77,163,255,.5);background:linear-gradient(90deg,rgba(77,163,255,.2),rgba(77,163,255,.05));color:#fff;box-shadow:0 4px 18px rgba(40,100,190,.22)}
.cat-ic{font-size:15px}
.cn{margin-left:4px;background:#232e3d;border:1px solid #32405a;padding:1px 8px;border-radius:10px;font-size:10.5px;color:#aeb9cc;font-style:normal;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;user-select:none;transition:all .18s}
.chip:hover{border-color:var(--cc,var(--acc));color:var(--txt)}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--cc,var(--acc));color:#fff;background:var(--ccb,rgba(77,163,255,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;box-shadow:0 0 8px 1px var(--cc,transparent);transition:box-shadow .25s}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.inp,.sel{background:#141a23;border:1px solid var(--line);color:var(--txt);padding:10px 13px;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,163,255,.14)}
.sel option,.sel optgroup{background:#141a23;color:var(--txt)}
textarea.inp{resize:vertical}
.vgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:14px}
.vgrid.grouped{display:block}
.vcard{background:linear-gradient(145deg,#1c2432,#181e28);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s,opacity .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);user-select:none}
.vcard:hover{border-color:#3a4757;transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.vcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--dc,#4da3ff);z-index:3}
.vph{position:relative;aspect-ratio:16/10;background:#141a23;cursor:pointer;overflow:hidden}
.vph.empty{background:#12161e}
.vph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;-webkit-user-drag:none;user-select:none}
.vph-empty{position:absolute;inset:10px;border:1px dashed #2c3644;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#5b6675;transition:all .2s;text-align:center;padding:6px}
.vph-empty .pe-ic{font-size:25px;opacity:.7}
.vph-empty b{color:#8b95a7;font-size:12px;font-weight:700}
.vph-empty span{font-size:10px}
.vph:hover .vph-empty{border-color:rgba(77,163,255,.5);color:var(--acc)}
.vph:hover .vph-empty b{color:#cfe4ff}
.vph-empty.plain{border-style:solid;border-color:#20262f;cursor:default}
.vph-empty.plain:hover{border-color:#20262f;color:#5b6675}
.vdep{position:absolute;left:8px;top:11px;padding:3px 9px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.5px;border:1px solid;background:rgba(14,17,22,.72);backdrop-filter:blur(4px);pointer-events:none}
.vph-tools{position:absolute;top:11px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .2s;z-index:4}
.vcard:hover .vph-tools{opacity:1}
@media(hover:none){.vph-tools{opacity:1}.vcard:hover{transform:none}}
.vtool{width:28px;height:28px;border-radius:9px;background:rgba(14,17,22,.85);border:1px solid #2e3846;color:#c9d3e3;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.vtool:hover{border-color:var(--acc);color:#fff}
.vtool.vtool-del:hover{border-color:var(--red);color:#ffb3b3}
.vbody{padding:12px 14px 14px}
.vname{font-weight:800;font-size:13.5px;line-height:1.35;min-height:18px;border-radius:6px;padding:1px 3px;margin-left:-3px}
.vdesc{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5;min-height:17px;border-radius:6px;padding:1px 3px;margin-left:-3px}
.vsp{display:flex;align-items:baseline;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed #232b37}
.vsp .l{color:#5b6675;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;font-size:9px}
.vsp b{margin-left:auto;font-size:14px;font-weight:800;color:var(--dc,#6cc0ff);min-width:14px;text-align:right;border-radius:6px;padding:1px 3px}
.vsp i{font-style:normal;color:var(--mut);font-size:10px;font-weight:700}
[contenteditable]{outline:none;user-select:text}
[contenteditable]:focus{background:#141a23;box-shadow:0 0 0 3px rgba(77,163,255,.14)}
[contenteditable]:empty::before{content:attr(data-ph);color:#4a5462}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px;margin-top:10px}
.gsec{margin:0 0 24px;border-radius:14px;padding:10px}
.ghead{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;margin-bottom:11px}
.ghead .gd{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.ghead .gname{white-space:nowrap}
.ghead .gline{flex:1;height:1px;background:linear-gradient(90deg,#27303d,transparent)}
.ggrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.gempty{min-height:64px;display:flex;align-items:center;justify-content:center;border:1px dashed #232b37;border-radius:12px;color:#5b6675;font-size:12px}
.clsgrid{display:flex;flex-direction:column;gap:8px}
.clsbtn{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(145deg,#1c2432,#181e28);color:var(--txt);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;text-align:left}
.clsbtn:hover{border-color:var(--cc,var(--acc));transform:translateX(3px)}
.clsbtn.on{border-color:var(--cc,var(--acc));background:var(--ccb,rgba(77,163,255,.14));box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.vcard.sk{pointer-events:none;cursor:default}
.vcard.sk::before{display:none}
.skph{aspect-ratio:16/10;background:#161c26;position:relative;overflow:hidden}
.skph::after,.skb::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.05) 50%,transparent 75%);transform:translateX(-100%);animation:skmove 1.4s infinite}
@keyframes skmove{to{transform:translateX(100%)}}
.skb{height:11px;border-radius:6px;background:#161c26;margin:10px 14px 0;position:relative;overflow:hidden}
.skb:last-child{margin-bottom:14px}
#lb{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out;opacity:0;transition:opacity .28s ease;pointer-events:none}
#lb::before{content:'';position:absolute;inset:0;background:rgba(4,7,11,.88);backdrop-filter:blur(9px);opacity:0;transition:opacity .28s ease}
#lb.show{opacity:1;pointer-events:auto}
#lb.show::before{opacity:1}
#lb img{position:relative;max-width:min(1600px,96vw);max-height:91vh;border-radius:14px;border:1px solid #2e3846;box-shadow:0 30px 90px rgba(0,0,0,.7);transform:scale(.88) translateY(12px);opacity:0;transition:transform .34s cubic-bezier(.22,.9,.3,1),opacity .22s ease;cursor:zoom-out;will-change:transform,opacity}
#lb.zoom img{transform:none;opacity:1}
.lb-cap{position:absolute;top:20px;left:24px;font-weight:800;font-size:14px;color:#e9edf4;background:rgba(14,17,22,.72);border:1px solid #2e3846;padding:9px 15px;border-radius:12px;backdrop-filter:blur(6px);max-width:70vw}
.lb-cap span{display:block;font-weight:600;font-size:11px;color:var(--mut);margin-top:3px}
.lbdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.back{position:fixed;inset:0;background:rgba(4,7,11,.75);backdrop-filter:blur(7px);z-index:400;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:34px 14px}
#croot .back{z-index:420}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.modal{width:100%;max-width:820px;background:#161c25;border:1px solid #2b3442;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:up .25s;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 70px)}
.modal.smw{max-width:430px}
.m-head{flex:0 0 auto;padding:22px 24px 16px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,rgba(77,163,255,.08),transparent)}
.m-close{position:absolute;top:14px;right:14px;background:#1d2531;border:1px solid var(--line);color:var(--mut);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:13px;transition:all .15s;font-family:inherit}
.m-close:hover{color:var(--txt);border-color:#3a4757}
.mh-nm{font-size:19px;font-weight:800;letter-spacing:.4px;padding-right:36px}
.mh-sub{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.5;padding-right:36px}
.m-body{flex:1 1 auto;overflow-y:auto;min-height:100px;padding:18px 24px}
.m-foot{flex:0 0 auto;padding:13px 24px;border-top:1px solid var(--line);background:#141a24;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.flab{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:800;margin:0 0 6px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formgrid .full{grid-column:1/-1}
.aph{aspect-ratio:16/8;border:1px dashed #2c3644;border-radius:12px;background:#141a23;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;overflow:hidden;position:relative}
.aph:hover{border-color:rgba(77,163,255,.55)}
.aph-in{display:flex;flex-direction:column;align-items:center;gap:5px;color:#5b6675;text-align:center;padding:6px}
.aph-in .aph-ic{font-size:26px;opacity:.75}
.aph-in b{color:#8b95a7;font-size:12.5px}
.aph-in span{font-size:10.5px}
.aph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.hint{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:10px;background:#141a23;border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.deplist-head{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--mut);font-weight:800;margin:14px 0 6px}
.deplist-head:first-child{margin-top:0}
.deprow{display:flex;align-items:center;gap:8px;padding:5px 0}
.deprow .ddot{width:10px;height:10px;flex:0 0 10px;border-radius:50%;box-shadow:0 0 8px 1px rgba(0,0,0,.3)}
.deprow .dep-name{flex:1;min-width:0;padding:8px 10px;font-size:13px}
.deprow .dep-color{width:34px;height:34px;flex:0 0 34px;padding:2px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#141a23}
.deprow .dep-del{width:34px;height:34px;flex:0 0 34px;padding:0;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.deprow .dep-del:hover{background:linear-gradient(145deg,#c04646,#8f2f2f)}
.deprow .dep-cls-btn{flex:0 0 auto;padding:8px 10px;font-size:11.5px;white-space:nowrap}
.newdep{border-top:1px dashed #232b37;padding-top:14px;margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.newdep .inp{flex:1 1 160px;min-width:0}
.newdep .sel{flex:0 0 auto;padding:8px 10px}
.newdep .btn{flex:0 0 auto}

#troot{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:700;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c2531;border:1px solid #32435c;border-left:3px solid var(--acc);padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:up .3s;max-width:360px;transition:opacity .35s,transform .35s}
.toast.warn{border-left-color:var(--red)}
.toast.out{opacity:0;transform:translateY(8px)}
@media(max-width:1150px){.vgrid,.ggrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:920px){.vgrid,.ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){
body{font-size:13.5px}
#content{padding:14px 12px 40px}
.ph{flex-direction:column;gap:12px}
h1{font-size:20px}
.ph-sub{font-size:11.5px}
.ph-actions{width:100%;display:grid;grid-template-columns:1fr;gap:10px}
.tabs{padding:4px}
.tab{flex:1;padding:11px 6px;font-size:12px;text-align:center}
.btn.big{width:100%;padding:14px}
.cats{gap:8px;margin:12px 0 10px}
.cat{flex:1 1 100%;padding:14px 16px;font-size:13px;justify-content:center}
.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:10px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap}
.ctl .inp{width:100%}
.vgrid,.ggrid{grid-template-columns:repeat(2,1fr);gap:10px}
.gsec{padding:6px;margin-bottom:16px}
.ghead{gap:7px;font-size:10px}
.vcard{border-radius:14px}
.vph{aspect-ratio:16/11}
.vph-empty{inset:8px}
.vph-empty span{display:none}
.vph-empty b{font-size:11px}
.vdep{font-size:9px;padding:2px 7px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vph-tools{flex-wrap:wrap;max-width:66px;gap:4px}
.vtool{width:31px;height:31px;font-size:12px}
.vbody{padding:9px 10px 11px}
.vname{font-size:12.5px}
.vdesc{font-size:10.5px;line-height:1.45}
.vsp b{font-size:12.5px}
.vsp{margin-top:8px;padding-top:7px}
.gempty{min-height:52px;font-size:11px}
.back{padding:10px;align-items:stretch}
.modal{max-height:calc(100vh - 20px);border-radius:16px}
.m-head{padding:16px 16px 12px}
.mh-nm{font-size:16px}
.m-body{padding:14px 16px}
.m-foot{padding:12px 16px}
.m-foot .btn{flex:1;padding:13px}
.formgrid{grid-template-columns:1fr}
.deprow .dep-name{font-size:12.5px}
.deprow .dep-color{width:32px;height:32px;flex-basis:32px}
.deprow .dep-del{width:32px;height:32px;flex-basis:32px}
.deprow .dep-cls-btn{padding:6px 8px;font-size:10.5px}
#lb{padding:6px}
#lb img{max-width:calc(100vw - 12px);max-height:88vh;border-radius:10px}
.lb-cap{top:12px;left:12px;right:12px;max-width:none;font-size:12px;padding:8px 12px;border-radius:10px}
#troot{right:10px;left:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.toast{max-width:none}
}
@media(max-width:360px){.vgrid,.ggrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="errbox"></div>
<script>
window.addEventListener('error',function(ev){
 if(!(ev instanceof ErrorEvent)){return}
 if(!ev.message){return}
 var b=document.getElementById('errbox');
 if(b){
  b.style.display='block';
  b.textContent='Ошибка: '+ev.message+(ev.filename?'\n'+ev.filename+':'+(ev.lineno||0):'');
 }
},true);
</script>

<main id="content">
  <div class="ph">
    <div>
      <h1><span id="hTitle">Автопарк</span><span class="cnt" id="cnt">0</span></h1>
      <div class="ph-sub" id="hSub"></div>
    </div>
    <div class="ph-actions">
      <span class="sync-pill owner-only" id="syncPill">✓ Сохранено</span>
      <button class="btn ghost slim owner-only" id="depsBtn" style="display:none" onclick="openDepsManager()" title="Управление разделами и классами">⚙️ Разделы</button>
      <div class="tabs">
        <button class="tab on" data-kind="cars" onclick="setKind('cars')">🚔 Автопарк</button>
        <button class="tab" data-kind="form" onclick="setKind('form')">🎽 Форма</button>
      </div>

/* ===================== АВТООПРЕДЕЛЕНИЕ РЕПОЗИТОРИЯ ===================== */
var REPO=(function(){
 var h=location.hostname,p=location.pathname;
 if(!/\.github\.io$/.test(h)){return null}
 var owner=h.replace(/\.github\.io$/,'');
 var seg=p.split('/').filter(Boolean);
 return owner+'/'+(seg.length?seg[0]:(owner+'.github.io'));
})();
var BRANCH='main';

/* ===================== БЕЗОПАСНОЕ ХРАНИЛИЩЕ + БЕЗЛИМИТНАЯ INDEXEDDB =====================
   В localStorage хранятся только лёгкие флаги (ключ, список удалённых ID и номер ревизии).
   Весь массив из 100+ машин с фотографиями хранится в IndexedDB (лимит > 500 МБ),
   поэтому при обновлении страницы сразу загружается весь список без скачка 11 -> 107! */
var LS=(function(){
 var mem={},ok=false;
 try{
  var t='__ls_test__';
  window.localStorage.setItem(t,'1');
  window.localStorage.removeItem(t);
  ok=true;
 }catch(e){ok=false}
 return {
  get:function(k){
   if(ok){try{return window.localStorage.getItem(k)}catch(e){}}
   return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;
  },
  set:function(k,v){
   v=String(v);
   if(ok){try{window.localStorage.setItem(k,v);return}catch(e){}}
   mem[k]=v;
  },
  remove:function(k){
   if(ok){try{window.localStorage.removeItem(k);return}catch(e){}}
   delete mem[k];
  }
 };
})();

/* Очищаем переполненные старые ключи localStorage из прошлых версий (те самые 11 застрявших машин) */
try{
 LS.remove('mvd_garage_local');
 LS.remove('mvd_garage_cache');
 LS.remove('mvd_garage_admin_key');
}catch(e){}

var IDB_NAME='mta_garage_full_db_v1';
var IDB_STORE='snapshots';
var IDB_KEY='current_state';

function idbOpen(){
 return new Promise(function(resolve,reject){
  if(!window.indexedDB){reject(new Error('no idb'));return}
  var req=window.indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=function(ev){
   var db=ev.target.result;
   if(!db.objectStoreNames.contains(IDB_STORE)){
    db.createObjectStore(IDB_STORE);
   }
  };
  req.onsuccess=function(ev){resolve(ev.target.result)};
  req.onerror=function(){reject(req.error)};
 });
}
function idbGetState(){
 return idbOpen().then(function(db){
  return new Promise(function(resolve){
   try{
    var tx=db.transaction(IDB_STORE,'readonly');
    var st=tx.objectStore(IDB_STORE);
    var r=st.get(IDB_KEY);
    r.onsuccess=function(){resolve(r.result||null)};
    r.onerror=function(){resolve(null)};
   }catch(e){resolve(null)}
  });
 }).catch(function(){return null});
}
function idbSaveState(payload){
 return idbOpen().then(function(db){
  return new Promise(function(resolve){
   try{
    var tx=db.transaction(IDB_STORE,'readwrite');
    var st=tx.objectStore(IDB_STORE);
    st.put(payload,IDB_KEY);
    tx.oncomplete=function(){resolve(true)};
    tx.onerror=function(){resolve(false)};
   }catch(e){resolve(false)}
  });
 }).catch(function(){return false});
}

/* ===================== РЕЕСТР УДАЛЁННЫХ КАРТОЧЕК =====================
   Чтобы удалённые вами карточки НИКОГДА не возвращались из старого кэша GitHub */

try{

 if(rawDel&&typeof rawDel==='object'){DELETED_IDS=rawDel}

function markDeletedId(id){

/* ===================== УТИЛИТЫ И СОРТИРОВКА ПО АЛФАВИТУ (РУС -> АНГЛ) ===================== */
function $(s){return document.querySelector(s)}
function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function stripQuotaText(str){
 return String(str||'')
  .replace(/\s*\([^)]*(?:осн|уник|баз)[^)]*\)/gi,'')
  .replace(/\s*\[[^\]]*(?:осн|уник|уникал|баз)[^\]]*\]/gi,'')
  .replace(/\s*·?\s*\d+\s*осн\.?\s*\+\s*\d+\s*уник\.?[а-я]*/gi,'')
  .trim();
}

function alphaGroup(name){
 var s=stripQuotaText(name||'').replace(/^[^a-zA-Zа-яА-ЯёЁ0-9]+/,'').trim();
 if(!s)return 2;
 var ch=s.charAt(0);
 if(/[а-яА-ЯёЁ]/.test(ch))return 0;
 if(/[a-zA-Z]/.test(ch))return 1;
 return 2;
}

function compareAlphabetical(a,b){
 var na=stripQuotaText((a&&a.name)||'').trim();
 var nb=stripQuotaText((b&&b.name)||'').trim();
 var ga=alphaGroup(na);
 var gb=alphaGroup(nb);
 if(ga!==gb)return ga-gb;
 if(ga===0){
  return na.localeCompare(nb,'ru',{sensitivity:'base',numeric:true});
 }
 return na.localeCompare(nb,'en',{sensitivity:'base',numeric:true});
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function hex2rgba(h,a){
 var r=parseInt(h.substring(1,3),16);
 var g=parseInt(h.substring(3,5),16);
 var b=parseInt(h.substring(5,7),16);
 return 'rgba('+r+','+g+','+b+','+a+')';
}
function toast(msg,warn){
 var t=document.createElement('div');
 t.className='toast'+(warn?' warn':'');
 t.textContent=msg;
 $('#troot').appendChild(t);
 setTimeout(function(){t.classList.add('out')},3400);
 setTimeout(function(){t.remove()},3900);
}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s)))}

function setSyncStatus(mode,txt){
 var el=$('#syncPill');
 if(!el)return;
 el.className='sync-pill owner-only '+(mode||'ok');
 el.textContent=txt||'✓ Сохранено';
}

function fetchT(url,opts,ms){
 var ctl=null,to=null;
 try{ if(typeof AbortController!=='undefined'){ctl=new AbortController()} }catch(e){ctl=null}
 var o={};
 if(opts){for(var k in opts){if(Object.prototype.hasOwnProperty.call(opts,k)){o[k]=opts[k]}}}
 if(ctl){o.signal=ctl.signal}
 if(ctl){
  to=setTimeout(function(){try{ctl.abort()}catch(e){}},ms||12000);
 }
 return fetch(url,o).then(function(r){
  if(to){clearTimeout(to);to=null}
  return r;
 },function(e){
  if(to){clearTimeout(to);to=null}
  throw e;
 });
}

function defaultClasses(){

}
function cloneClasses(src){
 var out=[];
 if(!src||!src.length){return out}
 for(var i=0;i<src.length;i++){
  var c=src[i];
  if(!c||!c.k){continue}
  out.push({
   k:String(c.k),
   n:stripQuotaText(c.n||c.s||'—'),

  });

var DEFAULT_DEPS=[
 {k:'uvd',  s:'УМВД',        n:'УМВД',                 c:'#4da3ff', cat:'main'},
 {k:'gibdd',s:'ОГИБДД',      n:'ОГИБДД',               c:'#56ccff', cat:'main'},
 {k:'cgb',  s:'ЦГБ/ОКБ',     n:'ЦГБ/ОКБ',              c:'#ff5c5c', cat:'main'},
 {k:'vs',   s:'ВС РФ',       n:'ВС РФ',                c:'#2fd97a', cat:'main'},
 {k:'rzd',  s:'РЖД',         n:'РЖД',                  c:'#ff9a3d', cat:'main'},
 {k:'fsb',  s:'ФСБ',         n:'ФСБ',                  c:'#818cf8', cat:'event'},
 {k:'sk',   s:'СК',          n:'Следственный комитет', c:'#e05c82', cat:'event'},
 {k:'prok', s:'Прокуратура', n:'Прокуратура',          c:'#f7c948', cat:'event'},
 {k:'mchs', s:'МЧС',         n:'МЧС',                  c:'#ff8a52', cat:'event'},
 {k:'fso',  s:'ФСО',         n:'ФСО',                  c:'#c084fc', cat:'event'}
];
function cloneDeps(src){
 var out=[];
 if(!src||!src.length){return out}
 for(var i=0;i<src.length;i++){
  var d=src[i];
  if(!d||!d.k){continue}
  var cat=(d.cat==='event')?'event':'main';
  var classes;
  if(d.classes&&Array.isArray(d.classes)){
   classes=cloneClasses(d.classes);
  }else{
   classes=defaultClassesFor(cat);
  }
  var cleanN=stripQuotaText(d.n||d.s||'—');
  var cleanS=stripQuotaText(d.s||d.n||'—');
  if(cleanS.length>14)cleanS=cleanN;
  out.push({
   k:String(d.k),
   s:cleanS||cleanN||'—',
   n:cleanN||cleanS||'—',
   c:String(d.c||'#4da3ff'),
   cat:cat,
   classes:classes
  });
 }
 return out;
}
var DEPS=cloneDeps(DEFAULT_DEPS);

function findDep(k){
 for(var i=0;i<DEPS.length;i++){if(DEPS[i].k===k){return DEPS[i]}}
 return null;
}
function dep(k){
 var d=findDep(k);
 if(d){return d}
 return {k:k||'_',s:'—',n:'Раздел удалён',c:'#6b7280',cat:'main',classes:[]};
}
function classesOfDep(depKey){
 var d=findDep(depKey);
 if(!d||!d.classes){return []}
 return d.classes;
}
function classNameOf(depKey, clsKey){
 var classes=classesOfDep(depKey);
 for(var i=0;i<classes.length;i++){
  if(classes[i].k===clsKey){return classes[i].n}
 }
 return '—';
}
function clsOf(it){
 if(!it){return null}
 var classes=classesOfDep(it.dep);
 if(!classes.length){return null}
 for(var i=0;i<classes.length;i++){
  if(classes[i].k===it.cls){return it.cls}
 }
 return classes[0].k;
}
function isGrouped(){
 if(state.kind!=='cars'){return false}
 if(state.dep==='all'){return false}
 var d=findDep(state.dep);
 return !!(d&&d.classes&&d.classes.length);
}

var MAIN_KEY_K='idea_admin_key', PENDING_K='mvd_garage_pending';

var OLD_SEED_IDS={
 c1:1,c2:1,c3:1,c4:1,c5:1,c6:1,c7:1,c8:1,c9:1,c10:1,
 c11:1,c12:1,c13:1,c14:1,c15:1,c16:1,c17:1,c18:1,c19:1,c20:1,
 f1:1,f2:1,f3:1,f4:1,f5:1,f6:1,f7:1,f8:1,f9:1,f10:1,f11:1,f12:1,f13:1
};

function sanitizeItemsList(arr){
 if(!arr||!Array.isArray(arr))return [];
 var out=[];
 var seen={};
 for(var i=0;i<arr.length;i++){
  var it=arr[i];
  if(!it||typeof it!=='object')continue;
  if(it.kind!=='cars'&&it.kind!=='form')continue;
  if(OLD_SEED_IDS[it.id]&&!it.photo)continue;
  if(it.id&&DELETED_IDS[it.id])continue;
  if(it.id&&seen[it.id])continue;
  if(it.id)seen[it.id]=1;
  it.name=stripQuotaText(it.name||'');
  it.desc=stripQuotaText(it.desc||'');
  out.push(it);
 }
 out.sort(compareAlphabetical);
 return out;
}

function toArr(x){
 if(!x){return null}
 if(Array.isArray(x)){return x}
 var ks=Object.keys(x).sort(function(a,b){return a-b}),arr=[];
 for(var i=0;i<ks.length;i++){arr[+ks[i]]=x[ks[i]]}
 return arr;
}

function isGaragePayload(obj){
 if(!obj||typeof obj!=='object')return false;
 if(obj.deps&&Array.isArray(obj.deps))return true;
 var a=toArr(obj.items);
 if(!a)return false;
 if(a.length===0)return true;
 for(var i=0;i<a.length;i++){
  if(a[i]&&(a[i].kind==='cars'||a[i].kind==='form'))return true;
  if(a[i]&&a[i].fac&&a[i].title)return false;
 }
 return false;
}

/* ===================== НАДЁЖНАЯ СИНХРОНИЗАЦИЯ С GITHUB ===================== */
var NET_TO_READ=12000;
var NET_TO_WRITE=35000;
var GARAGE_DATA_FILE='garage_data.json';
var GARAGE_REV_FILE='garage_rev.txt';

function rawUrl(file,br){return 'https://raw.githubusercontent.com/'+REPO+'/'+(br||BRANCH)+'/'+file+'?v='+Date.now()}
function rawGet(file,br){
 return fetchT(rawUrl(file,br),{cache:'no-store'},NET_TO_READ).then(function(r){
  if(r.status===404){var e=new Error('404');e.nf=true;throw e}
  if(!r.ok){throw new Error(r.status)}
  return r.text();
 });
}
function apiBlobBySha(sha){
 var h={Accept:'application/vnd.github+json'};
 if(ADMIN_KEY){h.Authorization='token '+ADMIN_KEY}
 return fetchT('https://api.github.com/repos/'+REPO+'/git/blobs/'+sha+'?t='+Date.now(),{headers:h,cache:'no-store'},NET_TO_READ)
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(j){return b64d(String(j.content||'').replace(/\s+/g,''))});
}
function apiFileContent(path){
 var h={Accept:'application/vnd.github+json'};
 if(ADMIN_KEY){h.Authorization='token '+ADMIN_KEY}
 return fetchT('https://api.github.com/repos/'+REPO+'/contents/'+path+'?t='+Date.now(),{headers:h,cache:'no-store'},NET_TO_READ)
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(j){
   if(j&&j.content){return b64d(String(j.content).replace(/\s+/g,''))}
   if(j&&j.sha){return apiBlobBySha(j.sha)}
   throw new Error('empty');
  });
}
function ghHeaders(){return {Authorization:'token '+ADMIN_KEY,Accept:'application/vnd.github+json','Content-Type':'application/json'}}
function ghReq(method,path,body){
 return fetchT('https://api.github.com/repos/'+REPO+'/'+path,{
  method:method,
  headers:ghHeaders(),
  body:body?JSON.stringify(body):undefined
 },NET_TO_WRITE).then(function(r){
  if(!r.ok){throw r.status}
  return r.status===204?null:r.json();
 });
}

var pushTimer=null, pushInFlight=false, dataDirty=false, pushRetries=0;
var lastCommitSha=null, lastTreeSha=null;

function commit(){
 syncGlobalOwnerAuth();
 localRev=(typeof localRev==='number'?localRev:0)+1;
 saveToIndexedDB();
 if(!REPO||!adminMode||!ADMIN_KEY){ return }
 dataDirty=true;
 LS.set(PENDING_K,String(Date.now()));
 setSyncStatus('busy','⏳ Сохранение…');
 if(pushInFlight){ return }
 if(pushTimer){ clearTimeout(pushTimer) }
 pushTimer=setTimeout(doPush,120);
}

function doPush(){
 pushTimer=null;
 syncGlobalOwnerAuth();
 if(!adminMode||!REPO||!ADMIN_KEY||pushInFlight||!dataDirty){ return }
 DEPS=cloneDeps(DEPS);
 ITEMS=sanitizeItemsList(ITEMS);
 var rev=localRev;
 var snapshot=JSON.stringify({
  rev:rev,
  items:ITEMS,
  deps:DEPS,
  deletedIds:DELETED_IDS
 });
 dataDirty=false;
 pushInFlight=true;
 pendingRev=rev;
 setSyncStatus('busy','⏳ Сохранение в GitHub…');

 var dataSha=null;
 ghReq('POST','git/blobs',{content:b64e(snapshot),encoding:'base64'}).then(function(b){
  dataSha=b.sha;
  return ghReq('POST','git/blobs',{content:b64e(rev+':'+b.sha),encoding:'base64'});
 }).then(function(bRev){
  var tree=[
   {path:GARAGE_DATA_FILE,mode:'100644',type:'blob',sha:dataSha},
   {path:GARAGE_REV_FILE,mode:'100644',type:'blob',sha:bRev.sha}
  ];
  var base;
  if(lastCommitSha&&lastTreeSha){
   base=Promise.resolve({c:lastCommitSha,t:lastTreeSha});
  }else{
   base=ghReq('GET','git/refs/heads/'+BRANCH).catch(function(code){
    if(code===404&&BRANCH!=='master'){BRANCH='master';return ghReq('GET','git/refs/heads/master')}
    throw code;
   }).then(function(ref){
    return ghReq('GET','git/commits/'+ref.object.sha).then(function(cm){
     return {c:ref.object.sha,t:cm.tree.sha};
    });
   });
  }
  return base.then(function(b){
   return ghReq('POST','git/trees',{base_tree:b.t,tree:tree}).then(function(nt){
    return ghReq('POST','git/commits',{message:'garage sync: '+rev,tree:nt.sha,parents:[b.c]}).then(function(nc){
     return ghReq('PATCH','git/refs/heads/'+BRANCH,{sha:nc.sha,force:true}).then(function(){
      lastCommitSha=nc.sha;
      lastTreeSha=nt.sha;
     });
    });
   });
  });
 }).then(function(){
  pushInFlight=false;
  pushRetries=0;
  pendingRev=null;
  saveToIndexedDB();
  LS.remove(PENDING_K);
  setSyncStatus('ok','✓ Сохранено в GitHub');
  if(dataDirty){ pushTimer=setTimeout(doPush,150) }
 }).catch(function(code){
  pushInFlight=false;
  pendingRev=null;
  dataDirty=true;
  lastCommitSha=null;
  lastTreeSha=null;
  if(pushRetries<4){
   pushRetries++;
   pushTimer=setTimeout(doPush,800);
  }else{
   setSyncStatus('err','⚠️ Ошибка GitHub ('+code+')');
  }
 });
}

/* Загрузка JSON файла с GitHub (сначала свежий API или raw) */
function fetchRemoteGarageJson(filename){
 return apiFileContent(filename).catch(function(){
  return rawGet(filename);
 }).then(function(txt){
  var j=JSON.parse(txt);
  if(!isGaragePayload(j))throw new Error('not garage');
  if(j.deletedIds&&typeof j.deletedIds==='object'){
   for(var dk in j.deletedIds){if(j.deletedIds[dk])DELETED_IDS[dk]=1}
   try{LS.set(DEL_K,JSON.stringify(DELETED_IDS))}catch(e){}
  }
  return {
   rev:(typeof j.rev==='number'?j.rev:0),
   items:sanitizeItemsList(toArr(j.items)||[]),
   deps:(j.deps&&Array.isArray(j.deps)&&j.deps.length)?cloneDeps(j.deps):null
  };
 });
}

/* ЗАГРУЗКА:
   1. Сразу читаем полный список (все 107+ машин) из безлимитной IndexedDB — он отрисовывается мгновенно без скачка!
   2. Если у владельца есть несохранённые правки (PENDING_K), отправляем их на GitHub, НЕ перезаписывая старым файлом с сервера.
   3. Только если на сервере ревизия новее (или база в браузере пуста при самом первом входе), загружаем список с сервера целиком. */
function initApp(){
 idbGetState().then(function(saved){
  var hasPending=!!LS.get(PENDING_K);
  if(saved&&saved.items&&saved.items.length){
   if(saved.deletedIds&&typeof saved.deletedIds==='object'){
    for(var k in saved.deletedIds){if(saved.deletedIds[k])DELETED_IDS[k]=1}
   }
   if(saved.deps&&saved.deps.length){DEPS=cloneDeps(saved.deps)}
   localRev=(typeof saved.rev==='number'?saved.rev:0);
   ITEMS=sanitizeItemsList(saved.items);
   booted=true;
   render();
  }else{
   showLoadingSkeleton();
  }

  if(!REPO){
   booted=true;
   render();
   return;
  }

  /* Если владелец что-то изменил/удалил и обновил страницу — пушим его актуальное состояние в GitHub */
  if(hasPending&&ITEMS.length&&adminMode&&ADMIN_KEY){
   dataDirty=true;
   doPush();
   return;
  }

  /* Проверяем серверные файлы: выбираем самый актуальный полный набор (БЕЗ склеивания старых удалённых машин!) */
  Promise.all([
   fetchRemoteGarageJson(GARAGE_DATA_FILE).catch(function(){return null}),
   fetchRemoteGarageJson('data.json').catch(function(){return null})
  ]).then(function(res){
   var r1=res[0];
   var r2=res[1];
   var chosen=null;

   /* Если в IndexedDB уже лежит актуальный полный список и его ревизия >= серверной, ничего не перерисовываем */
   if(ITEMS.length>0){
    var bestRemoteRev=Math.max(r1?r1.rev:0, r2?r2.rev:0);
    if(localRev>=bestRemoteRev && ITEMS.length >= Math.max(r1?r1.items.length:0, r2?r2.items.length:0)){
     return;
    }
   }

   /* Если один из файлов содержит полный каталог (например 107 машин в data.json против 11 в старом garage_data.json) — берём полный и сразу синхронизируем */
   if(r1&&r2){
    if(r1.rev>r2.rev && r1.items.length>=r2.items.length){
     chosen=r1;
    }else if(r2.items.length>r1.items.length){
     /* Однократная миграция полного списка из data.json + новых карточек из garage_data.json (с фильтрацией DELETED_IDS) */
     var mergedMap={};
     var mergedArr=[];
     r2.items.concat(r1.items).forEach(function(it){
      if(!it||!it.id||DELETED_IDS[it.id])return;
      if(!mergedMap[it.id]){
       mergedMap[it.id]=it;
       mergedArr.push(it);
      }else{
       var idx=mergedArr.indexOf(mergedMap[it.id]);
       if(idx>=0)mergedArr[idx]=it;
       mergedMap[it.id]=it;
      }
     });
     chosen={
      rev:Math.max(r1.rev,r2.rev)+1,
      items:sanitizeItemsList(mergedArr),
      deps:r1.deps||r2.deps
     };
     if(adminMode&&ADMIN_KEY){dataDirty=true}
    }else{
     chosen=r1;
    }
   }else{
    chosen=r1||r2;
   }

   if(chosen){
    if(chosen.deps&&chosen.deps.length){DEPS=cloneDeps(chosen.deps)}
    localRev=Math.max(localRev,chosen.rev||0);
    ITEMS=sanitizeItemsList(chosen.items);
    saveToIndexedDB();
    booted=true;
    render();
    if(dataDirty&&adminMode&&ADMIN_KEY){doPush()}
   }else if(!booted){
    booted=true;
    render();
   }
  }).catch(function(){
   if(!booted){booted=true;render()}
  });
 });
}

  if(!id){return}
  var it=byId(id);
  if(!it){return}
  if(adminMode){
   bindEdit(card.querySelector('.vname'),it,'name');
   bindEdit(card.querySelector('.vdesc'),it,'desc');
   bindEdit(card.querySelector('.vsp b'),it,'speed');
  }
 });
}

document.addEventListener('dragstart',function(e){
 if(e.target&&(e.target.tagName==='IMG'||e.target.closest('.vcard'))){
  e.preventDefault();
 }
});

/* ===================== МОДАЛКИ: ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ ===================== */
var editingId=null, editPhoto='', formCls=null, photoCb=null;

function closeM(){ var m=$('#mroot'); if(m){m.innerHTML=''} editingId=null; photoCb=null }
function closeC(){ var c=$('#croot'); if(c){c.innerHTML=''} }
window.closeM=closeM;
window.closeC=closeC;

function openAdd(){
 syncGlobalOwnerAuth();
 if(!adminMode){return}
 openForm(null);
}
function openEdit(id){
 syncGlobalOwnerAuth();
 if(!adminMode){return}
 var it=byId(id);
 if(!it){return}

}

window.openEdit=openEdit;

function syncFormDepOptions(preferredDepK){
 var catSel=$('#fCat');
 var depSel=$('#fDep');
 if(!depSel){return}
 var curCat=catSel?catSel.value:state.cat;
 var mainOpts='', eventOpts='';
 var firstMatch='';
 for(var i=0;i<DEPS.length;i++){
  var d=DEPS[i];
  var cleanN=stripQuotaText(d.n);
  var isSel=(preferredDepK&&preferredDepK===d.k);
  if(d.cat===curCat&&!firstMatch){firstMatch=d.k}
  var optHtml='<option value="'+esc(d.k)+'"'+(isSel?' selected':'')+'>'+esc(cleanN)+'</option>';
  if(d.cat==='main'){mainOpts+=optHtml}else{eventOpts+=optHtml}
 }
 depSel.innerHTML=
  '<optgroup label="🏛️ Основные разделы фракций">'+mainOpts+'</optgroup>'+
  '<optgroup label="🎪 Разделы для мероприятий (МП)">'+eventOpts+'</optgroup>';

 if(preferredDepK&&findDep(preferredDepK)){
  depSel.value=preferredDepK;
 }else if(firstMatch){
  depSel.value=firstMatch;
 }
 renderClsPicker(formCls);
}

window.onFormCatChange=function(){
 var catVal=$('#fCat')?$('#fCat').value:'main';
 var firstDep='';
 for(var i=0;i<DEPS.length;i++){
  if(DEPS[i].cat===catVal){firstDep=DEPS[i].k;break}
 }
 syncFormDepOptions(firstDep);
};

window.onFormDepChange=function(){
 var depK=$('#fDep')?$('#fDep').value:'';
 var d=findDep(depK);
 if(d&&$('#fCat')&&$('#fCat').value!==d.cat){
  $('#fCat').value=d.cat;
 }
 renderClsPicker(formCls);
};

function openForm(it){
 editingId=it?it.id:null;
 editPhoto=it?(it.photo||''):'';
 formCls=(it&&it.cls)?it.cls:null;
 var itemKind=it?it.kind:state.kind;
 var isCars=(itemKind==='cars');
 var selCat=it?it.cat:state.cat;
 var selDep=it?it.dep:(state.dep!=='all'?state.dep:null);

 var catOpts=CATS[itemKind].map(function(c){
  return '<option value="'+esc(c.k)+'"'+(selCat===c.k?' selected':'')+'>'+c.ic+' '+esc(c.n)+'</option>';
 }).join('');

 $('#mroot').innerHTML=
 '<div class="back" onclick="if(event.target===this)closeM()"><div class="modal">'+
 '<div class="m-head"><div class="mh-nm">'+(it?'✏️ Редактирование карточки':'＋ '+(isCars?'Новая машина':'Новая форма'))+'</div>'+
 '<div class="mh-sub">Вы можете изменить название, описание, раздел (фракцию), класс и фотографию</div>'+
 '<button class="m-close" onclick="closeM()">✕</button></div>'+
 '<div class="m-body"><div class="formgrid">'+
  '<div class="full"><label class="flab">Название</label><input class="inp" id="fName" style="width:100%" value="'+esc(it?stripQuotaText(it.name):'')+'" placeholder="Например: Лада Веста / Toyota Camry"></div>'+
  '<div class="full"><label class="flab">Описание</label><textarea class="inp" id="fDesc" rows="2" style="width:100%;min-height:44px" placeholder="Краткое описание…">'+esc(it?stripQuotaText(it.desc):'')+'</textarea></div>'+
  '<div><label class="flab">Категория каталога</label><select class="sel" id="fCat" style="width:100%" onchange="onFormCatChange()">'+catOpts+'</select></div>'+
  '<div><label class="flab">Раздел (Фракция / Структура)</label><select class="sel" id="fDep" style="width:100%" onchange="onFormDepChange()"></select></div>'+
  (isCars?'<div class="full"><label class="flab">Скорость, км/ч</label><input class="inp" id="fSpeed" style="width:100%" value="'+esc(it?it.speed:'')+'" placeholder="180"></div>':'')+
  (isCars?'<div class="full"><label class="flab">Класс транспорта</label><div id="fClsBox"></div></div>':'')+
  '<div class="full"><label class="flab">Фотография</label><div class="aph" id="fAph"></div>'+
  '<div class="hint">Фото автоматически сжимается перед сохранением. Нажмите на область, чтобы выбрать файл с компьютера.</div></div>'+
 '</div></div>'+
 '<div class="m-foot"><button class="btn ghost" onclick="closeM()">Отмена</button>'+
 '<button class="btn" onclick="saveForm()">'+(it?'Сохранить изменения':'Добавить')+'</button></div>'+
 '</div></div>';

 syncFormDepOptions(selDep);
 renderAph();

 var a=$('#fAph');
 if(a){
  a.addEventListener('click',function(e){
   if(e.target.closest('.vtool')){return}
   pickPhoto(function(data){ editPhoto=data; renderAph() });
  });
 }
 setTimeout(function(){ var n=$('#fName'); if(n){n.focus()} },60);
}
function renderClsPicker(selK){
 var box=$('#fClsBox');
 if(!box){return}
 var depK=$('#fDep')?$('#fDep').value:'';
 var classes=classesOfDep(depK);
 if(!classes.length){
  box.innerHTML='<div class="hint" style="margin-top:0">В этом разделе нет классов — карточка будет отображаться в общем списке раздела.</div>';
  formCls='';
  return;
 }
 var found=false;
 for(var i=0;i<classes.length;i++){ if(classes[i].k===selK){found=true;break} }
 if(!found){ selK=classes[0].k }
 formCls=selK;
 var h='<div class="clsgrid">';
 for(var j=0;j<classes.length;j++){
  var c=classes[j];
  h+='<button type="button" class="clsbtn'+(c.k===selK?' on':'')+'" style="--cc:'+c.c+';--ccb:'+hex2rgba(c.c,.16)+'" onclick="renderClsPicker(\''+esc(c.k)+'\')">'+
   '<span style="width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:'+c.c+';box-shadow:0 0 8px 1px '+hex2rgba(c.c,.45)+'"></span>'+esc(c.n)+'</button>';
 }
 h+='</div>';
 box.innerHTML=h;
}
window.renderClsPicker=renderClsPicker;

function renderAph(){
 var a=$('#fAph');
 if(!a){return}
 if(editPhoto){
  a.innerHTML='<img src="'+editPhoto+'" alt="" draggable="false">'+
   '<button class="vtool vtool-del" style="position:absolute;top:10px;right:10px;z-index:3" title="Убрать фото" onclick="event.stopPropagation();clearPhoto()">🗑</button>';
 }else{
  a.innerHTML='<div class="aph-in"><div class="aph-ic">📷</div><b>Добавить фото</b><span>нажмите для выбора файла</span></div>';
 }
}
function clearPhoto(){ editPhoto=''; renderAph() }
window.clearPhoto=clearPhoto;

function saveForm(){
 var name=stripQuotaText(($('#fName')?$('#fName').value:'').trim());
 if(!name){toast('Введите название',true);return}
 var depK=$('#fDep')?$('#fDep').value:'';
 if(!depK){toast('Выберите раздел',true);return}
 var targetDep=findDep(depK);
 var catK=targetDep?targetDep.cat:(($('#fCat')?$('#fCat').value:'')||state.cat);

 var it=null;
 if(editingId){ it=byId(editingId) }
 var isNew=!it;
 if(isNew){
  it={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:state.kind,cat:catK,dep:depK,cls:'',name:'',desc:'',speed:'',photo:''};
  ITEMS.push(it);
 }
 it.name=name;
 it.desc=stripQuotaText(($('#fDesc')?$('#fDesc').value:'').trim());
 it.cat=catK;
 it.dep=depK;
 it.cls=(it.kind==='cars')?(formCls||''):'';
 it.speed=($('#fSpeed')?$('#fSpeed').value:'').trim();
 it.photo=editPhoto;
 ITEMS.sort(compareAlphabetical);
 closeM();
 commit();
 render();
 toast(isNew?'Запись добавлена':'Изменения сохранены (раздел: '+(targetDep?targetDep.n:depK)+')');
}
window.saveForm=saveForm;

function delItem(id){
 if(!adminMode){return}
 var it=byId(id);
 if(!it){return}
 if(!window.confirm('Удалить «'+(it.name||'без названия')+'»?')){return}
 markDeletedId(id);
 for(var i=0;i<ITEMS.length;i++){
  if(ITEMS[i].id===id){ ITEMS.splice(i,1); break }
 }
 commit();
 render();
 toast('Запись удалена навсегда');
}
window.delItem=delItem;

 photoCb=cb;

 if(!f){return}
 f.value='';
 f.click();

 pickPhoto(function(data){
  var it=byId(id);
  if(!it){return}
  it.photo=data;
  commit();
  render();
  toast('Фото обновлено');
 });
}

function compressImage(file,cb){
 var reader=new FileReader();
 reader.onload=function(ev){
  var img=new Image();
  img.onload=function(){
   var MAX=1000;
   var w=img.naturalWidth||img.width;
   var h=img.naturalHeight||img.height;
   var k=Math.min(1,MAX/Math.max(w,h));
   var cv=document.createElement('canvas');
   cv.width=Math.max(1,Math.round(w*k));
   cv.height=Math.max(1,Math.round(h*k));
   cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
   var out;
   try{ out=cv.toDataURL('image/jpeg',.82) }catch(e){ out=ev.target.result }
   if(cb){cb(out)}
  };
  img.onerror=function(){
   toast('Не удалось прочитать файл изображения',true);
  };
  img.src=ev.target.result;
 };
 reader.readAsDataURL(file);
}

/* ===================== ЛАЙТБОКС ===================== */
var lbTimer=null;
function openLb(id){
 var it=byId(id);
 if(!it||!it.photo){return}
 var d=dep(it.dep);
 var lb=$('#lb'),img=$('#lbImg'),cap=$('#lbCap');
 if(!lb||!img){return}
 if(lbTimer){clearTimeout(lbTimer);lbTimer=null}
 lb.classList.remove('zoom');
 if(cap){
  cap.innerHTML='<span class="lbdot" style="background:'+d.c+';box-shadow:0 0 8px 1px '+hex2rgba(d.c,.5)+'"></span>'+esc(stripQuotaText(it.name||'—'))+
   (it.desc?'<span>'+esc(stripQuotaText(it.desc))+'</span>':'');
 }
 img.src=it.photo;
 var go=function(){
  lb.classList.add('show');
  requestAnimationFrame(function(){
   requestAnimationFrame(function(){
    if(lb.classList.contains('show')){ lb.classList.add('zoom') }
   });
  });
 };
 var dec=null;
 try{ if(typeof img.decode==='function'){ dec=img.decode() } }catch(e){ dec=null }
 if(dec&&typeof dec.then==='function'){ dec.then(go,go) } else { go() }
}
window.openLb=openLb;

function closeLb(){
 var lb=$('#lb');
 if(!lb||!lb.classList.contains('show')){return}
 lb.classList.remove('zoom');
 lb.classList.remove('show');
 if(lbTimer){clearTimeout(lbTimer)}
 lbTimer=setTimeout(function(){
  var img=$('#lbImg');
  if(img){ img.src='' }
 },380);
}
window.closeLb=closeLb;

/* ===================== ЗАПУСК ===================== */
(function(){
 syncGlobalOwnerAuth();
 renderTop();
 var qi=$('#q');
 if(qi){ qi.addEventListener('input',function(){ state.q=this.value; renderGrid() }) }
 var lb=$('#lb');
 if(lb){ lb.addEventListener('click',closeLb) }
 var fi=$('#fileInp');
 if(fi){
  fi.addEventListener('change',function(){
   var f=this.files&&this.files[0];
   this.value='';
   if(!f||!photoCb){return}
   var cb=photoCb;
   photoCb=null;
   compressImage(f,cb);
  });
 }
 document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeLb(); closeC(); closeM() }
 });
 initApp();
})();
