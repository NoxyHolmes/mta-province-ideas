<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автопарк и форма фракций · MTA Province</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080b11;
  --card:#121824;
  --line:rgba(255,255,255,.08);
  --txt:#f1f5f9;
  --mut:#8c98ad;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
  --purple:#a78bfa;
}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
body{
  background:
    radial-gradient(1100px 520px at 10% -10%,rgba(77,163,255,.14),transparent 60%),
    radial-gradient(1000px 500px at 90% 110%,rgba(167,139,250,.12),transparent 60%),
    #080b11;
  padding:22px 20px 60px;
}
.g-wrap{max-width:1380px;margin:0 auto}

/* Шапка без повторного входа GitHub */
.g-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  background:rgba(18,24,36,.88);
  backdrop-filter:blur(14px);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px 22px;
  margin-bottom:18px;
  box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.g-brand{display:flex;align-items:center;gap:14px}
.g-ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 22px rgba(59,130,246,.35)}
.g-title{font-size:20px;font-weight:900}
.g-sub{font-size:12.5px;color:var(--mut);margin-top:3px}

.type-switch{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.t-btn{
  padding:10px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  color:var(--mut);
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  transition:.18s;
}
.t-btn:hover{border-color:rgba(255,255,255,.2);color:#fff}
.t-btn.on{background:linear-gradient(135deg,#2563eb,#4f46e5);border-color:#93c5fd;color:#fff;box-shadow:0 6px 20px rgba(37,99,235,.32)}

.add-btn{
  padding:10px 18px;
  border-radius:12px;
  border:1px solid rgba(47,217,122,.45);
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  transition:.18s;
  box-shadow:0 6px 18px rgba(16,185,129,.28);
}
.add-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* Фильтры фракций */
.fac-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.f-chip{
  padding:8px 14px;
  border-radius:11px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--mut);
  font-weight:800;
  font-size:12px;
  cursor:pointer;
  transition:.16s;
}
.f-chip:hover{border-color:rgba(255,255,255,.22);color:#fff}
.f-chip.on{background:rgba(77,163,255,.2);border-color:var(--acc);color:#fff}

.search-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.inp,.sel{background:#0f141e;border:1px solid rgba(255,255,255,.12);color:var(--txt);padding:10px 14px;border-radius:12px;font-size:13.5px;font-family:inherit;outline:none;width:100%}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,163,255,.15)}

/* Сетка карточек авто и формы */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.item-card{
  background:linear-gradient(160deg,#161e2e,#101622);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  position:relative;
}
.item-card:hover{transform:translateY(-3px);border-color:rgba(147,197,253,.4);box-shadow:0 16px 38px rgba(0,0,0,.5)}

.ic-media{
  width:100%;
  aspect-ratio:16/10;
  background:radial-gradient(circle at 50% 40%,#1e293b,#0f172a);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer;
}
.item-card.skin-card .ic-media{aspect-ratio:4/4}
.ic-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.item-card:hover .ic-media img{transform:scale(1.04)}
.ic-placeholder{display:flex;flex-direction:column;align-items:center;gap:6px;color:#64748b;font-size:12px;font-weight:700}
.ic-placeholder i{font-style:normal;font-size:38px}

.ic-badges{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.ic-tag{padding:4px 9px;border-radius:8px;font-size:10.5px;font-weight:800;backdrop-filter:blur(8px);background:rgba(10,14,22,.82);border:1px solid rgba(255,255,255,.14);color:#e2e8f0}
.ic-tag.mp{background:rgba(167,139,250,.25);border-color:rgba(167,139,250,.55);color:#ddd6fe}

.ic-body{padding:15px 16px;flex:1;display:flex;flex-direction:column;gap:8px}
.ic-title{font-weight:900;font-size:15.5px;color:#fff;line-height:1.3}
.ic-meta{font-size:12px;color:var(--mut);line-height:1.45}
.ic-meta b{color:#cbd5e1}

.ic-admin-bar{
  display:flex;
  gap:6px;
  padding:10px 16px 14px;
  border-top:1px dashed rgba(255,255,255,.07);
}
.adm-btn{
  flex:1;
  padding:7px 10px;
  border-radius:9px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:#cbd5e1;
  font-size:11.5px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}
.adm-btn:hover{border-color:var(--acc);color:#fff;background:rgba(77,163,255,.15)}
.adm-btn.del:hover{border-color:var(--red);color:#fca5a5;background:rgba(255,92,92,.15)}

/* Модальное окно добавления / редактирования с загрузкой фото */
.m-back{position:fixed;inset:0;z-index:500;background:rgba(4,7,12,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.m-box{width:540px;max-width:96vw;background:#131926;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.75);max-height:90vh;overflow-y:auto}
.m-title{font-size:18px;font-weight:900;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.m-close{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut);width:32px;height:32px;border-radius:9px;cursor:pointer;font-weight:800}
.flab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800;margin:12px 0 6px}

.photo-drop{
  border:2px dashed rgba(96,165,250,.45);
  background:rgba(37,99,235,.07);
  border-radius:14px;
  padding:16px;
  text-align:center;
  cursor:pointer;
  transition:.18s;
}
.photo-drop:hover{border-color:#60a5fa;background:rgba(37,99,235,.14)}
.photo-preview{width:100%;max-height:210px;object-fit:contain;border-radius:10px;margin-top:10px;display:none;border:1px solid var(--line);background:#090d14}

#lb{position:fixed;inset:0;z-index:700;background:rgba(4,7,12,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb img{max-width:92vw;max-height:88vh;border-radius:14px;border:1px solid rgba(255,255,255,.15)}

#troot{position:fixed;right:20px;bottom:20px;z-index:800;display:flex;flex-direction:column;gap:8px}
.toast{background:#182234;border:1px solid rgba(77,163,255,.45);border-left:4px solid var(--acc);padding:12px 16px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.55)}
</style>
</head>
<body>

<div class="g-wrap">
  <div class="g-top">
    <div class="g-brand">
      <div class="g-ic">🚔</div>
      <div>
        <div class="g-title">Обновлённый автопарк и форма фракций</div>
        <div class="g-sub">Каталог служебного транспорта, городской привязки и форменной одежды (включая МП-панель)</div>
      </div>
    </div>

    <div class="type-switch">
      <button class="t-btn on" id="tabCars" onclick="setKind('car')">🚔 Автопарк (<span id="cntCars">0</span>)</button>
      <button class="t-btn" id="tabSkins" onclick="setKind('skin')">👮 Форма и скины (<span id="cntSkins">0</span>)</button>
      <button class="add-btn" id="btnAdd" onclick="openEditModal(null)">＋ Добавить в каталог</button>
    </div>
  </div>

  <div class="fac-chips" id="facChips"></div>

  <div class="search-row">
    <input class="inp" id="qInp" style="max-width:420px" placeholder="🔎 Поиск по названию модели, подразделению или городу..." oninput="renderGrid()">
  </div>

  <div class="cards-grid" id="cardsGrid"></div>
</div>

<!-- Модальное окно добавления / редактирования с безотказной загрузкой фото -->
<div class="m-back" id="editBack" onclick="if(event.target===this)closeEditModal()">
  <div class="m-box">
    <div class="m-title">
      <span id="mTitleTxt">Добавить в каталог</span>
      <button class="m-close" onclick="closeEditModal()">✕</button>
    </div>

    <label class="flab">Категория *</label>
    <select class="sel" id="fKind" onchange="toggleSpeedField()">
      <option value="car">🚔 Служебный автомобиль</option>
      <option value="skin">👮 Форменная одежда / Скин</option>
    </select>

    <label class="flab">Фракция / Ведомство *</label>
    <select class="sel" id="fFac"></select>

    <label class="flab">Название модели авто или комплекта формы *</label>
    <input class="inp" id="fTitle" placeholder="Например: Skoda Octavia ДПС / Повседневная форма ППС">

    <label class="flab">Подразделение / Город / Назначение</label>
    <input class="inp" id="fSub" placeholder="Например: ОГИБДД г. Приволжск (Базовый автопарк)">

    <div id="speedFieldWrap">
      <label class="flab">Максимальная скорость и привод (только для авто)</label>
      <input class="inp" id="fSpeed" placeholder="Например: 245 км/ч · Полный привод">
    </div>

    <label class="flab">Доступ с ранга</label>
    <input class="inp" id="fRank" placeholder="Например: С 4 ранга (Старший сержант)">

    <label class="flab">Фотография (Загрузите файл с компьютера или вставьте ссылку)</label>
    <div class="photo-drop" onclick="document.getElementById('fFileInp').click()">
      <div style="font-weight:800;color:#93c5fd;font-size:13px">📷 Нажмите здесь, чтобы выбрать фото с компьютера</div>
      <div style="font-size:11.5px;color:var(--mut);margin-top:4px">Поддерживаются PNG, JPG, WEBP — изображение автоматически оптимизируется без ошибок</div>
      <input type="file" id="fFileInp" accept="image/*" style="display:none" onchange="handlePhotoFile(this)">
      <img id="fPreview" class="photo-preview" alt="Предпросмотр">
    </div>
    <input class="inp" id="fImgUrl" style="margin-top:8px" placeholder="Или вставьте прямую ссылку на картинку (https://...)" oninput="handleUrlPreview(this.value)">

    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
      <button class="t-btn" onclick="closeEditModal()">Отмена</button>
      <button class="add-btn" onclick="saveCatalogItem()">💾 Сохранить</button>
    </div>
  </div>
</div>

<div id="lb" onclick="this.style.display='none'"><img id="lbImg" src="" alt=""></div>
<div id="troot"></div>

<script>
var STORAGE_KEY = 'mta_garage_catalog_v5';
var CUR_KIND = 'car';
var CUR_FAC = 'all';
var EDIT_ID = null;
var CURRENT_IMG_DATA = '';

var FAC_LIST = [
  { k: 'all',  n: 'Все ведомства',          ic: '📋' },
  { k: 'umvd', n: 'УМВД (Полиция / ОМОН)',  ic: '🛡️' },
  { k: 'gibdd',n: 'ОГИБДД (ДПС)',           ic: '🚓' },
  { k: 'mz',   n: 'Минздрав (ЦГБ / ОКБ)',   ic: '🏥' },
  { k: 'mo',   n: 'Минобороны (ВС РФ)',     ic: '🎖️' },
  { k: 'mp',   n: 'МП-панель (ФСБ / СК / МЧС / ФСО)', ic: '🚨' }
];

var DEFAULT_ITEMS = [
  /* Автопарк УМВД */
  { id: 'c1', kind: 'car', fac: 'umvd', title: 'Lada Vesta ППС', sub: 'УМВД · Базовый патрульный автомобиль', speed: '195 км/ч · Передний привод', rank: 'Со 2 ранга (Мл. сержант)', img: '' },
  { id: 'c2', kind: 'car', fac: 'umvd', title: 'УАЗ Патриот ППС', sub: 'УМВД · Патрульный внедорожник', speed: '175 км/ч · Полный привод', rank: 'С 3 ранга (Сержант)', img: '' },
  { id: 'c3', kind: 'car', fac: 'umvd', title: 'Skoda Octavia УМВД', sub: 'УМВД г. Приволжск · Оперативно-служебный', speed: '230 км/ч · Передний привод', rank: 'С 6 ранга (Прапорщик)', img: '' },
  { id: 'c4', kind: 'car', fac: 'umvd', title: 'Toyota Camry XV70 (ОУР)', sub: 'УМВД · Оперативный транспорт уголовного розыска', speed: '245 км/ч · Передний привод', rank: 'С 9 ранга (Лейтенант)', img: '' },
  { id: 'c5', kind: 'car', fac: 'umvd', title: 'КамАЗ-4350 «Выстрел» / Автозак ОМОН', sub: 'УМВД · Спецтранспорт ОМОН для спецопераций', speed: '140 км/ч · Полный привод', rank: 'Со спецдопуска ОМОН', img: '' },

  /* Автопарк ОГИБДД */
  { id: 'c6', kind: 'car', fac: 'gibdd', title: 'Lada Vesta Sport ДПС', sub: 'ОГИБДД · Базовый экипаж дорожно-патрульной службы', speed: '215 км/ч · Передний привод', rank: 'Со 2 ранга (Мл. сержант)', img: '' },
  { id: 'c7', kind: 'car', fac: 'gibdd', title: 'Skoda Octavia A8 ДПС', sub: 'ОГИБДД · Скоростной трассовый патруль', speed: '240 км/ч · Полный привод', rank: 'С 5 ранга (Старшина)', img: '' },
  { id: 'c8', kind: 'car', fac: 'gibdd', title: 'BMW M5 F90 Спецбат ДПС', sub: 'ОГИБДД г. Приволжск · Уникальный перехватчик спецбатальона', speed: '305 км/ч · Полный привод', rank: 'С 11 ранга (Капитан)', img: '' },
  { id: 'c9', kind: 'car', fac: 'gibdd', title: 'Mercedes-Benz E63 AMG ДПС', sub: 'ОГИБДД г. Невский · Скоростной перехватчик сопровождения', speed: '300 км/ч · Полный привод', rank: 'С 12 ранга (Майор)', img: '' },

  /* Автопарк Минздрава */
  { id: 'c10', kind: 'car', fac: 'mz', title: 'ГАЗель Next СМП (Класс B)', sub: 'ЦГБ / ОКБ · Базовый автомобиль скорой медицинской помощи', speed: '165 км/ч · Задний привод', rank: 'Со 2 ранга', img: '' },
  { id: 'c11', kind: 'car', fac: 'mz', title: 'Ford Transit Реанимация (Класс C)', sub: 'ЦГБ г. Приволжск · Реанимобиль экстренной бригады', speed: '185 км/ч · Полный привод', rank: 'С 6 ранга (Фельдшер)', img: '' },

  /* Автопарк МП-панели */
  { id: 'c12', kind: 'car', fac: 'mp', title: 'Mercedes-Benz V300d (ЦСН ФСБ)', sub: 'МП-панель · Спецтранспорт ФСБ для глобальных мероприятий', speed: '220 км/ч · Полный привод', rank: 'МП-панель (Для РП-мероприятий)', img: '' },
  { id: 'c13', kind: 'car', fac: 'mp', title: 'Aurus Senat (ФСО России)', sub: 'МП-панель · Автомобиль правительственного кортежа', speed: '250 км/ч · Полный привод', rank: 'МП-панель (Для РП-мероприятий)', img: '' },
  { id: 'c14', kind: 'car', fac: 'mp', title: 'Ford Transit (Следственный комитет РФ)', sub: 'МП-панель · Передвижная криминалистическая лаборатория СК', speed: '180 км/ч · Полный привод', rank: 'МП-панель (Для РП-мероприятий)', img: '' },

  /* Форма и скины (БЕЗ скорости!) */
  { id: 's1', kind: 'skin', fac: 'umvd', title: 'Повседневная форма ППС (Образец 2015 г.)', sub: 'УМВД · Тёмно-синий китель с динамическими погонами полиции', rank: '1–7 ранг (Рядовой — Ст. прапорщик)', img: '' },
  { id: 's2', kind: 'skin', fac: 'umvd', title: 'Тактическая чёрная форма ОМОН «Зубр»', sub: 'УМВД · Боевая экипировка со шлемом, разгрузкой и чёрными погонами', rank: 'Бойцы отряда ОМОН / СОБР', img: '' },
  { id: 's3', kind: 'skin', fac: 'umvd', title: 'Офицерский китель Юстиции (Следственный отдел)', sub: 'УМВД · Форма следователя с васильковыми синими погонами', rank: '8–14 ранг (Мл. лейтенант — Полковник)', img: '' },
  { id: 's4', kind: 'skin', fac: 'gibdd', title: 'Постовая форма инспектора ДПС со светоотражающим жилетом', sub: 'ОГИБДД · Специальная экипировка дорожно-патрульной службы', rank: '1–11 ранг ОГИБДД', img: '' },
  { id: 's5', kind: 'skin', fac: 'gibdd', title: 'Парадная форма офицера ГИБДД (Белая рубашка)', sub: 'ОГИБДД · Белая рубашка с парадными погонами', rank: '8–14 ранг ОГИБДД', img: '' },
  { id: 's6', kind: 'skin', fac: 'mp', title: 'Штурмовой комплект ЦСН ФСБ «Альфа» (Мультикам)', sub: 'МП-панель · Тактический скин спецназа ФСБ для спецопераций', rank: 'МП-панель (Для РП-мероприятий)', img: '' },
  { id: 's7', kind: 'skin', fac: 'mp', title: 'Китель следователя СК РФ / Прокуратуры', sub: 'МП-панель · Официальная форма для следственных РП-ситуаций', rank: 'МП-панель (Для РП-мероприятий)', img: '' }
];

var CATALOG = [];

function loadCatalog() {
  try {
    var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (Array.isArray(raw) && raw.length) {
      CATALOG = raw;
      return;
    }
  } catch (e) {}
  CATALOG = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
}

function saveCatalog() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(CATALOG));
  } catch (e) {
    toast('Память браузера заполнена — удалите старые тяжёлые фото', true);
  }
}

function toast(msg) {
  var d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  document.getElementById('troot').appendChild(d);
  setTimeout(function() { d.remove(); }, 3200);
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

function facNameByKey(k) {
  for (var i = 0; i < FAC_LIST.length; i++) if (FAC_LIST[i].k === k) return FAC_LIST[i].n;
  return 'Ведомство';
}

window.setKind = function(k) {
  CUR_KIND = k;
  document.getElementById('tabCars').classList.toggle('on', k === 'car');
  document.getElementById('tabSkins').classList.toggle('on', k === 'skin');
  renderGrid();
};

window.setFacFilter = function(f) {
  CUR_FAC = f;
  renderFacChips();
  renderGrid();
};

function renderFacChips() {
  document.getElementById('facChips').innerHTML = FAC_LIST.map(function(f) {
    return '<div class="f-chip' + (CUR_FAC === f.k ? ' on' : '') + '" onclick="setFacFilter(\'' + f.k + '\')">' + f.ic + ' ' + esc(f.n) + '</div>';
  }).join('');
}

function renderGrid() {
  var carsTotal = CATALOG.filter(function(x) { return x.kind === 'car'; }).length;
  var skinsTotal = CATALOG.filter(function(x) { return x.kind === 'skin'; }).length;
  document.getElementById('cntCars').textContent = carsTotal;
  document.getElementById('cntSkins').textContent = skinsTotal;

  var q = (document.getElementById('qInp').value || '').trim().toLowerCase();
  var list = CATALOG.filter(function(it) {
    if (it.kind !== CUR_KIND) return false;
    if (CUR_FAC !== 'all' && it.fac !== CUR_FAC) return false;
    if (q && ((it.title || '') + ' ' + (it.sub || '') + ' ' + (it.rank || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });

  if (!list.length) {
    document.getElementById('cardsGrid').innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:16px">В этой категории пока нет элементов — нажмите «＋ Добавить в каталог»</div>';
    return;
  }

  document.getElementById('cardsGrid').innerHTML = list.map(function(it) {
    var isSkin = (it.kind === 'skin');
    var mediaHtml = it.img
      ? '<img src="' + esc(it.img) + '" alt="' + esc(it.title) + '" onclick="openLightbox(\'' + esc(it.img) + '\')">'
      : '<div class="ic-placeholder" onclick="openEditModal(\'' + esc(it.id) + '\')"><i>' + (isSkin ? '👮' : '🚔') + '</i><span>Нажмите, чтобы загрузить фото</span></div>';

    return '<div class="item-card' + (isSkin ? ' skin-card' : '') + '">' +
      '<div class="ic-media">' +
        '<div class="ic-badges">' +
          '<span class="ic-tag' + (it.fac === 'mp' ? ' mp' : '') + '">' + esc(facNameByKey(it.fac)) + '</span>' +
          (!isSkin && it.speed ? '<span class="ic-tag">⚡ ' + esc(it.speed) + '</span>' : '') +
        '</div>' +
        mediaHtml +
      '</div>' +
      '<div class="ic-body">' +
        '<div class="ic-title">' + esc(it.title) + '</div>' +
        (it.sub ? '<div class="ic-meta">' + esc(it.sub) + '</div>' : '') +
        (it.rank ? '<div class="ic-meta">Доступ: <b>' + esc(it.rank) + '</b></div>' : '') +
      '</div>' +
      '<div class="ic-admin-bar">' +
        '<button class="adm-btn" onclick="openEditModal(\'' + esc(it.id) + '\')">📷 Фото / Изменить</button>' +
        '<button class="adm-btn del" onclick="deleteCatalogItem(\'' + esc(it.id) + '\')">🗑 Удалить</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

window.openLightbox = function(url) {
  if (!url) return;
  document.getElementById('lbImg').src = url;
  document.getElementById('lb').style.display = 'flex';
};

window.toggleSpeedField = function() {
  var k = document.getElementById('fKind').value;
  document.getElementById('speedFieldWrap').style.display = (k === 'car') ? 'block' : 'none';
};

window.openEditModal = function(id) {
  EDIT_ID = id || null;
  var facSel = document.getElementById('fFac');
  facSel.innerHTML = FAC_LIST.filter(function(f) { return f.k !== 'all'; }).map(function(f) {
    return '<option value="' + f.k + '">' + f.ic + ' ' + esc(f.n) + '</option>';
  }).join('');

  var prev = document.getElementById('fPreview');
  document.getElementById('fFileInp').value = '';

  if (EDIT_ID) {
    var it = CATALOG.filter(function(x) { return x.id === EDIT_ID; })[0];
    if (!it) return;
    document.getElementById('mTitleTxt').textContent = 'Редактировать карточку';
    document.getElementById('fKind').value = it.kind;
    document.getElementById('fFac').value = it.fac;
    document.getElementById('fTitle').value = it.title || '';
    document.getElementById('fSub').value = it.sub || '';
    document.getElementById('fSpeed').value = it.speed || '';
    document.getElementById('fRank').value = it.rank || '';
    CURRENT_IMG_DATA = it.img || '';
    document.getElementById('fImgUrl').value = (CURRENT_IMG_DATA.indexOf('data:') === 0) ? '' : CURRENT_IMG_DATA;
    if (CURRENT_IMG_DATA) {
      prev.src = CURRENT_IMG_DATA;
      prev.style.display = 'block';
    } else {
      prev.style.display = 'none';
    }
  } else {
    document.getElementById('mTitleTxt').textContent = 'Добавить в каталог';
    document.getElementById('fKind').value = CUR_KIND;
    document.getElementById('fFac').value = (CUR_FAC !== 'all') ? CUR_FAC : 'umvd';
    document.getElementById('fTitle').value = '';
    document.getElementById('fSub').value = '';
    document.getElementById('fSpeed').value = '';
    document.getElementById('fRank').value = '';
    document.getElementById('fImgUrl').value = '';
    CURRENT_IMG_DATA = '';
    prev.style.display = 'none';
  }
  toggleSpeedField();
  document.getElementById('editBack').style.display = 'flex';
};

window.closeEditModal = function() {
  document.getElementById('editBack').style.display = 'none';
};

/* Мгновенное сжатие фото на Canvas — работает всегда без ошибок размера или сети */
window.handlePhotoFile = function(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var maxW = 900, maxH = 650;
      var w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        var r = Math.min(maxW / w, maxH / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      CURRENT_IMG_DATA = cv.toDataURL('image/jpeg', 0.84);
      var prev = document.getElementById('fPreview');
      prev.src = CURRENT_IMG_DATA;
      prev.style.display = 'block';
      toast('✓ Фотография успешно загружена');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.handleUrlPreview = function(url) {
  var u = (url || '').trim();
  if (!u) return;
  CURRENT_IMG_DATA = u;
  var prev = document.getElementById('fPreview');
  prev.src = u;
  prev.style.display = 'block';
};

window.saveCatalogItem = function() {
  var kind = document.getElementById('fKind').value;
  var fac = document.getElementById('fFac').value;
  var title = (document.getElementById('fTitle').value || '').trim();
  var sub = (document.getElementById('fSub').value || '').trim();
  var speed = (kind === 'car') ? (document.getElementById('fSpeed').value || '').trim() : '';
  var rank = (document.getElementById('fRank').value || '').trim();

  if (!title) {
    toast('Введите название модели или формы');
    return;
  }

  if (EDIT_ID) {
    CATALOG.forEach(function(x) {
      if (x.id === EDIT_ID) {
        x.kind = kind; x.fac = fac; x.title = title; x.sub = sub;
        x.speed = speed; x.rank = rank; x.img = CURRENT_IMG_DATA;
      }
    });
    toast('✓ Карточка обновлена');
  } else {
    CATALOG.unshift({
      id: 'item_' + Date.now(),
      kind: kind, fac: fac, title: title, sub: sub,
      speed: speed, rank: rank, img: CURRENT_IMG_DATA
    });
    CUR_KIND = kind;
    toast('✓ Добавлено в каталог');
  }

  saveCatalog();
  closeEditModal();
  setKind(CUR_KIND);
};

window.deleteCatalogItem = function(id) {
  CATALOG = CATALOG.filter(function(x) { return x.id !== id; });
  saveCatalog();
  renderGrid();
  toast('Карточка удалена');
};

loadCatalog();
renderFacChips();
renderGrid();
</script>
