<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автопарк и форма фракций</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1116;
  --bg2:#131820;
  --card:#191f28;
  --line:#27303d;
  --txt:#e9edf4;
  --mut:#8b95a7;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
  --purple:#a78bfa;
}
html,body{color-scheme:dark;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
body{background:radial-gradient(1100px 520px at 8% -10%,rgba(45,100,170,.16),transparent 60%),radial-gradient(900px 520px at 115% 115%,rgba(130,90,220,.1),transparent 55%),#0e1116}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3342;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#3a4656}
button{font-family:inherit;cursor:pointer}

/* Верхняя шапка (без кнопки повторного входа) */
#topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--line);
  background:rgba(14,17,22,.92);
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(10px);
}
.tb-left{display:flex;align-items:center;gap:12px}
.logo-ic{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,#2b5876,#4e4376);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;border:1px solid #3d557f;
}
.tb-title{font-weight:800;letter-spacing:1.2px;font-size:13.5px;background:linear-gradient(90deg,#eaf2ff,#a9c7ef);-webkit-background-clip:text;background-clip:text;color:transparent}
.tb-right{display:flex;align-items:center;gap:10px}
.adbadge{display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;border:1px solid #2aa562;background:rgba(47,217,122,.13);color:#7ce6a8;font-size:11.5px;font-weight:800}
body.adm .adbadge{display:inline-flex}

/* Классический макет с боковой панелью */
#layout{display:flex;min-height:calc(100vh - 58px);max-width:1540px;margin:0 auto;width:100%}
#sidebar{
  width:265px;flex:0 0 265px;
  background:var(--bg2);
  border-right:1px solid var(--line);
  padding:16px 12px;
  position:sticky;top:58px;
  height:calc(100vh - 58px);
  overflow-y:auto;
}
.sb-group{margin-bottom:12px}
.sb-ghdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-radius:9px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--mut);font-weight:800;cursor:pointer;user-select:none;
}
.sb-ghdr:hover{color:var(--txt);background:#1a212b}
.sb-gitems{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.sb-group.collapsed .sb-gitems{display:none}
.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;
  color:var(--mut);cursor:pointer;font-weight:600;font-size:13px;
  border:1px solid transparent;transition:.15s;
}
.sb-item:hover{color:var(--txt);background:#1a212b}
.sb-item.on{
  color:#fff;
  background:linear-gradient(90deg,rgba(77,163,255,.18),rgba(77,163,255,.03));
  border-color:rgba(77,163,255,.32);
}
.sb-item .sb-c{margin-left:auto;background:#232e3d;border:1px solid #32405a;padding:1px 8px;border-radius:10px;font-size:11px;color:#aeb9cc;font-weight:700}

/* Основная область */
#content{flex:1;padding:22px 26px 60px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:16px}
h1{font-size:23px;font-weight:800;letter-spacing:-.3px}
.cnt{font-size:12px;background:#22304a;border:1px solid #32456a;color:#a9c7ef;padding:2px 10px;border-radius:12px;vertical-align:middle;margin-left:8px;font-weight:800}
.ph-sub{color:var(--mut);font-size:12.5px;margin-top:4px}

/* Переключатель вкладок: Автопарк / Форма (скины) */
.mode-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mtab{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);
  color:var(--mut);font-size:13px;font-weight:800;cursor:pointer;transition:.15s;
}
.mtab:hover{border-color:#3a4656;color:var(--txt)}
.mtab.on{background:rgba(77,163,255,.16);border-color:var(--acc);color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);
  color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;transition:.15s;
}
.chip:hover{border-color:#3a4656;color:var(--txt)}
.chip.on{border-color:var(--acc);color:#fff;background:rgba(77,163,255,.16)}

.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.inp,.sel,textarea.inp{
  background:#141a23;border:1px solid var(--line);color:var(--txt);
  padding:9px 13px;border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;width:100%;
}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,163,255,.14)}

.btn{
  background:linear-gradient(145deg,#3684e6,#2868c9);
  border:1px solid #3a6cb4;color:#fff;
  padding:9px 16px;border-radius:10px;font-weight:700;font-size:12.5px;
  transition:.15s;box-shadow:0 4px 14px rgba(40,100,190,.25);
}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.warn{background:linear-gradient(145deg,#a03c3c,#7c2a2a);border-color:#a34444}

/* Сетка карточек в прежнем классическом стиле */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:14px}
.vcard{
  background:linear-gradient(145deg,#1c2432,#181e28);
  border:1px solid var(--line);border-radius:15px;
  overflow:hidden;display:flex;flex-direction:column;
  position:relative;transition:transform .16s,border-color .16s,box-shadow .16s;
}
.vcard:hover{transform:translateY(-2px);border-color:#3a4757;box-shadow:0 12px 30px rgba(0,0,0,.38)}
.vimg{
  width:100%;aspect-ratio:16/10;background:#121720;
  position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-bottom:1px solid var(--line);
}
.vcard.skin .vimg{aspect-ratio:4/4}
.vimg img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .22s}
.vcard:hover .vimg img{transform:scale(1.03)}
.vph{display:flex;flex-direction:column;align-items:center;gap:5px;color:#5b6678;font-size:12px;font-weight:700}
.vph span{font-size:34px}

.vbadges{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.vtag{
  padding:3px 9px;border-radius:8px;font-size:10.5px;font-weight:800;
  background:rgba(14,17,22,.86);border:1px solid rgba(255,255,255,.12);color:#cfe0f5;
}
.vtag.speed{color:#ffd98a;border-color:rgba(247,201,72,.4)}
.vtag.city{color:#6cc0ff;border-color:rgba(77,163,255,.4)}

.vbody{padding:13px 15px;flex:1;display:flex;flex-direction:column;gap:6px}
.vtitle{font-weight:800;font-size:15px;color:#fff;line-height:1.3}
.vsub{font-size:12px;color:var(--mut);line-height:1.45}

.vtools{
  display:none;gap:6px;padding:9px 15px 13px;border-top:1px dashed #232b37;
}
body.adm .vtools{display:flex}
.vbtn{
  flex:1;padding:6px 10px;border-radius:8px;background:#141a23;border:1px solid var(--line);
  color:#c9d3e3;font-size:11.5px;font-weight:700;transition:.15s;
}
.vbtn:hover{border-color:var(--acc);color:#fff}
.vbtn.del:hover{border-color:var(--red);color:#ffb3b3}

.empty{padding:34px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px;margin-top:8px}

/* Модальное окно добавления и редактирования */
.back{position:fixed;inset:0;background:rgba(4,7,11,.78);backdrop-filter:blur(7px);z-index:400;display:none;justify-content:center;align-items:flex-start;overflow-y:auto;padding:34px 14px}
.modal{width:100%;max-width:560px;background:#161c25;border:1px solid #2b3442;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden;display:flex;flex-direction:column}
.m-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,rgba(77,163,255,.08),transparent)}
.m-close{position:absolute;top:13px;right:14px;background:#1d2531;border:1px solid var(--line);color:var(--mut);width:30px;height:30px;border-radius:8px}
.mh-nm{font-size:17px;font-weight:800}
.m-body{padding:16px 22px;display:flex;flex-direction:column;gap:10px;max-height:72vh;overflow-y:auto}
.m-foot{padding:12px 22px;border-top:1px solid var(--line);background:#141a24;display:flex;justify-content:flex-end;gap:10px}
.flab{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800;margin-bottom:3px;display:block}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.up-zone{
  border:1.5px dashed #3a5072;background:rgba(77,163,255,.06);
  border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.15s;
}
.up-zone:hover{border-color:var(--acc);background:rgba(77,163,255,.12)}
.up-prev{width:100%;max-height:190px;object-fit:contain;border-radius:9px;margin-top:9px;display:none;border:1px solid var(--line);background:#0c1017}

#lb{position:fixed;inset:0;z-index:600;background:rgba(4,7,11,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb img{max-width:92vw;max-height:88vh;border-radius:14px;border:1px solid var(--line)}

#troot{position:fixed;right:18px;bottom:18px;z-index:700;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c2531;border:1px solid #32435c;border-left:3px solid var(--acc);padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.45)}

@media(max-width:860px){#sidebar{display:none}#layout{display:block}#content{padding:16px 12px 80px}.form2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header id="topbar">
  <div class="tb-left">
    <div class="logo-ic">🚔</div>
    <div class="tb-title">АВТОПАРК И ФОРМА ФРАКЦИЙ</div>
  </div>
  <div class="tb-right">
    <span class="adbadge">✏️ Режим владельца</span>
  </div>
</header>

<div id="layout">
  <aside id="sidebar"></aside>
  <main id="content">
    <div class="ph">
      <div>
        <h1><span id="hTitle">Все фракции</span><span class="cnt" id="hCnt">0</span></h1>
        <div class="ph-sub" id="hSub">Каталог служебного транспорта и форменной одежды подразделений</div>
      </div>
      <div id="addBtnWrap" style="display:none">
        <button class="btn" id="btnAddMain" onclick="openModal(null)">＋ Добавить транспорт</button>
      </div>
    </div>

    <div class="mode-tabs">
      <div class="mtab on" id="tabCar" onclick="setMode('car')">🚗 Автопарк (<span id="cntCar">0</span>)</div>
      <div class="mtab" id="tabSkin" onclick="setMode('skin')">👔 Форма / скины (<span id="cntSkin">0</span>)</div>
    </div>

    <div class="chips" id="cityChips"></div>

    <div class="ctl">
      <input class="inp" id="qInp" style="max-width:380px" placeholder="🔎 Поиск по названию или описанию..." oninput="renderItems()">
    </div>

    <div id="items"></div>
  </main>
</div>

<!-- Модальное окно добавления / редактирования -->
<div class="back" id="mBack" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-head">
      <button class="m-close" onclick="closeModal()">✕</button>
      <div class="mh-nm" id="mTitle">Добавить в каталог</div>
    </div>
    <div class="m-body">
      <div class="form2">
        <div>
          <label class="flab">Раздел *</label>
          <select class="sel" id="fKind" onchange="syncModalFields()">
            <option value="car">🚗 Автопарк (Транспорт)</option>
            <option value="skin">👔 Форма (Скин)</option>
          </select>
        </div>
        <div>
          <label class="flab">Фракция / Структура *</label>
          <select class="sel" id="fFac"></select>
        </div>
      </div>

      <div>
        <label class="flab">Название модели или формы *</label>
        <input class="inp" id="fName" placeholder="Например: Skoda Octavia ДПС / Повседневная форма ППС">
      </div>

      <div class="form2">
        <div>
          <label class="flab">Привязка к городу</label>
          <select class="sel" id="fCity">
            <option value="all">Общий (Все города)</option>
            <option value="priv">г. Приволжск</option>
            <option value="mir">г. Мирный</option>
            <option value="nev">г. Невский</option>
          </select>
        </div>
        <div id="speedWrap">
          <label class="flab">Макс. скорость (км/ч)</label>
          <input class="inp" id="fSpeed" placeholder="Например: 240 км/ч">
        </div>
      </div>

      <div>
        <label class="flab">Описание / ранг доступа / подразделение</label>
        <input class="inp" id="fDesc" placeholder="Например: Спецбатальон ДПС · Доступно с 6 ранга">
      </div>

      <div>
        <label class="flab">Фотография (Выберите файл с ПК или вставьте ссылку)</label>
        <div class="up-zone" onclick="document.getElementById('fFile').click()">
          <div style="font-weight:800;font-size:12.5px;color:#7cc4ff">📷 Загрузить фото с компьютера</div>
          <div style="font-size:11px;color:var(--mut);margin-top:3px">Файл сжимается автоматически и сохраняется мгновенно без ошибок</div>
          <input type="file" id="fFile" accept="image/*" style="display:none" onchange="onFilePicked(this)">
          <img id="fPrev" class="up-prev" alt="Превью">
        </div>
        <input class="inp" id="fUrl" style="margin-top:7px" placeholder="Или прямая ссылка на фото (https://...)" oninput="onUrlInput(this.value)">
      </div>
    </div>
    <div class="m-foot">
      <button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="saveItem()">💾 Сохранить</button>
    </div>
  </div>
</div>

<div id="lb" onclick="this.style.display='none'"><img id="lbImg" src="" alt=""></div>
<div id="troot"></div>

<script>
var STORE_K = 'garage_classic_data_v6';
/* Автоматическое определение входа владельца с главного сайта (без повторной кнопки Вход) */
var isOwner = false;
function checkOwnerAuth() {
  try {
    var k = localStorage.getItem('idea_admin_key');
    isOwner = !!(k && String(k).trim().length > 5);
  } catch (e) { isOwner = false; }
  document.body.classList.toggle('adm', isOwner);
  var ab = document.getElementById('addBtnWrap');
  if (ab) ab.style.display = isOwner ? '' : 'none';
}
window.addEventListener('storage', checkOwnerAuth);

var GROUPS = [
  { id: 'gov', name: 'Государственные организации' },
  { id: 'mp',  name: 'Транспорт и скины для МП' }
];

var FACS = [
  { k: 'all',   n: 'Все фракции',      ic: '📋', g: 'gov' },
  { k: 'uvd',   n: 'УМВД (Полиция)',   ic: '🛡️', g: 'gov' },
  { k: 'gibdd', n: 'ОГИБДД (ДПС)',     ic: '🚓', g: 'gov' },
  { k: 'mo',    n: 'Минобороны (Армия)',ic: '🎖️', g: 'gov' },
  { k: 'mz',    n: 'Минздрав (МЗ)',    ic: '🏥', g: 'gov' },
  { k: 'rzd',   n: 'Минтранс (РЖД)',   ic: '🚂', g: 'gov' },
  { k: 'fsb',   n: 'ФСБ',              ic: '🦅', g: 'mp' },
  { k: 'sk',    n: 'Следственный комитет', ic: '⚖️', g: 'mp' },
  { k: 'proc',  n: 'Прокуратура',      ic: '🏛️', g: 'mp' },
  { k: 'mchs',  n: 'МЧС России',       ic: '🚒', g: 'mp' },
  { k: 'fso',   n: 'ФСО России',       ic: '🕶️', g: 'mp' }
];

var CITIES = [
  ['all',  'Все города'],
  ['priv', 'г. Приволжск'],
  ['mir',  'г. Мирный'],
  ['nev',  'г. Невский']
];

var SEED_DATA = [
  /* УМВД — Автопарк */
  { id: 'u1', kind: 'car', fac: 'uvd', city: 'all',  name: 'Lada Vesta ППС',         speed: '195 км/ч', desc: 'Базовый патрульный автомобиль ППСМ', img: '' },
  { id: 'u2', kind: 'car', fac: 'uvd', city: 'all',  name: 'УАЗ Патриот ППС',        speed: '175 км/ч', desc: 'Патрульный вседорожник дежурной части', img: '' },
  { id: 'u3', kind: 'car', fac: 'uvd', city: 'priv', name: 'Skoda Octavia УМВД',     speed: '230 км/ч', desc: 'Оперативно-служебный седан УМВД г. Приволжск', img: '' },
  { id: 'u4', kind: 'car', fac: 'uvd', city: 'mir',  name: 'Toyota Camry XV70 ОУР',  speed: '245 км/ч', desc: 'Оперативный транспорт уголовного розыска', img: '' },
  { id: 'u5', kind: 'car', fac: 'uvd', city: 'nev',  name: 'КамАЗ Автозак ОМОН',     speed: '140 км/ч', desc: 'Спецтранспорт ОМОН для выездов на спецоперации', img: '' },

  /* ОГИБДД — Автопарк */
  { id: 'g1', kind: 'car', fac: 'gibdd', city: 'all',  name: 'Lada Vesta Sport ДПС', speed: '215 км/ч', desc: 'Базовый экипаж дорожно-патрульной службы', img: '' },
  { id: 'g2', kind: 'car', fac: 'gibdd', city: 'all',  name: 'Skoda Octavia A8 ДПС', speed: '240 км/ч', desc: 'Скоростной патрульный автомобиль ДПС', img: '' },
  { id: 'g3', kind: 'car', fac: 'gibdd', city: 'priv', name: 'BMW M5 F90 ДПС',       speed: '305 км/ч', desc: 'Перехватчик спецбатальона ОГИБДД г. Приволжск', img: '' },
  { id: 'g4', kind: 'car', fac: 'gibdd', city: 'nev',  name: 'Mercedes-Benz E63 ДПС',speed: '300 км/ч', desc: 'Скоростной экипаж сопровождения г. Невский', img: '' },

  /* Минздрав — Автопарк */
  { id: 'm1', kind: 'car', fac: 'mz', city: 'all',  name: 'ГАЗель Next СМП',         speed: '165 км/ч', desc: 'Автомобиль скорой медицинской помощи (Класс B)', img: '' },
  { id: 'm2', kind: 'car', fac: 'mz', city: 'priv', name: 'Ford Transit Реанимация', speed: '185 км/ч', desc: 'Реанимобиль экстренной бригады ЦГБ г. Приволжск', img: '' },

  /* МП-панель — Автопарк */
  { id: 'mp1', kind: 'car', fac: 'fsb',  city: 'all', name: 'Mercedes-Benz V300d ЦСН ФСБ', speed: '220 км/ч', desc: 'Оперативный микроавтобус ФСБ для глобальных МП', img: '' },
  { id: 'mp2', kind: 'car', fac: 'fso',  city: 'all', name: 'Aurus Senat ФСО',             speed: '250 км/ч', desc: 'Правительственный лимузин сопровождения кортежей', img: '' },
  { id: 'mp3', kind: 'car', fac: 'sk',   city: 'all', name: 'Ford Transit СК России',      speed: '180 км/ч', desc: 'Передвижная криминалистическая лаборатория СК', img: '' },
  { id: 'mp4', kind: 'car', fac: 'mchs', city: 'all', name: 'КамАЗ АЦ-40 Пожарная',        speed: '135 км/ч', desc: 'Пожарно-спасательная автоцистерна МЧС', img: '' },

  /* Форма (скины) — без скорости! */
  { id: 's1', kind: 'skin', fac: 'uvd',   city: 'all', name: 'Повседневная форма ППС (2015 г.)', speed: '', desc: 'Тёмно-синяя форма сотрудника полиции с погонами', img: '' },
  { id: 's2', kind: 'skin', fac: 'uvd',   city: 'all', name: 'Боевая форма ОМОН / СОБР (Чёрная)', speed: '', desc: 'Тактический комплект со шлемом и чёрными погонами', img: '' },
  { id: 's3', kind: 'skin', fac: 'uvd',   city: 'all', name: 'Китель следователя Юстиции',       speed: '', desc: 'Форма следственного отдела с синими погонами', img: '' },
  { id: 's4', kind: 'skin', fac: 'gibdd', city: 'all', name: 'Форма инспектора ДПС с жилетом',   speed: '', desc: 'Светоотражающий жилет и экипировка ОГИБДД', img: '' },
  { id: 's5', kind: 'skin', fac: 'gibdd', city: 'all', name: 'Парадная белая рубашка ГИБДД',     speed: '', desc: 'Парадно-выходная форма офицерского состава', img: '' },
  { id: 's6', kind: 'skin', fac: 'fsb',   city: 'all', name: 'Штурмовой скин ЦСН ФСБ',           speed: '', desc: 'Тактическая экипировка спецназа ФСБ для МП', img: '' },
  { id: 's7', kind: 'skin', fac: 'sk',    city: 'all', name: 'Форма следователя СК России',      speed: '', desc: 'Официальный китель Следственного комитета для МП', img: '' }
];

var DATA = [];
var state = { fac: 'all', mode: 'car', city: 'all', q: '' };
var collapsedGroups = {};
var editingId = null;
var tempImgData = '';

function loadData() {
  try {
    var d = JSON.parse(localStorage.getItem(STORE_K) || 'null');
    if (Array.isArray(d) && d.length) { DATA = d; return; }
  } catch (e) {}
  DATA = JSON.parse(JSON.stringify(SEED_DATA));
}

function saveData() {
  try {
    localStorage.setItem(STORE_K, JSON.stringify(DATA));
  } catch (e) {
    toast('Память переполнена — уменьшите количество тяжёлых фото');
  }
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

function toast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('troot').appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

function facObj(k) {
  for (var i = 0; i < FACS.length; i++) if (FACS[i].k === k) return FACS[i];
  return FACS[0];
}

function cityLabel(c) {
  for (var i = 0; i < CITIES.length; i++) if (CITIES[i][0] === c) return CITIES[i][1];
  return 'Все города';
}

function countByFacAndMode(facKey, mode) {
  return DATA.filter(function(x) {
    if (mode && x.kind !== mode) return false;
    if (facKey !== 'all' && x.fac !== facKey) return false;
    return true;
  }).length;
}

window.toggleGroup = function(gid) {
  collapsedGroups[gid] = !collapsedGroups[gid];
  renderSidebar();
};

window.selectFac = function(k) {
  state.fac = k;
  renderAll();
};

window.setMode = function(m) {
  state.mode = m;
  document.getElementById('tabCar').classList.toggle('on', m === 'car');
  document.getElementById('tabSkin').classList.toggle('on', m === 'skin');
  var btnAdd = document.getElementById('btnAddMain');
  if (btnAdd) btnAdd.textContent = (m === 'car') ? '＋ Добавить транспорт' : '＋ Добавить форму';
  renderAll();
};

window.setCity = function(c) {
  state.city = c;
  renderAll();
};

function renderSidebar() {
  var h = '';
  GROUPS.forEach(function(g) {
    var col = !!collapsedGroups[g.id];
    h += '<div class="sb-group' + (col ? ' collapsed' : '') + '">' +
      '<div class="sb-ghdr" onclick="toggleGroup(\'' + g.id + '\')"><span>' + esc(g.name) + '</span><span>' + (col ? '▸' : '▾') + '</span></div>' +
      '<div class="sb-gitems">';
    FACS.filter(function(f) { return f.g === g.id; }).forEach(function(f) {
      var cnt = countByFacAndMode(f.k, state.mode);
      h += '<div class="sb-item' + (state.fac === f.k ? ' on' : '') + '" onclick="selectFac(\'' + f.k + '\')">' +
        '<span>' + f.ic + '</span><span>' + esc(f.n) + '</span>' +
        (cnt ? '<span class="sb-c">' + cnt + '</span>' : '') +
      '</div>';
    });
    h += '</div></div>';
  });
  document.getElementById('sidebar').innerHTML = h;
}

function renderCityChips() {
  document.getElementById('cityChips').innerHTML = CITIES.map(function(c) {
    return '<div class="chip' + (state.city === c[0] ? ' on' : '') + '" onclick="setCity(\'' + c[0] + '\')">' + esc(c[1]) + '</div>';
  }).join('');
}

function renderItems() {
  var q = (document.getElementById('qInp').value || '').trim().toLowerCase();
  var list = DATA.filter(function(x) {
    if (x.kind !== state.mode) return false;
    if (state.fac !== 'all' && x.fac !== state.fac) return false;
    if (state.city !== 'all' && x.city !== state.city && x.city !== 'all') return false;
    if (q && ((x.name || '') + ' ' + (x.desc || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });

  document.getElementById('hTitle').textContent = facObj(state.fac).n;
  document.getElementById('hCnt').textContent = list.length;
  document.getElementById('cntCar').textContent = countByFacAndMode(state.fac, 'car');
  document.getElementById('cntSkin').textContent = countByFacAndMode(state.fac, 'skin');

  if (!list.length) {
    document.getElementById('items').innerHTML = '<div class="empty">В этом разделе пока пусто</div>';
    return;
  }

  document.getElementById('items').innerHTML = '<div class="vgrid">' + list.map(function(it) {
    var isSkin = (it.kind === 'skin');
    var fInfo = facObj(it.fac);
    var imgBlock = it.img
      ? '<img src="' + esc(it.img) + '" alt="' + esc(it.name) + '" onclick="openLb(\'' + esc(it.img) + '\')">'
      : '<div class="vph" onclick="if(isOwner)openModal(\'' + esc(it.id) + '\')"><span>' + (isSkin ? '👔' : '🚓') + '</span><div>' + (isOwner ? 'Нажмите, чтобы добавить фото' : 'Фото не прикреплено') + '</div></div>';

    return '<div class="vcard' + (isSkin ? ' skin' : '') + '">' +
      '<div class="vimg">' +
        '<div class="vbadges">' +
          '<span class="vtag">' + fInfo.ic + ' ' + esc(fInfo.n) + '</span>' +
          /* У скинов скорость не отображается */
          (!isSkin && it.speed ? '<span class="vtag speed">⚡ ' + esc(it.speed) + '</span>' : '') +
          (it.city && it.city !== 'all' ? '<span class="vtag city">📍 ' + esc(cityLabel(it.city)) + '</span>' : '') +
        '</div>' +
        imgBlock +
      '</div>' +
      '<div class="vbody">' +
        '<div class="vtitle">' + esc(it.name) + '</div>' +
        (it.desc ? '<div class="vsub">' + esc(it.desc) + '</div>' : '') +
      '</div>' +
      '<div class="vtools">' +
        '<button class="vbtn" onclick="openModal(\'' + esc(it.id) + '\')">✏️ Изменить / Фото</button>' +
        '<button class="vbtn del" onclick="delItem(\'' + esc(it.id) + '\')">✕ Удалить</button>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

function renderAll() {
  checkOwnerAuth();
  renderSidebar();
  renderCityChips();
  renderItems();
}

window.openLb = function(url) {
  if (!url) return;
  document.getElementById('lbImg').src = url;
  document.getElementById('lb').style.display = 'flex';
};

window.syncModalFields = function() {
  var k = document.getElementById('fKind').value;
  document.getElementById('speedWrap').style.display = (k === 'car') ? '' : 'none';
};

window.openModal = function(id) {
  if (!isOwner) return;
  editingId = id || null;
  document.getElementById('fFac').innerHTML = FACS.filter(function(f) { return f.k !== 'all'; }).map(function(f) {
    return '<option value="' + f.k + '">' + f.ic + ' ' + esc(f.n) + '</option>';
  }).join('');

  var prev = document.getElementById('fPrev');
  document.getElementById('fFile').value = '';

  if (editingId) {
    var it = DATA.filter(function(x) { return x.id === editingId; })[0];
    if (!it) return;
    document.getElementById('mTitle').textContent = 'Редактировать карточку';
    document.getElementById('fKind').value = it.kind;
    document.getElementById('fFac').value = it.fac;
    document.getElementById('fName').value = it.name || '';
    document.getElementById('fCity').value = it.city || 'all';
    document.getElementById('fSpeed').value = it.speed || '';
    document.getElementById('fDesc').value = it.desc || '';
    tempImgData = it.img || '';
    document.getElementById('fUrl').value = (tempImgData.indexOf('data:') === 0) ? '' : tempImgData;
    if (tempImgData) { prev.src = tempImgData; prev.style.display = 'block'; }
    else { prev.style.display = 'none'; }
  } else {
    document.getElementById('mTitle').textContent = (state.mode === 'car') ? 'Добавить транспорт' : 'Добавить форму (скин)';
    document.getElementById('fKind').value = state.mode;
    document.getElementById('fFac').value = (state.fac !== 'all') ? state.fac : 'uvd';
    document.getElementById('fName').value = '';
    document.getElementById('fCity').value = state.city;
    document.getElementById('fSpeed').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fUrl').value = '';
    tempImgData = '';
    prev.style.display = 'none';
  }
  syncModalFields();
  document.getElementById('mBack').style.display = 'flex';
};

window.closeModal = function() {
  document.getElementById('mBack').style.display = 'none';
};

/* Мгновенное чтение и сжатие фото без ошибок */
window.onFilePicked = function(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var maxW = 900, maxH = 650, w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        var r = Math.min(maxW / w, maxH / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      tempImgData = cv.toDataURL('image/jpeg', 0.85);
      var prev = document.getElementById('fPrev');
      prev.src = tempImgData;
      prev.style.display = 'block';
      toast('✓ Фото готово к сохранению');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.onUrlInput = function(val) {
  var u = (val || '').trim();
  if (!u) return;
  tempImgData = u;
  var prev = document.getElementById('fPrev');
  prev.src = u;
  prev.style.display = 'block';
};

window.saveItem = function() {
  var kind = document.getElementById('fKind').value;
  var fac  = document.getElementById('fFac').value;
  var name = (document.getElementById('fName').value || '').trim();
  var city = document.getElementById('fCity').value;
  var speed = (kind === 'car') ? (document.getElementById('fSpeed').value || '').trim() : '';
  var desc = (document.getElementById('fDesc').value || '').trim();

  if (!name) { toast('Укажите название'); return; }

  if (editingId) {
    DATA.forEach(function(x) {
      if (x.id === editingId) {
        x.kind = kind; x.fac = fac; x.name = name; x.city = city;
        x.speed = speed; x.desc = desc; x.img = tempImgData;
      }
    });
    toast('✓ Изменения сохранены');
  } else {
    DATA.unshift({
      id: 'g_' + Date.now(),
      kind: kind, fac: fac, name: name, city: city,
      speed: speed, desc: desc, img: tempImgData
    });
    state.mode = kind;
    toast('✓ Карточка добавлена');
  }
  saveData();
  closeModal();
  setMode(state.mode);
};

window.delItem = function(id) {
  if (!isOwner) return;
  DATA = DATA.filter(function(x) { return x.id !== id; });
  saveData();
  renderAll();
  toast('Карточка удалена');
};

loadData();
renderAll();
</script>
</body>
</html>
