<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Банковская система · Провинция Банк</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090e;
  --bg2:#0d121b;
  --card:rgba(20,27,40,.82);
  --line:rgba(255,255,255,.08);
  --txt:#f2f6fc;
  --mut:#8b97ad;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
  --purple:#a78bfa;
  --gold:#f5c451;
}
html,body{color-scheme:dark;background:#07090e;color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
body{
  background:
    radial-gradient(1200px 550px at 10% -10%,rgba(47,217,122,.12),transparent 60%),
    radial-gradient(1000px 520px at 95% 0%,rgba(77,163,255,.14),transparent 55%),
    radial-gradient(900px 500px at 50% 110%,rgba(167,139,250,.1),transparent 60%),
    #07090e;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#253042;border-radius:8px}
button,input,select{font-family:inherit}

#topSwitchBar{
  min-height:60px;
  background:rgba(11,15,23,.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding:10px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
}
.mode-tabs{display:flex;gap:6px;background:#090d14;padding:4px;border-radius:12px;border:1px solid var(--line)}
.mode-tab{padding:8px 16px;border-radius:9px;border:none;background:transparent;color:var(--mut);font-weight:800;font-size:12.5px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:7px}
.mode-tab.on{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.35)}

.push-sim{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.push-sim-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin-right:4px}
.sim-btn{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-size:11.5px;font-weight:700;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.sim-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.09)}
.sim-btn.gibdd{border-color:rgba(77,163,255,.4);color:#93c5fd;background:rgba(77,163,255,.1)}
.sim-btn.mvd{border-color:rgba(247,201,72,.4);color:#fde047;background:rgba(247,201,72,.1)}

#phoneAlertRoot{
  position:fixed;
  top:76px;
  right:24px;
  z-index:900;
  display:flex;
  flex-direction:column;
  gap:12px;
  width:380px;
  max-width:calc(100vw - 32px);
  pointer-events:none;
}
.ph-notif{
  pointer-events:auto;
  background:linear-gradient(155deg,rgba(22,29,44,.97),rgba(13,18,28,.98));
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  padding:16px 18px;
  box-shadow:0 24px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.12);
  animation:notifIn .35s cubic-bezier(.2,1,.3,1);
  position:relative;
  overflow:hidden;
}
@keyframes notifIn{from{opacity:0;transform:translateY(-20px) scale(.95)}}
.ph-notif.gibdd{border-left:4px solid #38bdf8}
.ph-notif.mvd{border-left:4px solid #f59e0b}
.pn-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.pn-sender{display:flex;align-items:center;gap:8px;font-weight:900;font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.pn-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.ph-notif.gibdd .pn-ic{background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.4)}
.ph-notif.gibdd .pn-sender{color:#7dd3fc}
.ph-notif.mvd .pn-ic{background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.4)}
.ph-notif.mvd .pn-sender{color:#fcd34d}
.pn-time{font-size:11px;color:var(--mut);font-weight:600}
.pn-close{background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:14px;padding:2px 6px}
.pn-title{font-weight:800;font-size:13.5px;color:#fff;margin-bottom:5px}
.pn-body{font-size:12.5px;line-height:1.5;color:#d1d9e8}
.pn-foot{margin-top:10px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
.pn-sum{font-weight:900;color:var(--red);font-size:13px}
.pn-act{color:var(--acc);font-weight:800;cursor:pointer;background:none;border:none;font-size:12px}
.pn-act:hover{text-decoration:underline}

#terminalWrap{max-width:1380px;margin:0 auto;padding:26px 24px 60px;display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.b-side{
  background:linear-gradient(165deg,rgba(20,27,42,.88),rgba(13,18,28,.94));
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px 16px;
  position:sticky;
  top:84px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}
.b-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.b-brand-ic{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#10b981,#047857);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 6px 20px rgba(16,185,129,.35)}
.b-brand b{font-size:15.5px;font-weight:900;letter-spacing:.4px;display:block}
.b-brand span{font-size:11px;color:var(--mut)}

.b-card-widget{
  background:linear-gradient(135deg,#1e293b 0%,#0f172a 55%,#1e1b4b 100%);
  border:1px solid rgba(148,163,184,.25);
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15);
}
.b-card-widget::after{content:'';position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(77,163,255,.25),transparent 70%)}
.bc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#94a3b8;font-weight:800}
.bc-owner{font-size:15px;font-weight:800;color:#fff;margin-top:3px}
.bc-acc{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);padding:5px 11px;border-radius:9px;margin-top:10px;font-family:monospace;font-size:13.5px;font-weight:800;color:#6ee7b7;cursor:pointer}
.bc-acc:hover{border-color:#6ee7b7}
.bc-bal-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#94a3b8;margin-top:14px;font-weight:700}
.bc-bal{font-size:23px;font-weight:900;color:#fff;margin-top:2px;letter-spacing:-.5px}
.bc-cash{font-size:11.5px;color:#94a3b8;margin-top:6px}
.bc-cash b{color:#fcd34d}

.b-nav{display:flex;flex-direction:column;gap:4px}
.b-ni{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;color:var(--mut);font-weight:700;font-size:13.5px;cursor:pointer;transition:.18s;border:1px solid transparent}
.b-ni:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.b-ni.on{color:#fff;background:linear-gradient(90deg,rgba(16,185,129,.22),rgba(16,185,129,.04));border-color:rgba(16,185,129,.4)}
.b-ni .bdg{margin-left:auto;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.45);color:#fca5a5;padding:1px 8px;border-radius:12px;font-size:11px;font-weight:800}

.b-main{min-width:0}
.b-panel{
  background:linear-gradient(160deg,rgba(22,29,44,.84),rgba(15,20,31,.9));
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 24px;
  margin-bottom:18px;
  box-shadow:0 14px 38px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
}
.b-h1{font-size:23px;font-weight:900;margin-bottom:4px}
.b-sub{font-size:13px;color:var(--mut);margin-bottom:18px}
.b-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.b-grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat-box{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat-box .v{font-size:24px;font-weight:900;margin-bottom:4px}
.stat-box .l{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:800}

.fine-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  background:rgba(15,23,42,.75);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:13px 16px;
  margin-bottom:14px;
}
.fine-item{
  display:flex;
  align-items:flex-start;
  gap:14px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px 18px;
  margin-bottom:10px;
  transition:.18s;
  cursor:pointer;
}
.fine-item:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.fine-item.checked{border-color:rgba(77,163,255,.55);background:rgba(77,163,255,.07)}
.fine-item input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:#3b82f6;cursor:pointer;flex:0 0 19px}
.fine-info{flex:1;min-width:0}
.fine-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.f-badge{padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.f-badge.cam{background:rgba(56,189,248,.14);color:#7dd3fc;border:1px solid rgba(56,189,248,.35)}
.f-badge.emp{background:rgba(245,158,11,.14);color:#fcd34d;border:1px solid rgba(245,158,11,.35)}
.fine-title{font-weight:800;font-size:14.5px;color:#fff}
.fine-meta{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.5}
.fine-meta b{color:#d1d9e8}
.fine-sum{font-size:16px;font-weight:900;color:var(--red);white-space:nowrap;text-align:right}

.prop-card{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.prop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prop-head b{font-size:15.5px;display:block}
.prop-head span{font-size:12px;color:var(--mut)}
.prop-days{padding:4px 10px;border-radius:9px;font-size:11.5px;font-weight:800;background:rgba(47,217,122,.14);color:#6ee7b7;border:1px solid rgba(47,217,122,.35);white-space:nowrap}
.prop-bar{height:8px;background:#1e293b;border-radius:6px;overflow:hidden}
.prop-bar>div{height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:6px}

.inp,.sel{background:#0b0f17;border:1px solid rgba(255,255,255,.12);color:var(--txt);padding:10px 14px;border-radius:11px;font-size:13.5px;outline:none;width:100%}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,163,255,.15)}
.flab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mut);font-weight:800;margin-bottom:6px}
.btn{background:linear-gradient(135deg,#10b981,#059669);border:1px solid rgba(110,231,183,.35);color:#fff;padding:10px 18px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;transition:.18s;box-shadow:0 6px 18px rgba(16,185,129,.28)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.blue{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:rgba(147,197,253,.35);box-shadow:0 6px 18px rgba(37,99,235,.28)}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.09)}
.btn.slim{padding:7px 12px;font-size:12px}

.tx-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.tx-row:last-child{border-bottom:none}
.tx-left{display:flex;align-items:center;gap:12px;min-width:0}
.tx-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 38px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tx-title{font-weight:800;font-size:13.5px;color:#fff}
.tx-sub{font-size:12px;color:var(--mut);margin-top:2px}
.tx-amt{font-weight:900;font-size:14.5px;white-space:nowrap;text-align:right}
.tx-amt.plus{color:var(--green)}
.tx-amt.minus{color:#f87171}

#phoneWrap{display:none;justify-content:center;align-items:center;padding:24px 14px 50px}
.smartphone{
  width:420px;
  max-width:100%;
  background:linear-gradient(160deg,#1e2636,#0b0f17);
  border:2px solid #334155;
  border-radius:48px;
  padding:12px;
  box-shadow:0 35px 95px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.15);
}
.sp-screen{
  background:radial-gradient(500px 280px at 50% -10%,rgba(16,185,129,.18),transparent 70%),#090d14;
  border-radius:38px;
  height:780px;
  max-height:calc(100vh - 110px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}
.sp-statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 8px;font-size:12px;font-weight:800;color:#cbd5e1}
.sp-body{flex:1;overflow-y:auto;padding:12px 18px 20px}
.sp-bottomnav{
  height:62px;
  background:rgba(13,18,28,.95);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:4px 6px;
}
.sp-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10px;font-weight:700;cursor:pointer;border-radius:10px}
.sp-tab i{font-style:normal;font-size:17px}
.sp-tab.on{color:#34d399}

#troot{position:fixed;left:24px;bottom:24px;z-index:950;display:flex;flex-direction:column;gap:8px}
.toast{background:#161f30;border:1px solid rgba(16,185,129,.45);border-left:4px solid var(--green);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.5)}

@media(max-width:960px){
  #terminalWrap{grid-template-columns:1fr}
  .b-side{position:static}
}
</style>
</head>

function fmt(n) { return Number(n || 0).toLocaleString('ru-RU'); }
function nowDate() {
  var d = new Date();
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.2026';
}
function nowTime() {
  var d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function toast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('troot').appendChild(t);
  setTimeout(function() { t.remove(); }, 3500);
}

window.toggleFine = function(idx, val) {
  if (FINES[idx]) FINES[idx].checked = !!val;
  renderAll();
};
window.toggleAllFines = function(val) {
  FINES.forEach(function(f) { f.checked = !!val; });
  renderAll();
};
window.paySelectedFines = function() {
  var sel = FINES.filter(function(f) { return f.checked; });
  if (!sel.length) { toast('Выберите хотя бы один штраф галочкой'); return; }
  var sum = sel.reduce(function(s, x) { return s + x.amount; }, 0);
  if (PLAYER.balance < sum) { toast('Недостаточно средств на счёте'); return; }
  PLAYER.balance -= sum;
  sel.forEach(function(f) {
    HISTORY.unshift({
      date: nowDate(), time: nowTime(), type: 'minus',
      title: 'Оплата штрафа (' + f.sender + ')',
      reason: f.reason + ' (' + f.article + ')' + (f.officer ? ' · выписал ' + f.officer : ' · камера'),
      amount: f.amount
    });
  });
  FINES = FINES.filter(function(f) { return !f.checked; });
  renderAll();
  toast('✓ Оплачено штрафов: ' + sel.length + ' шт. на сумму ' + fmt(sum) + ' ₽');
};
window.payAllFines = function() {
  FINES.forEach(function(f) { f.checked = true; });
  paySelectedFines();
};

window.topUpHousing = function(idx, days) {
  var p = PROPERTIES[idx]; if (!p) return;
  var maxDep = p.ratePerDay * p.maxDays;
  var cost = p.ratePerDay * days;
  if (p.deposit + cost > maxDep) cost = Math.max(0, maxDep - p.deposit);
  if (cost <= 0) { toast('Жильё уже оплачено на максимальные 30 дней'); return; }
  if (PLAYER.balance < cost) { toast('Недостаточно средств на банковском счёте'); return; }
  PLAYER.balance -= cost;
  p.deposit += cost;
  HISTORY.unshift({
    date: nowDate(), time: nowTime(), type: 'minus',
    title: 'Пополнение депозита ЖКХ (' + p.type + ')',
    reason: 'Оплата коммунальных услуг',
    amount: cost
  });
  renderAll();
  toast('✓ Депозит за жильё пополнен на ' + fmt(cost) + ' ₽');
};
window.topUpHousingMax = function(idx) { topUpHousing(idx, 30); };

window.doTransfer = function() {
  var acc = (document.getElementById('trAcc').value || '').trim();
  var amt = parseInt(document.getElementById('trAmt').value, 10) || 0;
  var rsn = (document.getElementById('trReason').value || '').trim();
  if (!/^\d{6}$/.test(acc)) { toast('Введите корректный 6-значный номер счёта (например: 123456)'); return; }
  if (acc === PLAYER.account) { toast('Нельзя перевести на собственный счёт'); return; }
  if (amt <= 0 || amt > PLAYER.balance) { toast('Некорректная сумма или недостаточно средств'); return; }
  if (!rsn) { toast('Укажите причину перевода'); return; }
  var recName = KNOWN_ACCOUNTS[acc] || ('Счёт №' + acc);
  PLAYER.balance -= amt;
  HISTORY.unshift({
    date: nowDate(), time: nowTime(), type: 'minus',
    title: 'Перевод на счёт №' + acc + (KNOWN_ACCOUNTS[acc] ? ' (' + KNOWN_ACCOUNTS[acc] + ')' : ''),
    reason: rsn,
    amount: amt
  });
  renderAll();
  toast('✓ Перевод ' + fmt(amt) + ' ₽ на счёт №' + acc + ' выполнен');
};

window.doCashOp = function(dir) {
  var amt = parseInt(document.getElementById('cashAmt').value, 10) || 0;
  if (amt <= 0) return;
  if (dir === 'in') {
    if (PLAYER.cash < amt) { toast('Недостаточно наличных на руках'); return; }
    PLAYER.cash -= amt; PLAYER.balance += amt;
    HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'plus', title: 'Пополнение банковского счёта №' + PLAYER.account, reason: 'Внесение наличных', amount: amt });
    toast('✓ Счёт пополнен на ' + fmt(amt) + ' ₽');
  } else {
    if (PLAYER.balance < amt) { toast('Недостаточно средств на счёте'); return; }
    PLAYER.balance -= amt; PLAYER.cash += amt;
    HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'minus', title: 'Снятие наличных со счёта №' + PLAYER.account, reason: 'Выдача наличных', amount: amt });
    toast('✓ Снято наличными: ' + fmt(amt) + ' ₽');
  }
  renderAll();
};

      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn slim" onclick="topUpDeposit(' + idx + ')">➕ Пополнить на 100 000 ₽</button>' +
        '<button class="btn ghost slim" onclick="closeDeposit(' + idx + ')">Забрать вклад с % на счёт</button>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="b-panel">' +
    '<div class="b-h1">📈 Банковские вклады и сбережения</div>' +
    '<div class="b-sub">Приумножайте средства на счёте №' + PLAYER.account + '</div>' +
    (list ? '<div class="b-grid2" style="margin-bottom:16px">' + list + '</div>' : '<div style="margin-bottom:16px;color:var(--mut)">Активных вкладов нет</div>') +
    '<button class="btn blue" onclick="openNewDeposit()">＋ Открыть новый вклад «Премиум 10%» (500 000 ₽)</button>' +
  '</div>';
}

window.topUpDeposit = function(idx) {
  var d = DEPOSITS[idx]; if (!d) return;
  if (PLAYER.balance < 100000) { toast('Недостаточно средств на счёте'); return; }
  PLAYER.balance -= 100000; d.amount += 100000;
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'minus', title: 'Пополнение вклада «' + d.name + '»', reason: 'Перевод со счёта №' + PLAYER.account, amount: 100000 });
  renderAll(); toast('✓ Вклад пополнен на 100 000 ₽');
};
window.closeDeposit = function(idx) {
  var d = DEPOSITS[idx]; if (!d) return;
  var total = d.amount + d.profit;
  PLAYER.balance += total;
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'plus', title: 'Закрытие вклада «' + d.name + '»', reason: 'Возврат тела вклада и начисленных процентов', amount: total });
  DEPOSITS.splice(idx, 1);
  renderAll(); toast('✓ На счёт зачислено ' + fmt(total) + ' ₽');
};
window.openNewDeposit = function() {
  if (PLAYER.balance < 500000) { toast('На счёте необходимо минимум 500 000 ₽'); return; }
  PLAYER.balance -= 500000;
  DEPOSITS.push({ id: 'd' + Date.now(), name: 'Вклад «Премиум»', rate: '10% годовых', amount: 500000, profit: 0, since: nowDate(), canTopUp: true });
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'minus', title: 'Открытие вклада «Премиум»', reason: 'Размещение средств под 10% годовых', amount: 500000 });
  renderAll(); toast('✓ Открыт новый вклад на 500 000 ₽');
};

function txRowHtml(tx) {
  var isPlus = tx.type === 'plus';
  return '<div class="tx-row">' +
    '<div class="tx-left">' +
      '<div class="tx-ic">' + (isPlus ? '📥' : '📤') + '</div>' +
      '<div>' +
        '<div class="tx-title">' + tx.title + '</div>' +
        '<div class="tx-sub">' + tx.date + ' в ' + tx.time + ' · Причина: <b>' + tx.reason + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="tx-amt ' + tx.type + '">' + (isPlus ? '+' : '−') + fmt(tx.amount) + ' ₽</div>' +
  '</div>';
}

function renderHistorySection() {
  return '<div class="b-panel">' +
    '<div class="b-h1">📜 История переводов, пополнений и оплат</div>' +
    '<div class="b-sub">Полная выписка по банковскому счёту <b>№ ' + PLAYER.account + ' (' + PLAYER.name + ')</b></div>' +
    HISTORY.map(txRowHtml).join('') +
  '</div>';
}

function renderAll() {
  document.getElementById('uiOwnerName').textContent = PLAYER.name;
  document.getElementById('uiAccNum').textContent = PLAYER.account;
  document.getElementById('uiBalance').textContent = fmt(PLAYER.balance) + ' ₽';
  document.getElementById('uiCash').textContent = fmt(PLAYER.cash) + ' ₽';

  document.getElementById('deskNav').innerHTML = NAV_ITEMS.map(function(it) {
    var bdg = (it[0] === 'fines' && FINES.length) ? '<span class="bdg">' + FINES.length + '</span>' : '';
    return '<div class="b-ni' + (CUR_TAB === it[0] ? ' on' : '') + '" onclick="goTab(\'' + it[0] + '\')"><span>' + it[1] + '</span><span>' + it[2] + '</span>' + bdg + '</div>';
  }).join('');

  var contentHtml = buildSectionHtml();
  document.getElementById('deskMain').innerHTML = contentHtml;

  var mobHeader = '<div class="b-card-widget" style="margin-bottom:14px">' +
    '<div class="bc-lbl">Провинция Банк Онлайн · ' + PLAYER.name + '</div>' +
    '<div class="bc-acc" onclick="copyAcc()">💳 Счёт № ' + PLAYER.account + ' 📋</div>' +
    '<div class="bc-bal" style="font-size:21px;margin-top:8px">' + fmt(PLAYER.balance) + ' ₽</div>' +
    '<div class="bc-cash">Наличные: <b>' + fmt(PLAYER.cash) + ' ₽</b></div>' +
  '</div>';
  document.getElementById('mobileMain').innerHTML = mobHeader + contentHtml;

  var mobTabs = [
    ['overview', '🏦', 'Главная'],
    ['fines',    '🚓', 'Штрафы' + (FINES.length ? ' (' + FINES.length + ')' : '')],
    ['housing',  '🏠', 'ЖКХ'],
    ['transfer', '💸', 'Перевод'],
    ['history',  '📜', 'История']
  ];
  document.getElementById('mobileNav').innerHTML = mobTabs.map(function(t) {
    return '<div class="sp-tab' + (CUR_TAB === t[0] ? ' on' : '') + '" onclick="goTab(\'' + t[0] + '\')"><i>' + t[1] + '</i><span>' + t[2] + '</span></div>';
  }).join('');
}

setViewMode(VIEW_MODE);
</script>
</body>
</html>
