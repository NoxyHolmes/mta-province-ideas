<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Банковская система · Провинция Банк</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090e;
  --bg2:#0d121b;
  --card:rgba(20,27,40,.82);
  --line:rgba(255,255,255,.08);
  --txt:#f2f6fc;
  --mut:#8b97ad;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
  --purple:#a78bfa;
  --gold:#f5c451;
}
html,body{color-scheme:dark;background:#07090e;color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
body{
  background:
    radial-gradient(1200px 550px at 10% -10%,rgba(47,217,122,.12),transparent 60%),
    radial-gradient(1000px 520px at 95% 0%,rgba(77,163,255,.14),transparent 55%),
    radial-gradient(900px 500px at 50% 110%,rgba(167,139,250,.1),transparent 60%),
    #07090e;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#253042;border-radius:8px}
button,input,select{font-family:inherit}

/* ================= БАНКОВСКАЯ СИСТЕМА (МЕНЮ В БАНКЕ) ================= */
#terminalWrap{max-width:1380px;margin:0 auto;padding:28px 24px 60px;display:grid;grid-template-columns:310px 1fr;gap:24px;align-items:start}
.b-side{
  background:linear-gradient(165deg,rgba(20,27,42,.88),rgba(13,18,28,.94));
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px 16px;
  position:sticky;
  top:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}
.b-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.b-brand-ic{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#10b981,#047857);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 6px 20px rgba(16,185,129,.35)}
.b-brand b{font-size:15.5px;font-weight:900;letter-spacing:.4px;display:block}
.b-brand span{font-size:11px;color:var(--mut)}

/* Пункт 6: Карточка счёта с 4 прямыми ячейками наверху (На счёте, Наличные, На вкладах, Штрафы) */
.b-card-widget{
  background:linear-gradient(145deg,#162032 0%,#0e1523 55%,#171836 100%);
  border:1px solid rgba(148,163,184,.24);
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  position:relative;
  box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);
}
.bc-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#94a3b8;font-weight:800;line-height:1.25}
.bc-owner{font-size:17px;font-weight:900;color:#ffffff;margin-top:5px;line-height:1.22}
.bc-acc{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(9,13,22,.75);
  border:1px solid rgba(255,255,255,.16);
  padding:6px 11px;
  border-radius:6px;
  font-family:monospace;
  font-size:13.5px;
  font-weight:800;
  color:#5eead4;
  cursor:pointer;
  white-space:nowrap;
}
.bc-acc:hover{border-color:#5eead4}

/* Прямые строгие ячейки 2x2 для всех 4 сумм */
.bc-sums-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.09);
}
.bc-sum-item{
  background:rgba(9,13,22,.65);
  border:1px solid rgba(255,255,255,.09);
  border-left:3px solid #34d399;
  border-radius:4px;
  padding:10px 11px;
  transition:border-color .15s,background .15s;
}
.bc-sum-item.cash-box{border-left-color:#fcd34d}
.bc-sum-item.dep-box{border-left-color:#60a5fa;cursor:pointer}
.bc-sum-item.fine-box{border-left-color:#ff5c5c;cursor:pointer}
.bc-sum-item.dep-box:hover,.bc-sum-item.fine-box:hover{background:rgba(255,255,255,.05)}
.bc-sum-item .s-l{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:#94a3b8;font-weight:800}
.bc-sum-item .s-v{font-size:14.5px;font-weight:900;color:#fff;margin-top:4px;white-space:nowrap}
.bc-sum-item .s-v.green{color:#34d399}
.bc-sum-item .s-v.gold{color:#fcd34d}
.bc-sum-item .s-v.blue{color:#93c5fd}
.bc-sum-item .s-v.red{color:#ff5c5c}

.b-nav{display:flex;flex-direction:column;gap:4px}
.b-ni{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:8px;color:var(--mut);font-weight:700;font-size:13.5px;cursor:pointer;transition:.18s;border:1px solid transparent}
.b-ni:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.b-ni.on{color:#fff;background:linear-gradient(90deg,rgba(16,185,129,.22),rgba(16,185,129,.04));border-color:rgba(16,185,129,.4)}
.b-ni .bdg{margin-left:auto;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.45);color:#fca5a5;padding:1px 8px;border-radius:8px;font-size:11px;font-weight:800}

.b-main{min-width:0}
.b-panel{
  background:linear-gradient(160deg,rgba(22,29,44,.84),rgba(15,20,31,.9));
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px 22px;
  margin-bottom:16px;
  box-shadow:0 14px 38px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
}
.b-h1{font-size:20px;font-weight:900;margin-bottom:4px}
.b-sub{font-size:12.5px;color:var(--mut);margin-bottom:16px;line-height:1.45}
.b-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

.fine-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  background:rgba(15,23,42,.75);
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:12px;
}
.fine-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px 16px;
  margin-bottom:10px;
  transition:.18s;
  cursor:pointer;
}
.fine-item:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.fine-item.checked{border-color:rgba(77,163,255,.55);background:rgba(77,163,255,.08)}
.fine-item.focus-pulse{border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.35)}
.fine-item input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:#3b82f6;cursor:pointer;flex:0 0 18px}
.fine-info{flex:1;min-width:0}
.fine-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.f-badge{padding:3px 8px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.f-badge.cam{background:rgba(56,189,248,.14);color:#7dd3fc;border:1px solid rgba(56,189,248,.35)}
.f-badge.emp{background:rgba(245,158,11,.14);color:#fcd34d;border:1px solid rgba(245,158,11,.35)}
.fine-title{font-weight:800;font-size:13.5px;color:#fff}
.fine-meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.45}
.fine-meta b{color:#d1d9e8}
.fine-sum{font-size:15px;font-weight:900;color:var(--red);white-space:nowrap;text-align:right}

.prop-card{background:rgba(15,21,34,.85);border:1px solid rgba(255,255,255,.1);border-top:3px solid var(--acc);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.prop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prop-head b{font-size:15px;display:block;color:#fff}
.prop-head span{font-size:11.5px;color:var(--mut);margin-top:2px;display:block}
.prop-days{padding:4px 9px;border-radius:5px;font-size:11px;font-weight:800;background:rgba(47,217,122,.14);color:#6ee7b7;border:1px solid rgba(47,217,122,.35);white-space:nowrap}
.prop-bar{height:8px;background:#1e293b;border-radius:4px;overflow:hidden}
.prop-bar>div{height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:4px}

/* Карточки 4 тарифов вкладов (Пункт 10) */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px;margin-top:12px}
.plan-card{
  background:linear-gradient(160deg,rgba(20,28,44,.95),rgba(12,17,27,.98));
  border:1px solid rgba(255,255,255,.1);
  border-top:3px solid var(--pc,#3b82f6);
  border-radius:8px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.plan-name{font-weight:900;font-size:15px;color:#fff}
.plan-rate{font-weight:900;font-size:13px;padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--pc,#60a5fa);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
.plan-rules{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:#cbd5e1;background:rgba(0,0,0,.28);padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,.05)}
.plan-rules span{display:flex;justify-content:space-between;gap:8px}
.plan-rules b{color:#fff}

.inp,.sel{background:#0b0f17;border:1px solid rgba(255,255,255,.14);color:var(--txt);padding:10px 13px;border-radius:6px;font-size:13.5px;outline:none;width:100%}
.inp:focus,.sel:focus{border-color:var(--acc)}
.flab{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mut);font-weight:800;margin-bottom:6px}
.btn{background:linear-gradient(135deg,#10b981,#059669);border:1px solid rgba(110,231,183,.35);color:#fff;padding:9px 15px;border-radius:7px;font-weight:800;font-size:12.5px;cursor:pointer;transition:.18s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.blue{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:rgba(147,197,253,.35)}
.btn.warn{background:linear-gradient(135deg,#dc2626,#991b1b);border-color:rgba(252,165,165,.35)}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{background:rgba(255,255,255,.09)}
.btn.slim{padding:7px 11px;font-size:11.5px}

.tx-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.tx-row:last-child{border-bottom:none}
.tx-left{display:flex;align-items:center;gap:11px;min-width:0}
.tx-ic{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 36px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tx-title{font-weight:800;font-size:13px;color:#fff}
.tx-sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.tx-amt{font-weight:900;font-size:14px;white-space:nowrap;text-align:right}
.tx-amt.plus{color:var(--green)}
.tx-amt.minus{color:#f87171}

/* ================= МОБИЛЬНОЕ ПРИЛОЖЕНИЕ В СМАРТФОНЕ ================= */
#phoneWrap{display:none;justify-content:center;align-items:center;padding:18px 14px;min-height:100vh}
.smartphone{
  width:420px;
  max-width:100%;
  background:linear-gradient(160deg,#1e2636,#0b0f17);
  border:2px solid #334155;
  border-radius:46px;
  padding:12px;
  box-shadow:0 35px 95px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.15);
}
.sp-screen{
  background:radial-gradient(500px 280px at 50% -10%,rgba(16,185,129,.18),transparent 70%),#090d14;
  border-radius:36px;
  height:760px;
  max-height:calc(100vh - 60px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}
.sp-statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 6px;font-size:12px;font-weight:800;color:#cbd5e1}
.sp-body{flex:1;overflow-y:auto;padding:10px 16px 16px}

.sp-menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}
.sp-mbtn{
  background:rgba(22,30,46,.9);
  border:1px solid rgba(255,255,255,.09);
  border-radius:6px;
  padding:10px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#94a3b8;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:all .18s;
  text-align:center;
  position:relative;
}
.sp-mbtn i{font-style:normal;font-size:17px}
.sp-mbtn:hover{border-color:rgba(255,255,255,.22);color:#fff}
.sp-mbtn.on{
  background:linear-gradient(145deg,rgba(16,185,129,.24),rgba(16,185,129,.08));
  border-color:rgba(52,211,153,.55);
  color:#ffffff;
}
.sp-mbtn .m-bdg{
  position:absolute;
  top:4px;
  right:5px;
  background:#ef4444;
  color:#fff;
  font-size:9.5px;
  font-weight:900;
  padding:1px 5px;
  border-radius:4px;
}

.sp-home-wrap{
  padding:8px 0 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  background:rgba(9,13,20,.95);
  border-top:1px solid rgba(255,255,255,.05);
}
.sp-home-bar{
  width:134px;
  height:5px;
  border-radius:4px;
  background:#3b475c;
  transition:background .18s,transform .18s;
}
.sp-home-wrap:hover .sp-home-bar{background:#6ee7b7;transform:scaleX(1.08)}

#troot{position:fixed;left:24px;bottom:24px;z-index:950;display:flex;flex-direction:column;gap:8px}
.toast{background:#161f30;border:1px solid rgba(16,185,129,.45);border-left:4px solid var(--green);padding:12px 16px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.5)}

@media(max-width:960px){
  #terminalWrap{grid-template-columns:1fr}
  .b-side{position:static}
}
</style>
</head>

      '</div>' +

window.toggleFine = function(idx, val) {

window.paySelectedFines = function() {
  var sel = FINES.filter(function(f) { return f.checked; });
  if (!sel.length) { toast('Выберите хотя бы один штраф галочкой'); return; }
  var sum = sel.reduce(function(s, x) { return s + x.amount; }, 0);
  if (PLAYER.balance < sum) { toast('Недостаточно средств на счёте'); return; }
  PLAYER.balance -= sum;
  sel.forEach(function(f) {
    HISTORY.unshift({
      date: nowDate(), time: nowTime(), type: 'minus',
      title: 'Оплата штрафа (' + f.sender + ')',
      reason: f.reason + ' (' + f.article + ')',
      amount: f.amount
    });
  });
  FINES = FINES.filter(function(f) { return !f.checked; });
  TARGET_FINE_ID = '';
  renderAll();
  toast('✓ Оплачено штрафов: ' + sel.length + ' шт. на сумму ' + fmt(sum) + ' ₽');
};
window.payAllFines = function() {
  FINES.forEach(function(f) { f.checked = true; });

};

window.topUpHousing = function(idx, days) {
  var p = PROPERTIES[idx]; if (!p) return;
  var maxDep = p.ratePerDay * p.maxDays;
  var cost = p.ratePerDay * days;
  if (p.deposit + cost > maxDep) cost = Math.max(0, maxDep - p.deposit);
  if (cost <= 0) { toast('Жильё уже оплачено на 30 дней'); return; }
  if (PLAYER.balance < cost) { toast('Недостаточно средств на счёте'); return; }
  PLAYER.balance -= cost;
  p.deposit += cost;
  HISTORY.unshift({
    date: nowDate(), time: nowTime(), type: 'minus',
    title: 'Пополнение депозита ЖКХ (' + p.type + ')',
    reason: 'Оплата коммунальных услуг',
    amount: cost
  });
  renderAll();
  toast('✓ Депозит ЖКХ пополнен на ' + fmt(cost) + ' ₽');
};
window.topUpHousingMax = function(idx) { topUpHousing(idx, 30); };

window.doTransfer = function() {
  var acc = (document.getElementById('trAcc').value || '').trim();
  var amt = parseInt(document.getElementById('trAmt').value, 10) || 0;
  var rsn = (document.getElementById('trReason').value || '').trim();
  if (!/^\d{6}$/.test(acc)) { toast('Введите 6-значный номер счёта (например: 123456)'); return; }
  if (acc === PLAYER.account) { toast('Нельзя перевести на собственный счёт'); return; }
  if (amt <= 0 || amt > PLAYER.balance) { toast('Некорректная сумма или недостаточно средств'); return; }
  if (!rsn) { toast('Укажите причину перевода'); return; }
  PLAYER.balance -= amt;
  HISTORY.unshift({
    date: nowDate(), time: nowTime(), type: 'minus',
    title: 'Перевод на счёт №' + acc + (KNOWN_ACCOUNTS[acc] ? ' (' + KNOWN_ACCOUNTS[acc] + ')' : ''),
    reason: rsn,
    amount: amt
  });
  renderAll();
  toast('✓ Перевод ' + fmt(amt) + ' ₽ на счёт №' + acc + ' выполнен');
};

window.doCashOp = function(dir) {
  var amt = parseInt(document.getElementById('cashAmt').value, 10) || 0;
  if (amt <= 0) return;
  if (dir === 'in') {
    if (PLAYER.cash < amt) { toast('Недостаточно наличных на руках'); return; }
    PLAYER.cash -= amt; PLAYER.balance += amt;
    HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'plus', title: 'Пополнение банковского счёта №' + PLAYER.account, reason: 'Внесение наличных', amount: amt });
    toast('✓ Счёт пополнен на ' + fmt(amt) + ' ₽');
  } else {
    if (PLAYER.balance < amt) { toast('Недостаточно средств на счёте'); return; }
    PLAYER.balance -= amt; PLAYER.cash += amt;
    HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'minus', title: 'Снятие наличных со счёта №' + PLAYER.account, reason: 'Выдача наличных', amount: amt });
    toast('✓ Снято наличными: ' + fmt(amt) + ' ₽');
  }
  renderAll();
};

      '<div><div class="b-h1">📈 Мои активные вклады (' + DEPOSITS.length + ')</div><div class="b-sub" style="margin-bottom:0">Начисление процентов каждые сутки в 00:00 или каждый PayDay (час)</div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        '<button class="btn blue slim" onclick="simTick(\'payday\')">⏰ Симулировать PayDay (+1 час)</button>' +
        '<button class="btn ghost slim" onclick="simTick(\'midnight\')">🌙 Симулировать Полночь (00:00)</button>' +
      '</div>' +
    '</div>' +
    (activeHtml ? '<div class="b-grid2">' + activeHtml + '</div>' : '<div style="color:var(--mut);padding:14px 0">У вас пока нет активных вкладов</div>') +
  '</div>' +
  '<div class="b-panel">' +
    '<div class="b-h1">🏦 Доступные программы накопительных вкладов (4 тарифа)</div>' +
    '<div class="b-sub">Выберите подходящие условия: от свободного суточного вклада до максимального под 0.20% в час</div>' +
    '<div class="plan-grid">' + catalogHtml + '</div>' +
  '</div>';
}

window.simTick = function(kind) {
  var totalAdded = 0;
  DEPOSITS.forEach(function(d) {
    var pl = getPlan(d.planKey);
    if (kind === 'payday') {
      d.hoursPassed = (d.hoursPassed || 0) + 1;
      if (pl.periodType === 'payday') {
        var gain = Math.round((d.amount + d.profit) * (pl.ratePct / 100));
        d.profit += gain;
        totalAdded += gain;
      }
    } else if (kind === 'midnight') {
      d.hoursPassed = (d.hoursPassed || 0) + 24;
      if (pl.periodType === 'midnight') {
        var gain2 = Math.round((d.amount + d.profit) * (pl.ratePct / 100));
        d.profit += gain2;
        totalAdded += gain2;
      }
    }
  });
  renderAll();
  toast(kind === 'payday'
    ? ('⏰ Наступил PayDay! Начислено по почасовым вкладам: +' + fmt(totalAdded) + ' ₽')
    : ('🌙 Полночь (00:00)! Начислено 0.50% по суточным вкладам: +' + fmt(totalAdded) + ' ₽'));
};

window.openPlanDeposit = function(planKey) {
  var pl = getPlan(planKey);
  var inp = document.getElementById('openAmt_' + planKey);
  var amt = parseInt(inp ? inp.value : pl.minAmt, 10) || 0;
  if (amt < pl.minAmt || amt > pl.maxAmt) {
    toast('По тарифу «' + pl.name + '» допустима сумма от ' + fmt(pl.minAmt) + ' до ' + fmt(pl.maxAmt) + ' ₽');
    return;
  }
  if (PLAYER.balance < amt) {
    toast('Недостаточно средств на банковском счёте');
    return;
  }
  PLAYER.balance -= amt;
  DEPOSITS.unshift({
    id: 'd' + Date.now(),
    planKey: planKey,
    amount: amt,
    profit: 0,
    hoursPassed: 0,
    since: nowDate()
  });
  HISTORY.unshift({
    date: nowDate(), time: nowTime(), type: 'minus',
    title: 'Открытие вклада «' + pl.name + '» (' + pl.ratePct.toFixed(2) + '%)',
    reason: pl.periodLbl,
    amount: amt
  });
  renderAll();
  toast('✓ Открыт ' + pl.name + ' на сумму ' + fmt(amt) + ' ₽');
};

window.topUpDeposit = function(idx) {
  var d = DEPOSITS[idx]; if (!d) return;
  var pl = getPlan(d.planKey);
  if (!pl.canTopUp) { toast('Этот вклад непополняемый'); return; }
  var add = 200000;
  if (d.amount + add > pl.maxAmt) { toast('Превышен максимальный лимит вклада (' + fmt(pl.maxAmt) + ' ₽)'); return; }
  if (PLAYER.balance < add) { toast('Недостаточно средств на счёте'); return; }
  PLAYER.balance -= add;
  d.amount += add;
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'minus', title: 'Пополнение вклада «' + pl.name + '»', reason: 'Пополнение со счёта №' + PLAYER.account, amount: add });
  renderAll();
  toast('✓ Вклад пополнен на ' + fmt(add) + ' ₽');
};

window.withdrawDeposit = function(idx) {
  var d = DEPOSITS[idx]; if (!d) return;
  var pl = getPlan(d.planKey);
  if (!pl.canWithdraw) { toast('Частичное снятие по этому вкладу запрещено'); return; }
  var take = 100000;
  if (d.amount - take < pl.minAmt) { toast('Нельзя снизить остаток ниже минимальной суммы (' + fmt(pl.minAmt) + ' ₽)'); return; }
  d.amount -= take;
  PLAYER.balance += take;
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'plus', title: 'Частичное снятие с вклада «' + pl.name + '»', reason: 'Перевод на счёт №' + PLAYER.account, amount: take });
  renderAll();
  toast('✓ С вклада снято ' + fmt(take) + ' ₽ на ваш счёт');
};

window.closeDeposit = function(idx) {
  var d = DEPOSITS[idx]; if (!d) return;
  var pl = getPlan(d.planKey);
  var lockLeft = Math.max(0, pl.minHours - (d.hoursPassed || 0));
  if (!pl.canCloseAnytime && lockLeft > 0) {
    toast('Этот вклад нельзя закрыть до истечения срока (осталось ' + lockLeft + ' ч.)');
    return;
  }
  var total = d.amount + d.profit;
  PLAYER.balance += total;
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'plus', title: 'Закрытие вклада «' + pl.name + '»', reason: 'Возврат тела вклада и процентов', amount: total });
  DEPOSITS.splice(idx, 1);
  renderAll();
  toast('✓ Вклад закрыт! На счёт зачислено ' + fmt(total) + ' ₽');
};

function txRowHtml(tx) {
  var isPlus = tx.type === 'plus';
  return '<div class="tx-row">' +
    '<div class="tx-left">' +
      '<div class="tx-ic">' + (isPlus ? '📥' : '📤') + '</div>' +
      '<div>' +
        '<div class="tx-title">' + tx.title + '</div>' +
        '<div class="tx-sub">' + tx.date + ' в ' + tx.time + ' · Причина: <b>' + tx.reason + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="tx-amt ' + tx.type + '">' + (isPlus ? '+' : '−') + fmt(tx.amount) + ' ₽</div>' +
  '</div>';
}

function renderHistorySection() {
  return '<div class="b-panel">' +
    '<div class="b-h1">📜 История переводов и пополнений</div>' +
    '<div class="b-sub">Выписка по счёту <b>№ ' + PLAYER.account + ' (' + PLAYER.name + ')</b></div>' +
    HISTORY.map(txRowHtml).join('') +
  '</div>';
}

function renderAll() {
  document.getElementById('terminalWrap').style.display = (VIEW_MODE === 'terminal') ? 'grid' : 'none';
  document.getElementById('phoneWrap').style.display = (VIEW_MODE === 'phone') ? 'flex' : 'none';

  var cardHtml = buildAccountWidgetHtml();
  document.getElementById('deskCardWidget').innerHTML = cardHtml;

  document.getElementById('deskNav').innerHTML = NAV_ITEMS.map(function(it) {
    var bdg = (it[0] === 'fines' && FINES.length) ? '<span class="bdg">' + FINES.length + '</span>' : '';
    return '<div class="b-ni' + (CUR_TAB === it[0] ? ' on' : '') + '" onclick="goTab(\'' + it[0] + '\')"><span>' + it[1] + '</span><span>' + it[2] + '</span>' + bdg + '</div>';
  }).join('');

  var contentHtml = buildSectionHtml();
  document.getElementById('deskMain').innerHTML = contentHtml;

  var mobMenuGrid = '<div class="sp-menu-grid">' + NAV_ITEMS.map(function(t) {
    var bdg = (t[0] === 'fines' && FINES.length) ? '<span class="m-bdg">' + FINES.length + '</span>' : '';
    return '<div class="sp-mbtn' + (CUR_TAB === t[0] ? ' on' : '') + '" onclick="goTab(\'' + t[0] + '\')">' + bdg + '<i>' + t[1] + '</i><span>' + t[2] + '</span></div>';
  }).join('') + '</div>';

  document.getElementById('mobileMain').innerHTML = cardHtml + mobMenuGrid + contentHtml;
}

renderAll();
</script>
</body>
</html>
