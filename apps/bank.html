<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Банковская система · Провинция Банк</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090e;
  --bg2:#0d121b;
  --card:rgba(20,27,40,.82);
  --line:rgba(255,255,255,.08);
  --txt:#f2f6fc;
  --mut:#8b97ad;
  --acc:#4da3ff;
  --green:#2fd97a;
  --yellow:#f7c948;
  --red:#ff5c5c;
  --purple:#a78bfa;
  --gold:#f5c451;
}
html,body{color-scheme:dark;background:#07090e;color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
body{
  background:
    radial-gradient(1200px 550px at 10% -10%,rgba(47,217,122,.12),transparent 60%),
    radial-gradient(1000px 520px at 95% 0%,rgba(77,163,255,.14),transparent 55%),
    radial-gradient(900px 500px at 50% 110%,rgba(167,139,250,.1),transparent 60%),
    #07090e;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#253042;border-radius:8px}
button,input,select{font-family:inherit}

/* ================= БАНКОВСКАЯ СИСТЕМА (МЕНЮ В БАНКЕ) ================= */
#terminalWrap{max-width:1380px;margin:0 auto;padding:28px 24px 60px;display:grid;grid-template-columns:295px 1fr;gap:24px;align-items:start}
.b-side{
  background:linear-gradient(165deg,rgba(20,27,42,.88),rgba(13,18,28,.94));
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px 16px;
  position:sticky;
  top:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}
.b-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.b-brand-ic{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#10b981,#047857);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 6px 20px rgba(16,185,129,.35)}
.b-brand b{font-size:15.5px;font-weight:900;letter-spacing:.4px;display:block}
.b-brand span{font-size:11px;color:var(--mut)}

/* Виджет счёта в точном стиле вашего скриншота */
.b-card-widget{
  background:linear-gradient(145deg,#182235 0%,#0f1625 55%,#1b1a3c 100%);
  border:1px solid rgba(148,163,184,.22);
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);
}
.bc-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bc-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:#94a3b8;font-weight:800;line-height:1.25}
.bc-owner{font-size:17px;font-weight:900;color:#ffffff;margin-top:6px;line-height:1.25}
.bc-acc{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(9,13,22,.65);
  border:1px solid rgba(255,255,255,.14);
  padding:7px 12px;
  border-radius:11px;
  font-family:monospace;
  font-size:13.5px;
  font-weight:800;
  color:#5eead4;
  cursor:pointer;
  white-space:nowrap;
  transition:border-color .15s;
}
.bc-acc:hover{border-color:#5eead4}

.bc-sums-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.08);
}
.bc-sum-item{
  background:rgba(9,13,22,.5);
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  padding:11px 13px;
}
.bc-sum-item .s-l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:800}
.bc-sum-item .s-v{font-size:16px;font-weight:900;color:#fff;margin-top:4px;white-space:nowrap}
.bc-sum-item .s-v.green{color:#34d399}
.bc-sum-item .s-v.gold{color:#fcd34d}

.b-nav{display:flex;flex-direction:column;gap:4px}
.b-ni{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;color:var(--mut);font-weight:700;font-size:13.5px;cursor:pointer;transition:.18s;border:1px solid transparent}
.b-ni:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.b-ni.on{color:#fff;background:linear-gradient(90deg,rgba(16,185,129,.22),rgba(16,185,129,.04));border-color:rgba(16,185,129,.4)}
.b-ni .bdg{margin-left:auto;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.45);color:#fca5a5;padding:1px 8px;border-radius:12px;font-size:11px;font-weight:800}

.b-main{min-width:0}
.b-panel{
  background:linear-gradient(160deg,rgba(22,29,44,.84),rgba(15,20,31,.9));
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px 22px;
  margin-bottom:16px;
  box-shadow:0 14px 38px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
}
.b-h1{font-size:21px;font-weight:900;margin-bottom:4px}
.b-sub{font-size:12.5px;color:var(--mut);margin-bottom:16px;line-height:1.45}
.b-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.b-grid-sums{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.stat-box .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800}
.stat-box .v{font-size:18px;font-weight:900;margin-top:4px}

.fine-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  background:rgba(15,23,42,.75);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:12px;
}
.fine-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:10px;
  transition:.18s;
  cursor:pointer;
}
.fine-item:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.fine-item.checked{border-color:rgba(77,163,255,.55);background:rgba(77,163,255,.08)}
.fine-item.focus-pulse{border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.35)}
.fine-item input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:#3b82f6;cursor:pointer;flex:0 0 18px}
.fine-info{flex:1;min-width:0}
.fine-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.f-badge{padding:3px 8px;border-radius:7px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.f-badge.cam{background:rgba(56,189,248,.14);color:#7dd3fc;border:1px solid rgba(56,189,248,.35)}
.f-badge.emp{background:rgba(245,158,11,.14);color:#fcd34d;border:1px solid rgba(245,158,11,.35)}
.fine-title{font-weight:800;font-size:13.5px;color:#fff}
.fine-meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.45}
.fine-meta b{color:#d1d9e8}
.fine-sum{font-size:15px;font-weight:900;color:var(--red);white-space:nowrap;text-align:right}

.prop-card{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:11px}
.prop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prop-head b{font-size:15px;display:block}
.prop-head span{font-size:11.5px;color:var(--mut)}
.prop-days{padding:4px 9px;border-radius:9px;font-size:11px;font-weight:800;background:rgba(47,217,122,.14);color:#6ee7b7;border:1px solid rgba(47,217,122,.35);white-space:nowrap}
.prop-bar{height:8px;background:#1e293b;border-radius:6px;overflow:hidden}
.prop-bar>div{height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:6px}

.inp,.sel{background:#0b0f17;border:1px solid rgba(255,255,255,.12);color:var(--txt);padding:10px 13px;border-radius:11px;font-size:13.5px;outline:none;width:100%}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,163,255,.15)}
.flab{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mut);font-weight:800;margin-bottom:6px}
.btn{background:linear-gradient(135deg,#10b981,#059669);border:1px solid rgba(110,231,183,.35);color:#fff;padding:9px 16px;border-radius:11px;font-weight:800;font-size:12.5px;cursor:pointer;transition:.18s;box-shadow:0 6px 18px rgba(16,185,129,.28)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.blue{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:rgba(147,197,253,.35);box-shadow:0 6px 18px rgba(37,99,235,.28)}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.09)}
.btn.slim{padding:7px 12px;font-size:11.5px}

.tx-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.tx-row:last-child{border-bottom:none}
.tx-left{display:flex;align-items:center;gap:11px;min-width:0}
.tx-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 36px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tx-title{font-weight:800;font-size:13px;color:#fff}
.tx-sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.tx-amt{font-weight:900;font-size:14px;white-space:nowrap;text-align:right}
.tx-amt.plus{color:var(--green)}
.tx-amt.minus{color:#f87171}

/* ================= МОБИЛЬНОЕ ПРИЛОЖЕНИЕ В СМАРТФОНЕ ================= */
#phoneWrap{display:none;justify-content:center;align-items:center;padding:18px 14px;min-height:100vh}
.smartphone{
  width:415px;
  max-width:100%;
  background:linear-gradient(160deg,#1e2636,#0b0f17);
  border:2px solid #334155;
  border-radius:46px;
  padding:12px;
  box-shadow:0 35px 95px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.15);
}
.sp-screen{
  background:radial-gradient(500px 280px at 50% -10%,rgba(16,185,129,.18),transparent 70%),#090d14;
  border-radius:36px;
  height:760px;
  max-height:calc(100vh - 60px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}
.sp-statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 6px;font-size:12px;font-weight:800;color:#cbd5e1}
.sp-body{flex:1;overflow-y:auto;padding:10px 16px 16px}

/* Удобная сетка кнопок меню 3x2 прямо под карточкой счёта (на видном месте без прокрутки!) */
.sp-menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}
.sp-mbtn{
  background:rgba(22,30,46,.9);
  border:1px solid rgba(255,255,255,.08);
  border-radius:13px;
  padding:10px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#94a3b8;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:all .18s;
  text-align:center;
  position:relative;
}
.sp-mbtn i{font-style:normal;font-size:18px}
.sp-mbtn:hover{border-color:rgba(255,255,255,.22);color:#fff}
.sp-mbtn.on{
  background:linear-gradient(145deg,rgba(16,185,129,.24),rgba(16,185,129,.08));
  border-color:rgba(52,211,153,.55);
  color:#ffffff;
  box-shadow:0 6px 16px rgba(16,185,129,.2);
}
.sp-mbtn .m-bdg{
  position:absolute;
  top:5px;
  right:6px;
  background:#ef4444;
  color:#fff;
  font-size:9.5px;
  font-weight:900;
  padding:1px 5px;
  border-radius:8px;
}

.sp-home-wrap{
  padding:8px 0 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  background:rgba(9,13,20,.95);
  border-top:1px solid rgba(255,255,255,.05);
}
.sp-home-bar{
  width:134px;
  height:5px;
  border-radius:4px;
  background:#3b475c;
  transition:background .18s,transform .18s;
}
.sp-home-wrap:hover .sp-home-bar{background:#6ee7b7;transform:scaleX(1.08)}

#troot{position:fixed;left:24px;bottom:24px;z-index:950;display:flex;flex-direction:column;gap:8px}
.toast{background:#161f30;border:1px solid rgba(16,185,129,.45);border-left:4px solid var(--green);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.5)}

@media(max-width:960px){
  #terminalWrap{grid-template-columns:1fr}
  .b-side{position:static}
}
</style>
</head>

/* Пункт 9: «ЖКХ и жильё» заменено на «ЖКХ» */
var NAV_ITEMS = [
  ['overview', '📊', 'Главная'],
  ['fines',    '🚓', 'Оплата штрафов'],
  ['housing',  '🏠', 'ЖКХ'],
  ['transfer', '💸', 'Переводы'],
  ['deposits', '📈', 'Вклады'],
  ['history',  '📜', 'История']
];

function goTab(t) {
  CUR_TAB = t;
  renderAll();
}

function buildSectionHtml() {
  if (CUR_TAB === 'fines') return renderFinesSection();
  if (CUR_TAB === 'housing') return renderHousingSection();
  if (CUR_TAB === 'transfer') return renderTransferSection();
  if (CUR_TAB === 'deposits') return renderDepositsSection();
  if (CUR_TAB === 'history') return renderHistorySection();
  return renderOverviewSection();
}

/* Пункт 8: Убран дубляж баланса на счёте и наличных (они уже красиво показаны в карточке счёта!) */
function renderOverviewSection() {
  var totalFines = FINES.reduce(function(s, x) { return s + x.amount; }, 0);
  var totalDeps = DEPOSITS.reduce(function(s, x) { return s + x.amount; }, 0);
  return '<div class="b-panel">' +
    '<div class="b-h1">Управление счётом № ' + PLAYER.account + '</div>' +
    '<div class="b-sub">Быстрый обзор вкладов, задолженностей и последних операций</div>' +
    '<div class="b-grid-sums">' +
      '<div class="stat-box" style="cursor:pointer" onclick="goTab(\'deposits\')"><div class="l">Сумма на вкладах →</div><div class="v" style="color:#93c5fd">' + fmt(totalDeps) + ' ₽</div></div>' +
      '<div class="stat-box" style="cursor:pointer" onclick="goTab(\'fines\')"><div class="l">Неоплаченные штрафы (' + FINES.length + ' шт.) →</div><div class="v" style="color:' + (FINES.length ? 'var(--red)' : 'var(--green)') + '">' + fmt(totalFines) + ' ₽</div></div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" onclick="goTab(\'transfer\')">💸 Перевод по номеру счёта</button>' +
      '<button class="btn blue" onclick="goTab(\'housing\')">🏠 Оплата ЖКХ</button>' +
      '<button class="btn ghost" onclick="goTab(\'fines\')">🚓 Оплата штрафов (' + FINES.length + ')</button>' +
    '</div>' +
  '</div>' +
  '<div class="b-panel">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<b style="font-size:15px">Последние операции</b>' +
      '<button class="btn ghost slim" onclick="goTab(\'history\')">Все →</button>' +
    '</div>' +
    HISTORY.slice(0, 5).map(txRowHtml).join('') +
  '</div>';
}

function renderFinesSection() {
  if (!FINES.length) {
    return '<div class="b-panel"><div class="b-h1">🚓 Оплата штрафов</div><div class="b-sub">Все штрафы погашены</div><div style="padding:30px;text-align:center;color:var(--green);font-weight:800">✅ У вас нет неоплаченных штрафов!</div></div>';
  }
  var selCount = 0, selSum = 0, allSum = 0;
  FINES.forEach(function(f) {
    allSum += f.amount;
    if (f.checked) { selCount++; selSum += f.amount; }
  });
  var allChecked = (selCount === FINES.length);

  var listHtml = FINES.map(function(f, idx) {
    var isTarget = (TARGET_FINE_ID && f.id === TARGET_FINE_ID);
    var badge = f.kind === 'cam'
      ? '<span class="f-badge cam">📷 [ГИБДД] Камера контроля движения</span>'
      : '<span class="f-badge emp">👮 ' + f.sender + '</span>';
    var details = f.kind === 'cam'
      ? 'Дата: <b>' + f.date + ' в ' + f.time + '</b> · Статус: <b>Автофиксация городской камерой</b> · ТС: <b>' + f.car + '</b> · Статья: <b>' + f.article + '</b>'
      : 'Дата: <b>' + f.date + ' в ' + f.time + '</b> · Статья: <b>' + f.article + '</b><br>Выписал: <b>' + f.officer + '</b> · Подразделение: <b>' + f.faction + '</b>' + (f.car ? ' · ТС: <b>' + f.car + '</b>' : '');
    return '<label class="fine-item' + (f.checked ? ' checked' : '') + (isTarget ? ' focus-pulse' : '') + '">' +
      '<input type="checkbox" ' + (f.checked ? 'checked' : '') + ' onchange="toggleFine(' + idx + ',this.checked)">' +
      '<div class="fine-info">' +
        '<div class="fine-top">' + badge + '</div>' +
        '<div class="fine-title">' + f.reason + '</div>' +
        '<div class="fine-meta">' + details + '</div>' +
      '</div>' +
      '<div class="fine-sum">' + fmt(f.amount) + ' ₽</div>' +
    '</label>';
  }).join('');

  return '<div class="b-panel">' +
    '<div class="b-h1">🚓 Оплата штрафов</div>' +
    '<div class="b-sub">Отметьте галочками штрафы, которые хотите оплатить сейчас, либо оплатите все сразу</div>' +
    '<div class="fine-bar">' +
      '<label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:800;font-size:12.5px">' +
        '<input type="checkbox" style="width:17px;height:17px;accent-color:#3b82f6" ' + (allChecked ? 'checked' : '') + ' onchange="toggleAllFines(this.checked)">' +
        '<span>Выбрать все (' + FINES.length + ' шт. · ' + fmt(allSum) + ' ₽)</span>' +
      '</label>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn blue slim" onclick="paySelectedFines()" ' + (!selCount ? 'disabled style="opacity:.45"' : '') + '>✓ Оплатить выбранные (' + fmt(selSum) + ' ₽)</button>' +
        '<button class="btn slim" onclick="payAllFines()">Оплатить все (' + fmt(allSum) + ' ₽)</button>' +
      '</div>' +
    '</div>' +
    listHtml +
  '</div>';
}

window.toggleFine = function(idx, val) {
  if (FINES[idx]) FINES[idx].checked = !!val;
  renderAll();
};
window.toggleAllFines = function(val) {
  FINES.forEach(function(f) { f.checked = !!val; });
  renderAll();
};
window.paySelectedFines = function() {
  var sel = FINES.filter(function(f) { return f.checked; });
  if (!sel.length) { toast('Выберите хотя бы один штраф галочкой'); return; }
  var sum = sel.reduce(function(s, x) { return s + x.amount; }, 0);
  if (PLAYER.balance < sum) { toast('Недостаточно средств на счёте'); return; }
  PLAYER.balance -= sum;
  sel.forEach(function(f) {
    HISTORY.unshift({
      date: nowDate(), time: nowTime(), type: 'minus',
      title: 'Оплата штрафа (' + f.sender + ')',
      reason: f.reason + ' (' + f.article + ')',
      amount: f.amount
    });
  });
  FINES = FINES.filter(function(f) { return !f.checked; });
  TARGET_FINE_ID = '';
  renderAll();
  toast('✓ Оплачено штрафов: ' + sel.length + ' шт. на сумму ' + fmt(sum) + ' ₽');
};
window.payAllFines = function() {
  FINES.forEach(function(f) { f.checked = true; });
  paySelectedFines();
};

function renderHousingSection() {
  var cards = PROPERTIES.map(function(p, idx) {
    var daysLeft = Math.floor(p.deposit / p.ratePerDay);
    var pct = Math.min(100, Math.round((daysLeft / p.maxDays) * 100));
    return '<div class="prop-card">' +
      '<div class="prop-head">' +
        '<div><b>🏠 ' + p.type + '</b><span>' + p.address + '</span></div>' +
        '<span class="prop-days">Оплачено: ' + daysLeft + ' из ' + p.maxDays + ' дн.</span>' +
      '</div>' +
      '<div class="prop-bar"><div style="width:' + pct + '%"></div></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut)">' +
        '<span>Тариф ЖКХ: <b style="color:var(--txt)">' + fmt(p.ratePerDay) + ' ₽/сут.</b></span>' +
        '<span>Депозит: <b style="color:var(--green)">' + fmt(p.deposit) + ' ₽</b></span>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px">' +
        '<button class="btn slim" onclick="topUpHousing(' + idx + ', 7)">+7 дн. (' + fmt(p.ratePerDay * 7) + ' ₽)</button>' +
        '<button class="btn blue slim" onclick="topUpHousing(' + idx + ', 14)">+14 дн. (' + fmt(p.ratePerDay * 14) + ' ₽)</button>' +
        '<button class="btn ghost slim" onclick="topUpHousingMax(' + idx + ')">Макс. (30 дн.)</button>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="b-panel">' +
    '<div class="b-h1">🏠 ЖКХ</div>' +
    '<div class="b-sub">Пополнение депозита за жильё со счёта №' + PLAYER.account + '</div>' +
    '<div class="b-grid2">' + cards + '</div>' +
  '</div>';
}

window.topUpHousing = function(idx, days) {
  var p = PROPERTIES[idx]; if (!p) return;
  var maxDep = p.ratePerDay * p.maxDays;
  var cost = p.ratePerDay * days;
  if (p.deposit + cost > maxDep) cost = Math.max(0, maxDep - p.deposit);
  if (cost <= 0) { toast('Жильё уже оплачено на 30 дней'); return; }
  if (PLAYER.balance < cost) { toast('Недостаточно средств на счёте'); return; }
  PLAYER.balance -= cost;
  p.deposit += cost;
  HISTORY.unshift({
    date: nowDate(), time: nowTime(), type: 'minus',
    title: 'Пополнение депозита ЖКХ (' + p.type + ')',
    reason: 'Оплата коммунальных услуг',
    amount: cost
  });
  renderAll();
  toast('✓ Депозит ЖКХ пополнен на ' + fmt(cost) + ' ₽');
};
window.topUpHousingMax = function(idx) { topUpHousing(idx, 30); };

/* Пункт 8: В разделе переводов и наличных также убран дубляж баланса */
function renderTransferSection() {
  return '<div class="b-panel">' +
    '<div class="b-h1">💸 Перевод по номеру счёта</div>' +
    '<div class="b-sub">Ваш счёт отправителя: <b>№ ' + PLAYER.account + ' (' + PLAYER.name + ')</b></div>' +
    '<div class="b-grid2">' +
      '<div><label class="flab">Банковский счёт получателя *</label><input class="inp" id="trAcc" maxlength="6" placeholder="Например: 123456"></div>' +
      '<div><label class="flab">Сумма перевода, ₽ *</label><input class="inp" id="trAmt" type="number" value="50000" min="100" step="1000"></div>' +
      '<div style="grid-column:1/-1"><label class="flab">Причина / комментарий к переводу *</label><input class="inp" id="trReason" placeholder="Например: Личный перевод / Покупка имущества"></div>' +
    '</div>' +
    '<div style="margin-top:14px"><button class="btn" onclick="doTransfer()">💸 Отправить перевод</button></div>' +
  '</div>' +
  '<div class="b-panel">' +
    '<div class="b-h1">🏧 Операции с наличными</div>' +
    '<div class="b-sub">Внесение наличных на банковский счёт или снятие средств</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
      '<input class="inp" id="cashAmt" type="number" value="100000" style="max-width:200px">' +
      '<button class="btn" onclick="doCashOp(\'in\')">➕ Пополнить счёт</button>' +
      '<button class="btn blue" onclick="doCashOp(\'out\')">➖ Снять наличные</button>' +
    '</div>' +
  '</div>';
}

window.doTransfer = function() {
  var acc = (document.getElementById('trAcc').value || '').trim();
  var amt = parseInt(document.getElementById('trAmt').value, 10) || 0;
  var rsn = (document.getElementById('trReason').value || '').trim();
  if (!/^\d{6}$/.test(acc)) { toast('Введите 6-значный номер счёта (например: 123456)'); return; }
  if (acc === PLAYER.account) { toast('Нельзя перевести на собственный счёт'); return; }
  if (amt <= 0 || amt > PLAYER.balance) { toast('Некорректная сумма или недостаточно средств'); return; }
  if (!rsn) { toast('Укажите причину перевода'); return; }
  PLAYER.balance -= amt;
  HISTORY.unshift({
    date: nowDate(), time: nowTime(), type: 'minus',
    title: 'Перевод на счёт №' + acc + (KNOWN_ACCOUNTS[acc] ? ' (' + KNOWN_ACCOUNTS[acc] + ')' : ''),
    reason: rsn,
    amount: amt
  });
  renderAll();
  toast('✓ Перевод ' + fmt(amt) + ' ₽ на счёт №' + acc + ' выполнен');
};

window.doCashOp = function(dir) {
  var amt = parseInt(document.getElementById('cashAmt').value, 10) || 0;
  if (amt <= 0) return;
  if (dir === 'in') {
    if (PLAYER.cash < amt) { toast('Недостаточно наличных на руках'); return; }
    PLAYER.cash -= amt; PLAYER.balance += amt;
    HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'plus', title: 'Пополнение банковского счёта №' + PLAYER.account, reason: 'Внесение наличных', amount: amt });
    toast('✓ Счёт пополнен на ' + fmt(amt) + ' ₽');
  } else {
    if (PLAYER.balance < amt) { toast('Недостаточно средств на счёте'); return; }
    PLAYER.balance -= amt; PLAYER.cash += amt;
    HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'minus', title: 'Снятие наличных со счёта №' + PLAYER.account, reason: 'Выдача наличных', amount: amt });
    toast('✓ Снято наличными: ' + fmt(amt) + ' ₽');
  }
  renderAll();
};

function renderDepositsSection() {
  var list = DEPOSITS.map(function(d, idx) {
    return '<div class="prop-card">' +
      '<div class="prop-head"><div><b>📈 ' + d.name + '</b><span>Открыт: ' + d.since + ' · Ставка: ' + d.rate + '</span></div><span class="prop-days">Активен</span></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:13px">' +
        '<span>Сумма: <b style="color:#fff">' + fmt(d.amount) + ' ₽</b></span>' +
        '<span>Проценты: <b style="color:var(--green)">+' + fmt(d.profit) + ' ₽</b></span>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn slim" onclick="topUpDeposit(' + idx + ')">➕ Пополнить (+100 000 ₽)</button>' +
        '<button class="btn ghost slim" onclick="closeDeposit(' + idx + ')">Закрыть вклад</button>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="b-panel">' +
    '<div class="b-h1">📈 Банковские вклады</div>' +
    '<div class="b-sub">Управление сбережениями по счёту №' + PLAYER.account + '</div>' +
    (list ? '<div class="b-grid2" style="margin-bottom:14px">' + list + '</div>' : '<div style="margin-bottom:14px;color:var(--mut)">Активных вкладов нет</div>') +
    '<button class="btn blue" onclick="openNewDeposit()">＋ Открыть вклад «Премиум 10%» (500 000 ₽)</button>' +
  '</div>';
}

window.topUpDeposit = function(idx) {
  var d = DEPOSITS[idx]; if (!d || PLAYER.balance < 100000) return;
  PLAYER.balance -= 100000; d.amount += 100000;
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'minus', title: 'Пополнение вклада «' + d.name + '»', reason: 'Перевод со счёта №' + PLAYER.account, amount: 100000 });
  renderAll(); toast('✓ Вклад пополнен на 100 000 ₽');
};
window.closeDeposit = function(idx) {
  var d = DEPOSITS[idx]; if (!d) return;
  var total = d.amount + d.profit;
  PLAYER.balance += total;
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'plus', title: 'Закрытие вклада «' + d.name + '»', reason: 'Возврат вклада и процентов', amount: total });
  DEPOSITS.splice(idx, 1);
  renderAll(); toast('✓ Зачислено ' + fmt(total) + ' ₽');
};
window.openNewDeposit = function() {
  if (PLAYER.balance < 500000) { toast('Необходимо минимум 500 000 ₽'); return; }
  PLAYER.balance -= 500000;
  DEPOSITS.push({ id: 'd' + Date.now(), name: 'Вклад «Премиум»', rate: '10% годовых', amount: 500000, profit: 0, since: nowDate(), canTopUp: true });
  HISTORY.unshift({ date: nowDate(), time: nowTime(), type: 'minus', title: 'Открытие вклада «Премиум»', reason: 'Размещение под 10% годовых', amount: 500000 });
  renderAll(); toast('✓ Открыт вклад на 500 000 ₽');
};

function txRowHtml(tx) {
  var isPlus = tx.type === 'plus';
  return '<div class="tx-row">' +
    '<div class="tx-left">' +
      '<div class="tx-ic">' + (isPlus ? '📥' : '📤') + '</div>' +
      '<div>' +
        '<div class="tx-title">' + tx.title + '</div>' +
        '<div class="tx-sub">' + tx.date + ' в ' + tx.time + ' · Причина: <b>' + tx.reason + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="tx-amt ' + tx.type + '">' + (isPlus ? '+' : '−') + fmt(tx.amount) + ' ₽</div>' +
  '</div>';
}

function renderHistorySection() {
  return '<div class="b-panel">' +
    '<div class="b-h1">📜 История переводов и пополнений</div>' +
    '<div class="b-sub">Выписка по счёту <b>№ ' + PLAYER.account + ' (' + PLAYER.name + ')</b></div>' +
    HISTORY.map(txRowHtml).join('') +
  '</div>';
}

function renderAll() {
  document.getElementById('terminalWrap').style.display = (VIEW_MODE === 'terminal') ? 'grid' : 'none';
  document.getElementById('phoneWrap').style.display = (VIEW_MODE === 'phone') ? 'flex' : 'none';

  document.getElementById('uiAccNum').textContent = PLAYER.account;
  document.getElementById('uiBalance').textContent = fmt(PLAYER.balance) + ' ₽';
  document.getElementById('uiCash').textContent = fmt(PLAYER.cash) + ' ₽';

  document.getElementById('deskNav').innerHTML = NAV_ITEMS.map(function(it) {
    var bdg = (it[0] === 'fines' && FINES.length) ? '<span class="bdg">' + FINES.length + '</span>' : '';
    return '<div class="b-ni' + (CUR_TAB === it[0] ? ' on' : '') + '" onclick="goTab(\'' + it[0] + '\')"><span>' + it[1] + '</span><span>' + it[2] + '</span>' + bdg + '</div>';
  }).join('');

  var contentHtml = buildSectionHtml();
  document.getElementById('deskMain').innerHTML = contentHtml;

  /* В мобильном приложении: карточка счёта в стиле скриншота + сетка меню 3x2 прямо на видном месте */
  var mobCard = '<div class="b-card-widget">' +
    '<div class="bc-top-row">' +
      '<div><div class="bc-lbl">ВЛАДЕЛЕЦ<br>СЧЁТА</div><div class="bc-owner">Евгений<br>Холмс</div></div>' +
      '<div class="bc-acc" onclick="copyAcc()">💳 №<b>' + PLAYER.account + '</b></div>' +
    '</div>' +
    '<div class="bc-sums-grid">' +
      '<div class="bc-sum-item"><div class="s-l">НА СЧЁТЕ</div><div class="s-v green">' + fmt(PLAYER.balance) + ' ₽</div></div>' +
      '<div class="bc-sum-item"><div class="s-l">НАЛИЧНЫЕ</div><div class="s-v gold">' + fmt(PLAYER.cash) + ' ₽</div></div>' +
    '</div>' +
  '</div>';

  var mobMenuGrid = '<div class="sp-menu-grid">' + NAV_ITEMS.map(function(t) {
    var bdg = (t[0] === 'fines' && FINES.length) ? '<span class="m-bdg">' + FINES.length + '</span>' : '';
    return '<div class="sp-mbtn' + (CUR_TAB === t[0] ? ' on' : '') + '" onclick="goTab(\'' + t[0] + '\')">' + bdg + '<i>' + t[1] + '</i><span>' + t[2] + '</span></div>';
  }).join('') + '</div>';

  document.getElementById('mobileMain').innerHTML = mobCard + mobMenuGrid + contentHtml;
}

renderAll();
</script>
</body>
</html>
